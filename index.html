                ${data.plan.map((t, i) => html`<div key=${i} className="bill-row flex items-center gap-1.5 min-w-0" style=${d()}>
                  <span className="text-[12.5px] font-semibold truncate">${firstName(data.nm(t.from))}</span>
                  <span className="text-[#8B8272] shrink-0"><${Icon} name="arrR" size=${12} sw=${2.4}/></span>
                  <span className="text-[12.5px] font-semibold truncate">${firstName(data.nm(t.to))}</span>
                  <span className="bill-leader"></span>
                  <span className="text-[13px] font-bold numtab shrink-0">${fmt(t.amount)}</span>
                </div>`)}
              </div>` : html`<p className="mt-2 text-[12px] font-semibold text-[#1D8A48]">Everyone is settled up — nothing to pay.</p>`}
              ${data.sets.length > 0 && html`<div className="mt-3 pt-3 border-t border-dashed border-[#26221B]/15 space-y-1.5">
                <div className="text-[9.5px] font-bold tracking-[.22em] uppercase text-[#8B8272]">Already settled</div>
                ${data.sets.map(s => html`<div key=${s.id} className="bill-row flex items-baseline text-[11px] text-[#7D7463] numtab" style=${d()}>
                  <span className="truncate">${sheetDate(s.date)} — ${data.nm(s.fromId)} paid ${data.nm(s.toId)}</span>
                  <span className="bill-leader"></span>
                  <span className="font-semibold shrink-0">${fmt(+s.amount || 0)}</span>
                </div>`)}
              </div>`}
              <p className="mt-3 text-[10.5px] text-[#8B8272] leading-relaxed">Settle in cash or any UPI app — record every repayment under Settle up and this bill stays true.</p>
            </div>

            <div className="mt-6 pt-4 border-t-2 border-dashed border-[#26221B]/15 text-center">
              <div className="bill-barcode mx-auto w-[72%] rounded-sm"></div>
              <div className="mt-2 text-[10px] font-bold tracking-[.34em] numtab text-[#7D7463]">${(group.shareCode && group.shareCode.code) || String(group.id || 'SPLID').toUpperCase()}</div>
              <div className="mt-2.5 text-[12px] font-bold">Thank you — keep splitting, keep smiling.</div>
              <div className="mt-1 text-[9.5px] tracking-[.18em] uppercase text-[#8B8272]">Printed by Splid · ${today}</div>
            </div>
          </div>
        </div>
        <div className="bill-tear"></div>
      </div>
    </div>

    <div className="absolute top-0 inset-x-0 z-20 flex justify-center pointer-events-none">
      <div className="bill-machine w-full max-w-[430px] px-4">
        <div className="rounded-b-2xl bg-gradient-to-b from-[#332B20] to-[#1C1711] border-x border-b border-black/50 shadow-[0_22px_44px_-14px_rgba(0,0,0,.8)] px-5 pt-3">
          <div className="flex items-center gap-2 pb-2.5">
            <span className=${'w-1.5 h-1.5 rounded-full shrink-0 ' + (printed ? 'bg-[#3DDC5C]' : 'bg-[#E14B4F] live-dot')}></span>
            <span className="text-[8.5px] font-bold tracking-[.3em] text-[#A79D8B] uppercase shrink-0">${printed ? 'Bill ready' : 'Printing'}</span>
            <span className="ml-auto text-[8.5px] font-bold tracking-[.2em] text-[#6B6252] numtab">BILL·TERM 01</span>
          </div>
          <div className="h-[9px] rounded-md bg-[#0B0906] shadow-[inset_0_2px_5px_rgba(0,0,0,.9)]"></div>
        </div>
      </div>
    </div>

    <button onClick=${onClose} aria-label="Close bill preview"
      className="absolute top-3 right-3 z-30 w-9 h-9 rounded-full bg-black/40 border border-white/15 text-[#F6F1E8] flex items-center justify-center hover:bg-black/60 transition active:scale-95">
      <${Icon} name="x" size=${16}/>
    </button>

    ${printed && html`<div className="absolute bottom-0 inset-x-0 z-30 p-4 pb-6 flex justify-center">
      <div className="bill-fade flex items-center gap-2.5 rounded-full bg-[#211B14]/95 border border-white/10 shadow-pop px-2 py-2" style=${{ animationDelay:'100ms' }}>
        <button onClick=${onDownload}
          className="inline-flex items-center gap-2 rounded-full bg-[#F6F1E8] text-[#26221B] pl-3.5 pr-4 py-2.5 text-[12.5px] font-bold hover:bg-white transition active:scale-95">
          <${Icon} name="sheet" size=${13} sw=${2.4}/> Download Excel
        </button>
        <button onClick=${onClose}
          className="rounded-full border border-white/15 text-[#F6F1E8] px-4 py-2.5 text-[12.5px] font-semibold hover:bg-white/10 transition active:scale-95">Close</button>
      </div>
    </div>`}
  </div>`;
}

/* ---------------- app ---------------- */

function App() {
  const [db, setDb] = useState(() => {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.groups && d.groups.length) { if (!d.deviceId) d.deviceId = uid(); if (!d.chat) d.chat = freshChat(); return d; } }
    } catch (e) {}
    return freshDemoDb();
  });
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }, [db]);

  const group = db.groups[0];
  const [tab, setTab] = useState('balance');
  const [selected, setSelected] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const [tourOpen, setTourOpen] = useState(!db.tourDone);
  const [appSetOpen, setAppSetOpen] = useState(false);
  /* light & dark mode — one class on <html> swaps every color through the CSS variables */
  const [theme, setTheme] = useState(() => { try { return localStorage.getItem('hisaab.theme') === 'dark' ? 'dark' : 'light'; } catch (e) { return 'light'; } });
  const applyTheme = t => {
    setTheme(t);
    try { localStorage.setItem('hisaab.theme', t); } catch (e) {}
    document.documentElement.classList.toggle('dark', t === 'dark');
    const mv = document.querySelector('meta[name="theme-color"]');
    if (mv) mv.setAttribute('content', t === 'dark' ? '#181512' : '#F6F1E8');
  };

  const showToast = (msg, icon) => {
    const key = Date.now();
    setToast({ key, msg, icon });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  };

  const byId = useMemo(() => Object.fromEntries(group.members.map(m => [m.id, m])), [group.members]);
  const { edges, net } = useMemo(() => computePairwise(group), [group]);
  const simplified = useMemo(() => simplify(net), [net]);
  const total = useMemo(() => group.expenses.reduce((s, e) => s + (+e.amount || 0), 0), [group.expenses]);

  /* live sync state */
  const pendingPush = useRef(false);
  const lastInvited = useRef([]);        /* chatIds the current trip was last invited to */
  const lastReqSent = useRef({});        /* chatId -> reqId of join requests last published for the current trip */
  const groupsRef = useRef(db.groups); groupsRef.current = db.groups;
  const inviteSeen = useRef(new Set());  /* trip invites already landed — no repeat toasts */
  const groupRef = useRef(group); groupRef.current = group;
  const deviceRef = useRef(db.deviceId); deviceRef.current = db.deviceId;
  const hashRef = useRef('');
  const clientRef = useRef(null);
  const subRef = useRef(null);
  const [liveOn, setLiveOn] = useState(false);
  useEffect(() => { hashRef.current = hashStr(JSON.stringify(group)); }, [group]);

  const ensureLive = () => {
    if (clientRef.current) return clientRef.current;
    const c = mqtt.connect(MQTT_URL, { clientId: 'splid-' + uid(), keepalive: 30, reconnectPeriod: 3000, connectTimeout: 8000 });
    c.on('connect', () => setLiveOn(true));
    c.on('close', () => setLiveOn(false));
    c.on('message', (t, payload) => {
      let d;
      try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!d || d.app !== 'splid') return;
      if (d.ended) {
        const g = groupRef.current;
        if (g.shareCode && g.shareCode.id === t) {
          patchGroup(x => { const { shareCode, ...rest } = x; return rest; });
          showToast('Owner stopped sharing this trip');
        }
        return;
      }
      if (t !== (groupRef.current.shareCode && groupRef.current.shareCode.id)) return;
      if (d.updatedBy === deviceRef.current) return;
      if (!d.group || !Array.isArray(d.group.members)) return;
      if (hashStr(JSON.stringify(d.group)) === hashRef.current) return;
      setDb(x => ({ ...x, groups: [d.group, ...x.groups.slice(1)] }));
      showToast('Trip updated live', 'sparkle');
    });
    clientRef.current = c;
    return c;
  };
  useEffect(() => () => { if (clientRef.current) { try { clientRef.current.end(true); } catch (e) {} } }, []);

  /* subscribe to the current trip's topic */
  useEffect(() => {
    const sc = group.shareCode;
    if (!sc) return;
    const c = ensureLive();
    if (subRef.current !== sc.id) {
      if (subRef.current) { try { c.unsubscribe(subRef.current); } catch (e) {} }
      try { c.subscribe(sc.id, { qos: 0 }); } catch (e) {}
      subRef.current = sc.id;
    }
  }, [group.shareCode]);

  const patchGroup = fn => setDb(d => ({ ...d, groups: d.groups.map((g, i) => i === 0 ? fn(g) : g) }));

  /* ---------------- splid chat engine ---------------- */

  const chat = db.chat || freshChat();
  const patchChat = fn => setDb(d => ({ ...d, chat: fn(d.chat || freshChat()) }));
  const chatUnread = Object.values((db.chat || {}).unread || {}).reduce((s, n) => s + (n || 0), 0);
  /* lifetime numbers for App Settings — trips, everything spent, and what YOU paid */
  const lifeStats = React.useMemo(() => {
    let allSpent = 0, mySpent = 0, myCount = 0;
    const myId = chat && chat.me ? normId(chat.me.id) : null;
    (db.groups || []).forEach(g => {
      const ms = g.members || [];
      const you = (myId && ms.find(m => m && m.chatId === myId)) || ms[0] || null;
      (g.expenses || []).forEach(e => {
        const amt = +e.amount || 0; allSpent += amt;
        if (you && e.payerId === you.id) { mySpent += amt; myCount++; }
      });
    });
    return { n: (db.groups || []).length, allSpent: round2(allSpent), mySpent: round2(mySpent), myCount };
  }, [db.groups, chat && chat.me && chat.me.id]);

  const [chatOpen, setChatOpen] = useState(false);
  const [chatView, setChatView] = useState('home');
  const [chatOn, setChatOn] = useState(false);
  const [chatDir, setChatDir] = useState({});   /* owner HQ: every dir entry on the network, id → entry */
  const [chatEmails, setChatEmails] = useState(() => { try { return JSON.parse(localStorage.getItem(EMAILREG_KEY) || '{}') || {}; } catch (e) { return {}; } });   /* owner HQ: email handles collected from users */
  useEffect(() => { try { localStorage.setItem(EMAILREG_KEY, JSON.stringify(chatEmails)); } catch (e) {} }, [chatEmails]);   /* keep the owner's copy across sessions */
  const [chatBc, setChatBc] = useState(null);   /* the owner's live broadcast, if any */
  const [chatRemoved, setChatRemoved] = useState({}); /* owner HQ: removal tombstones seen on the network, id → payload */
  const [bcSeen, setBcSeen] = useState(() => { try { return localStorage.getItem(BC_SEEN_KEY) || ''; } catch (e) { return ''; } });
  const [presence, setPresence] = useState({});
  const [typing, setTyping] = useState({});
  const chatClientRef = useRef(null);
  const chatSubsRef = useRef(new Set());
  const removedIdsRef = useRef(new Set());      /* IDs known to be removed by the owner — this device never re-announces them */
  const chatRef = useRef(chat); chatRef.current = chat;
  const chatOpenRef = useRef(false); chatOpenRef.current = chatOpen;
  const chatThreadRef = useRef(null); chatThreadRef.current = chatView === 'home' ? null : chatView;
  const typSentRef = useRef({});
  const restoreRef = useRef(false);   // true while a cloud sign-in restore is landing — pause state pushes
  const stateTimerRef = useRef(null);

  const chatPublish = (topic, obj, retain) => {
    const c = chatClientRef.current; if (!c) return false;
    try { c.publish(topic, obj === null ? '' : JSON.stringify(obj), { qos: 0, retain: !!retain }); return true; } catch (e) { return false; }
  };
  /* the email handle saved in App Settings rides to the owner registry under this ID — one small
     retained message; DEVANSHU (and every owner device) picks it up on the emails feed */
  const publishMyEmail = () => {
    const me = chatRef.current.me; if (!me) return false;
    let em = ''; try { em = (localStorage.getItem('hisaab.email') || '').trim(); } catch (e) {}
    if (!em || !/^\S+@\S+\.\S+$/.test(em)) return false;
    const ok = chatPublish(EMAIL_TOPIC(me.id), { app: 'splidchat', type: 'email-reg', id: normId(me.id), name: me.name || '', email: em, at: Date.now() }, true);
    if (ok) { try { localStorage.removeItem(EMAIL_PENDING_KEY); } catch (e) {} }
    return ok;
  };
  /* App Settings calls this — saves locally first, then ships to the owner while the network is up;
     offline saves keep a pending flag and ship by themselves on the next connect */
  const saveUserEmail = v => {
    try { localStorage.setItem('hisaab.email', v); } catch (e) {}
    const me = chatRef.current.me;
    const ok = !!me && publishMyEmail();
    if (!ok) { try { localStorage.setItem(EMAIL_PENDING_KEY, '1'); } catch (e) {} }
    return ok ? 'sent' : 'queued';
  };
  const meCard = me => ({ id: me.id, name: me.name, color: me.color });
  /* answer a trip join request from App Settings — the answer rides to the sender's inbox as
     one retained message; approved trips get pushed over right after, and the retained request
     is pulled back so it never shows again */
  const answerTripReq = (req, ok) => {
    const me = chatRef.current.me; if (!me || !req || !req.reqId || !req.from || !req.from.id) return;
    chatPublish(cTopic('inbox', req.from.id, ok ? 'tripacc' : 'tripdec', req.reqId), { app: 'splidchat', type: ok ? 'trip-acc' : 'trip-dec', reqId: req.reqId, tripId: req.tripId, by: { ...meCard(me), pic: me.pic || '' } }, true);
    chatPublish(JREQ_TOPIC(me.id, req.reqId), null, true);
    patchChat(c => {
      const tr = { ...(c.tripReqs || {}) }; delete tr[req.reqId];
      const dc = { ...(c.tripReqDec || {}) }; if (!ok) dc[req.reqId] = 1;
      return { ...c, tripReqs: tr, tripReqDec: dc };
    });
    if (ok) showToast('Approved — ' + (req.tripName || 'the trip') + ' lands in a moment', 'check');
    else showToast('Declined — nothing was shared', 'x');
  };

  /* owner-directory entry — one small retained beacon per ID. on=1 while this device is live,
     refreshed by a heartbeat every 2 min; logout / tab close / account delete flip it to on=0.
     Carries NO passwords, requests or chats — only what add-friend already shares publicly. */
  const dirPublish = on => {
    const me = chatRef.current.me; if (!me) return;
    if (removedIdsRef.current.has(normId(me.id))) return;   /* removed by the owner — never re-beacon */
    let joined = me.joinedAt;
    if (!joined) {
      const v = vaultGet(me.id);
      joined = (v && v.joinedAt) || Date.now();
      if (!v || !v.joinedAt) vaultPut(me.id, { joinedAt: joined });
      patchChat(c => (c.me && !c.me.joinedAt) ? { ...c, me: { ...c.me, joinedAt: joined } } : c);
    }
    const fr = Object.keys(chatRef.current.friends || {}).length;
    chatPublish(DIR_TOPIC(me.id), { app: 'splidchat', type: 'dir', id: me.id, name: me.name, color: me.color, pic: me.pic || '', joined, at: Date.now(), on: on ? 1 : 0, fr }, true);
  };
  const rescanDir = async () => {
    const res = await scanDir(5200);
    if (res && Object.keys(res).length) setChatDir(p => ({ ...p, ...res }));
    return res ? Object.keys(res).length : 0;
  };
  const rescanEmails = async () => {
    const res = await scanEmails(5200);
    if (res && Object.keys(res).length) setChatEmails(p => ({ ...p, ...res }));
    return res ? Object.keys(res).length : 0;
  };
  const ownerAddFriend = async id => {
    try { const p = await sendFriendReq(id); showToast('Request sent to ' + firstName(p.name || p.id), 'userPlus'); }
    catch (e) {
      const msg = { bad: 'That ID looks wrong', offline: 'Chat network is offline', self: "That's you", already: 'Already friends', pending: 'Request already pending', incoming: 'They already requested you — check Requests', notfound: 'No Splid profile found for that ID' }[e] || 'Could not send the request';
      showToast(msg, 'x');
    }
  };

  /* owner power: remove a Splid ID from the whole network — wipes its retained identity, cloud snapshot,
     presence, directory beacon and inbox, then leaves a retained tombstone so every device (including
     theirs) learns the account is gone. The ID stays unusable until the owner restores it. */
  const ownerRemoveId = id => {
    const me = chatRef.current.me; const clean = normId(id);
    if (!me || !isOwnerId(me.id) || !clean) return;
    if (clean === normId(me.id)) { showToast('The owner ID cannot remove itself', 'x'); return; }
    if (!chatPublish(REMOVED_TOPIC(clean), { app: 'splidchat', type: 'removed', id: clean, by: me.id, name: (chatDir[clean] && chatDir[clean].name) || '', ts: Date.now() }, true)) {
      showToast('Chat network is offline — connect first, then remove', 'x'); return;
    }
    chatPublish(cTopic('profile', clean), null, true);   /* identity + password proof gone network-wide */
    chatPublish(cTopic('state', clean), null, true);     /* cloud snapshot gone */
    chatPublish(cTopic('presence', clean), '', true);
    chatPublish(DIR_TOPIC(clean), null, true);           /* the directory forgets this ID */
    chatPublish(EMAIL_TOPIC(clean), null, true);         /* the owner's email registry forgets this ID too */
    setChatEmails(p => { if (!p[clean]) return p; const n = { ...p }; delete n[clean]; return n; });
    try {                                                 /* sweep every retained message left in their inbox */
      const w = mqtt.connect(MQTT_URL, { clientId: 'splidr-' + uid(), keepalive: 10, reconnectPeriod: 0, connectTimeout: 6000 });
      const root = cTopic('inbox', clean, '');
      w.on('connect', () => { try { w.subscribe(root + '#', { qos: 0 }); } catch (e) {} });
      w.on('message', t => { if (t.indexOf(root) === 0) { try { w.publish(t, '', { qos: 0, retain: true }); } catch (e) {} } });
      setTimeout(() => { try { w.end(true); } catch (e) {} }, 6000);
    } catch (e) {}
    setChatDir(p => { if (!p[clean]) return p; const n = { ...p }; delete n[clean]; return n; });
    showToast(chunkCode(clean) + ' was removed from Splid', 'trash');
  };
  /* owner mercy: clear a removal tombstone — the ID becomes creatable again (fresh start, old data stays gone) */
  const ownerRestoreId = id => {
    const clean = normId(id); if (!clean) return;
    if (!chatPublish(REMOVED_TOPIC(clean), null, true)) { showToast('Chat network is offline — connect first', 'x'); return; }
    setChatRemoved(p => { if (!p[clean]) return p; const n = { ...p }; delete n[clean]; return n; });
    showToast(chunkCode(clean) + ' is free to register again', 'check');
  };

  /* ---- file attachments (bytes go P2P over WebRTC; MQTT carries only signals) ---- */
  const [xfers, setXfers] = useState({});
  const xfRef = useRef({}); xfRef.current = xfers;
  const outFiles = useRef(new Map());   // mid -> File handle on this device
  const pcs = useRef(new Map());        // mid -> { pc, dc, role, open, done, cands }
  const inBufs = useRef(new Map());     // mid -> receiver reassembly buffer
  const pullTimers = useRef(new Map());

  const setXfer = (mid, patch) => setXfers(x => ({ ...x, [mid]: { ...(x[mid] || {}), ...patch } }));
  const teardownXfer = mid => {
    const p = pcs.current.get(mid);
    if (p) { try { if (p.dc) p.dc.close(); } catch (e) {} try { if (p.pc) p.pc.close(); } catch (e) {} pcs.current.delete(mid); }
    inBufs.current.delete(mid);
    const t = pullTimers.current.get(mid);
    if (t) { clearTimeout(t); pullTimers.current.delete(mid); }
  };

  /* pick a file (any type, ≤200 MB) and drop the metadata offer into the friend's inbox */
  const attachFile = (peerId, file) => {
    const me = chatRef.current.me;
    if (!me || !file) return;
    if (file.size > FILE_MAX) { showToast('Too large — files can be up to 200 MB', 'x'); return; }
    const mid = uid() + Date.now().toString(36);
    const meta = { name: String(file.name || 'file').slice(0, 120), size: file.size || 0, mime: file.type || '', ts: Date.now() };
    outFiles.current.set(mid, file);
    const ok = chatPublish(cTopic('inbox', peerId, 'off', mid), { app: 'splidchat', type: 'file-offer', id: mid, from: meCard(me), ...meta }, true);
    if (!ok) { outFiles.current.delete(mid); showToast('Chat is offline — try again when live', 'x'); return; }
    patchChat(c => {
      const th = { ...(c.threads || {}) };
      th[peerId] = [...(th[peerId] || []), { id: mid, mine: true, kind: 'file', ...meta }].slice(-300);
      return { ...c, threads: th };
    });
  };

  /* receiver side: ask the sender's device to start streaming this file */
  const startDownload = (peerId, mid) => {
    const me = chatRef.current.me;
    if (!me || pcs.current.has(mid)) return;
    const st = (xfRef.current[mid] || {}).status;
    if (st === 'wait' || st === 'run' || st === 'done') return;
    const old = pullTimers.current.get(mid); if (old) clearTimeout(old);
    setXfer(mid, { status: 'wait', pct: 0, err: '' });
    const ok = chatPublish(cTopic('inbox', peerId, 'pull', mid), { app: 'splidchat', type: 'file-pull', id: mid, from: me.id }, false);
    if (!ok) { setXfer(mid, { status: 'err', err: 'offline' }); return; }
    const t = setTimeout(() => {
      const p = pcs.current.get(mid);
      if (!p || !p.open) { setXfer(mid, { status: 'err', err: 'wake' }); teardownXfer(mid); }
    }, 15000);
    pullTimers.current.set(mid, t);
  };

  /* sender side: serve a pulled file over a chunked, backpressured data channel */
  const beginCarrier = (peerId, mid) => {
    const me = chatRef.current.me;
    if (!me || pcs.current.has(mid)) return;
    const file = outFiles.current.get(mid);
    if (!file) {
      chatPublish(cTopic('inbox', peerId, 'gone', mid), { app: 'splidchat', type: 'file-gone', id: mid, from: me.id }, false);
      return;
    }
    let pc;
    try { pc = new RTCPeerConnection({ iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] }); }

    if (topic === cTopic('profile', me.id)) {

      if (d && d.profile && d.profile.dev && me.dev && d.profile.dev !== me.dev) {
        patchChat(c => {
          if (!c.me) return c;
          return { ...c, me: { ...c.me, name: d.profile.name || c.me.name, color: d.profile.color || c.me.color, pic: d.profile.pic !== undefined ? (d.profile.pic || '') : (c.me.pic || '') } };
        });
        showToast('This ID is also active on another device', 'users');
      }
      return;
    }
    let m = topic.match(/^splidchat\/v1\/presence\/([A-Z0-9]+)$/);
    if (m && chatRef.current.friends[m[1]]) {
      setPresence(p => ({ ...p, [m[1]]: payload.toString().length > 0 }));
      return;
    }
    m = topic.match(/^splidchat\/v1\/profile\/([A-Z0-9]+)$/);
    if (m && payload.toString()) {
      let d; try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (d && d.profile && d.profile.id) {
        if (chatRef.current.friends[m[1]]) patchChat(c => {
          const fr = { ...(c.friends || {}) }; const f = fr[d.profile.id]; if (!f) return c;
          fr[d.profile.id] = { ...f, name: d.profile.name || f.name, color: d.profile.color || f.color, pic: d.profile.pic !== undefined ? (d.profile.pic || '') : (f.pic || '') };
          return { ...c, friends: fr };
        });
        /* owner: every profile on the wire feeds the registry — offline and never-friended IDs included;
           salt/hash/dev never make it into the directory map */
        if (isOwnerId(me.id) && m[1] !== normId(me.id)) {
          setChatDir(p => {
            const prev = p[d.profile.id] || {};
            return { ...p, [d.profile.id]: { type: 'dir', id: d.profile.id,
              name: prev.name || d.profile.name || '', color: prev.color || d.profile.color || '',
              pic: prev.pic !== undefined ? prev.pic : (d.profile.pic || ''),
              joined: prev.joined, fr: prev.fr, on: prev.on,
              at: prev.at || d.updatedAt || Date.now() } };
          });
        }
      }
      return;
    }
    m = topic.match(/^splidchat\/v1\/dir\/([A-Z0-9]+)$/);
    if (m) {
      const s = payload.toString();
      if (!s) { setChatDir(p => { if (!p[m[1]]) return p; const n = { ...p }; delete n[m[1]]; return n; }); return; }
      let d; try { d = JSON.parse(s); } catch (e) { return; }
      if (d && d.type === 'dir' && d.id === m[1]) setChatDir(p => ({ ...p, [d.id]: d }));
      return;
    }
    m = topic.match(/^splidchat\/v1\/removed\/([A-Z0-9]+)$/);
    if (m) {
      const s = payload.toString();
      if (!s) {   /* tombstone cleared — the owner restored the ID */
        if (m[1] === me.id) removedIdsRef.current.delete(me.id);
        setChatRemoved(p => { if (!p[m[1]]) return p; const n = { ...p }; delete n[m[1]]; return n; });
        return;
      }
      let d; try { d = JSON.parse(s); } catch (e) { return; }
      if (!d || d.app !== 'splidchat' || d.type !== 'removed' || normId(d.id) !== m[1]) return;
      setChatRemoved(p => ({ ...p, [d.id]: d }));
      setChatDir(p => { if (!p[d.id]) return p; const n = { ...p }; delete n[d.id]; return n; });
      if (d.id === me.id && !removedIdsRef.current.has(me.id)) { removedIdsRef.current.add(me.id); handleSelfRemoved(); }
      return;
    }
    m = topic.match(/^splid\/v1\/emails\/([a-z0-9]+)$/);
    if (m) {   /* email-handle registry — owner devices only (only they subscribe the feed) */
      const s = payload.toString();
      if (!s) { const k = m[1].toUpperCase(); setChatEmails(p => { if (!p[k]) return p; const n = { ...p }; delete n[k]; return n; }); return; }
      let d; try { d = JSON.parse(s); } catch (e) { return; }
      if (d && d.type === 'email-reg' && d.email) setChatEmails(p => ({ ...p, [d.id || m[1].toUpperCase()]: d }));

    }
    if (topic === BROADCAST_TOPIC) {
      const s = payload.toString();
      if (!s) { setChatBc(null); return; }
      let d; try { d = JSON.parse(s); } catch (e) { return; }

      return;
    }
  };

  const connectChat = () => {
    if (chatClientRef.current || typeof mqtt === 'undefined') return;
    const me = chatRef.current.me; if (!me) return;
    let c;
    try {
      c = mqtt.connect(MQTT_URL, {
        clientId: 'splidchat-' + uid(), keepalive: 30, reconnectPeriod: 4000, connectTimeout: 8000, clean: true,
        will: { topic: cTopic('presence', me.id), payload: '', qos: 0, retain: true },
      });
    } catch (e) { return; }
    chatClientRef.current = c;
    c.on('connect', () => {
      setChatOn(true);
      const me2 = chatRef.current.me; if (!me2) return;
      chatSubsRef.current.add(cTopic('inbox', me2.id, '#'));
      chatSubsRef.current.add(tripInboxTopic(me2.id));   /* trip invites from anyone who adds this ID to a trip */
      chatSubsRef.current.add(JREQ_WILD(me2.id));   /* trip join requests addressed to this ID — answered in App settings */
      chatSubsRef.current.add(cTopic('need', me2.id)); /* live handshake listener — answers identity pings */
      chatSubsRef.current.add(cTopic('profile', me2.id));
      chatSubsRef.current.add(cTopic('removed', me2.id)); /* our own tombstone — lands instantly if the owner removed this ID */
      chatSubsRef.current.add(BROADCAST_TOPIC);          /* owner announcements reach every signed-in app */
      if (isOwnerId(me2.id)) { chatSubsRef.current.add(DIR_WILD); chatSubsRef.current.add(REMOVED_WILD); chatSubsRef.current.add(PROFILE_WILD); chatSubsRef.current.add(EMAIL_WILD); } /* owner only: live directory + removal feeds + every profile + the email-handle feed, so the registry stays complete */
      Object.keys(chatRef.current.friends || {}).forEach(f => { chatSubsRef.current.add(cTopic('presence', f)); chatSubsRef.current.add(cTopic('profile', f)); });
      chatSubsRef.current.forEach(t => { try { c.subscribe(t, { qos: 0 }); } catch (e) {} });
      chatPublish(cTopic('presence', me2.id), { app:'splidchat', on: 1, t: Date.now() }, true);
      if (!removedIdsRef.current.has(normId(me2.id))) {   /* a removed ID never re-announces its identity */
        chatPublish(cTopic('profile', me2.id), { app:'splidchat', type:'profile', profile: { id: me2.id, name: me2.name, color: me2.color, pic: me2.pic || '', dev: me2.dev, salt: me2.salt, hash: me2.hash }, updatedAt: Date.now() }, true);
        dirPublish(1);
        publishMyEmail();   /* this device's saved email handle → the owner registry (retained, idempotent) */
      }

    c.on('close', () => setChatOn(false));
    c.on('error', () => {});
    c.on('message', onChatMsg);
  };

  useEffect(() => { if (chat.me && !chatClientRef.current) connectChat(); }, [chat.me && chat.me.id]);

  /* directory heartbeat — while online, keep THIS device's dir entry fresh (last-seen + friends count) */
  useEffect(() => {
    if (!chatOn || !chat.me) return;
    dirPublish(1);
    const iv = setInterval(() => { if (chatRef.current.me && chatClientRef.current) dirPublish(1); }, 120000);
    return () => clearInterval(iv);
  }, [chatOn, chat.me && chat.me.id]);

  /* announcement chime — one toast when a broadcast this user hasn't seen lands */
  useEffect(() => {
    if (!chatBc || !chat.me) return;
    if (isOwnerId(chat.me.id)) return;
    if (bcSeen === chatBc.bid) return;
    showToast('Announcement from ' + firstName((chatBc.from && chatBc.from.name) || 'the owner'), 'sparkle');
  }, [chatBc && chatBc.bid, bcSeen, chat.me && chat.me.id]);

  const friendsSig = Object.keys(chat.friends || {}).sort().join(',');
  useEffect(() => {
    const c = chatClientRef.current; if (!c) return;
    friendsSig.split(',').filter(Boolean).forEach(f => {
      [cTopic('presence', f), cTopic('profile', f)].forEach(t => {
        if (!chatSubsRef.current.has(t)) { chatSubsRef.current.add(t); try { c.subscribe(t, { qos: 0 }); } catch (e) {} }
      });
    });
  }, [friendsSig, chatOn]);

  useEffect(() => {
    const iv = setInterval(() => setTyping(t => {
      const now = Date.now(); let ch = false; const o = {};
      Object.keys(t).forEach(k => { if (t[k] > now) o[k] = t[k]; else ch = true; });
      return ch ? o : t;
    }), 1200);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    const bye = () => {
      const me = chatRef.current.me; const c = chatClientRef.current;
      if (me && c) {
        try { c.publish(DIR_TOPIC(me.id), JSON.stringify({ app: 'splidchat', type: 'dir', id: me.id, name: me.name, color: me.color, pic: me.pic || '', joined: me.joinedAt || Date.now(), at: Date.now(), on: 0, fr: Object.keys((chatRef.current.friends) || {}).length }), { qos: 0, retain: true }); } catch (e) {}
        try { c.publish(cTopic('presence', me.id), '', { qos: 0, retain: true }); } catch (e) {}
        try { c.end(true); } catch (e) {}
      }
    };
    window.addEventListener('beforeunload', bye);
    return () => { window.removeEventListener('beforeunload', bye); if (chatClientRef.current) { try { chatClientRef.current.end(true); } catch (e) {} } };
  }, []);

  /* cloud state sync — debounced retained snapshot so the account can be restored on any device */
  useEffect(() => {
    if (!chat.me || restoreRef.current || !chatOn) return;
    clearTimeout(stateTimerRef.current);
    stateTimerRef.current = setTimeout(() => {
      const me = chatRef.current.me;
      if (!me || restoreRef.current) return;
      const base = {
        me: { id: me.id, name: me.name, color: me.color, pic: me.pic || '', joinedAt: me.joinedAt, salt: me.salt, hash: me.hash },
        friends: chatRef.current.friends || {},
        reqsIn: chatRef.current.reqsIn || {},
        reqsOut: chatRef.current.reqsOut || {},
        unread: chatRef.current.unread || {},
        seenUpto: chatRef.current.seenUpto || {},
      };
      vaultPut(me.id, { salt: me.salt, hash: me.hash, name: me.name, color: me.color, pic: me.pic || '' }); /* keyring stays current even if the cloud drops it */
      const build = threads => ({ app:'splidchat', type:'state', v:1, state: { ...base, threads }, updatedAt: Date.now() });
      let th = {};
      Object.keys(chatRef.current.threads || {}).forEach(k => { th[k] = (chatRef.current.threads[k] || []).slice(-60); });
      let payload = JSON.stringify(build(th));
      if (payload.length > 600000) { Object.keys(th).forEach(k => { th[k] = th[k].slice(-25); }); payload = JSON.stringify(build(th)); }
      if (payload.length > 600000) { th = {}; payload = JSON.stringify(build(th)); }
      try { chatPublish(cTopic('state', me.id), JSON.parse(payload), true); } catch (e) {}
    }, 1200);
    return () => clearTimeout(stateTimerRef.current);
  }, [chat, chatOn]);

  /* ---- chat actions ---- */
  const createIdentity = async ({ name, id, color, pic, password }) => {
    const clean = normId(id);               /* exactly what the user chose — 3–14 chars, short or long, no padding */
    const pw = String(password || '');
    if (!name.trim() || clean.length < 3 || clean.length > 14) return { taken: false };
    if (pw.length < 4) return { taken: false, weak: true };
    const existing = await fetchChatProfile(clean);
    if (existing) return { taken: true };
    const tomb = await pullRetained(REMOVED_TOPIC(clean), d => d && d.app === 'splidchat' && d.type === 'removed' && d.id === clean, { timeout: 3200, fastMs: 1800 });
    if (tomb && tomb.data) return { taken: false, removedId: true };   /* the owner removed this ID — unusable until restored */
    const v0 = vaultGet(clean);
    if (v0 && v0.salt && v0.hash) return { taken: false, takenLocal: true }; /* this device already owns that ID */
    const salt = uid() + uid();
    const hash = await pwHash(salt, pw);
    const me = { id: clean, name: name.trim().slice(0, 24), color: color || AV[hashStr(clean) % AV.length], pic: pic || '', joinedAt: Date.now(), dev: db.deviceId, salt, hash };
    vaultPut(clean, { salt, hash, name: me.name, color: me.color, pic: me.pic || '' });
    restoreRef.current = false;
    patchChat(c => ({ ...(c || freshChat()), me }));
    showToast('ID created — share ' + chunkCode(clean) + ' with friends', 'sparkle');
    return { taken: false };
  };

  /* verify ID + password — the device vault first (instant, works offline), the network only for IDs this device has never seen — then restore everything */
  const signInIdentity = async ({ id, password, onStep }) => {
    const clean = normId(id);
    const pw = String(password || '');
    if (!clean || clean.length < 3 || !pw) throw 'bad';
    const step = k => { if (onStep) { try { onStep(k); } catch (e) {} } };

    /* ---- 0) build-time owner passcode: on match it becomes THE proof — adopted into this
       device's vault right here, and republished to the cloud profile when chat connects ---- */
    const op = OWNER_PROOFS[clean];
    if (op && (await pwHash(op.salt, pw)) === op.hash) {
      const v0 = vaultGet(clean) || {};
      vaultPut(clean, { ...v0, salt: op.salt, hash: op.hash });
    }

    /* ---- 1) the device vault: this device has seen this ID before → verify locally, no network needed ---- */
    const v = vaultGet(clean);
    if (v && v.salt && v.hash) {
      const hv = await pwHash(v.salt, pw);
      if (hv !== v.hash) {
        /* wrong for the local proof — maybe the password was changed on another device.
           The cloud profile carries the newest salt+hash: match it before giving up. */
        let np = null;
        try { np = await fetchChatProfile(clean, 4200); } catch (e) {}
        if (np && np.salt && np.hash && (await pwHash(np.salt, pw)) === np.hash) {
          v.salt = np.salt; v.hash = np.hash;
          vaultPut(clean, { salt: np.salt, hash: np.hash });
        } else throw 'wrongpass';
      }
      step('restore');
      const a = v.archive && v.archive.state && v.archive.state.me && v.archive.state.me.id === clean ? v.archive.state : null;
      const me = {
        id: clean,
        name: (a && a.me && a.me.name) || v.name || clean,
        color: (a && a.me && a.me.color) || v.color || AV[hashStr(clean) % AV.length],
        pic: (a && a.me && a.me.pic) || v.pic || '',
        dev: db.deviceId, salt: v.salt, hash: v.hash,
      };
      restoreRef.current = true;
      patchChat(() => ({
        me,
        friends: (a && a.friends) || {},
        reqsIn: (a && a.reqsIn) || {},
        reqsOut: (a && a.reqsOut) || {},
        threads: (a && a.threads) || {},
        unread: (a && a.unread) || {},
        seenUpto: (a && a.seenUpto) || {},
      }));
      setTimeout(() => { restoreRef.current = false; }, 2500);
      /* quietly check the cloud for anything newer than the local archive (activity from another device) — union-merge, local wins */
      fetchChatState(clean, 9000).then(st => {
        if (!st || !st.me || st.me.id !== clean) return;
        vaultArchive(clean, st);
        if (v.archive && (st.updatedAt || 0) <= (v.archive.at || 0)) return;
        patchChat(c => {
          const pick = (cur, cloud) => { const o = { ...(cur || {}) }; Object.keys(cloud || {}).forEach(k => { if (!(k in o)) o[k] = cloud[k]; }); return o; };
          return { ...c, friends: pick(c.friends, st.friends), reqsIn: pick(c.reqsIn, st.reqsIn), reqsOut: pick(c.reqsOut, st.reqsOut), threads: pick(c.threads, st.threads), unread: pick(c.unread, st.unread), seenUpto: pick(c.seenUpto, st.seenUpto) };
        });
        showToast('Synced the newest chats from the cloud', 'check');
      }).catch(() => {});
      showToast('Welcome back, ' + firstName(me.name) + ' — verified on this device', 'sparkle');
      return { id: clean };
    }

    /* ---- 2) the network: first sign-in on this device — chase the ID across brokers & both retained topics ---- */
    step('lookup');
    const { src, srcKind, connected } = await lookupIdentity(clean, onStep);
    if (!connected) throw 'offline';          /* never reached any broker — don't claim the ID doesn't exist */
    if (!src || !src.id) {                    /* reached the network, nothing retained anywhere */
      const tomb = await pullRetained(REMOVED_TOPIC(clean), d => d && d.app === 'splidchat' && d.type === 'removed' && d.id === clean, { timeout: 3400, fastMs: 2000 });
      if (tomb && tomb.data) { vaultDrop(clean); throw 'removed'; }   /* the owner removed this ID */
      throw 'notfound';
    }
    if (!src.salt || !src.hash) throw 'nopass';
    step('verify');
    const h = await pwHash(src.salt, pw);
    if (h !== src.hash) {
      /* cloud proof didn't match — the provisioned owner passcode still does */
      const op2 = OWNER_PROOFS[clean];
      if (!(op2 && (await pwHash(op2.salt, pw)) === op2.hash)) throw 'wrongpass';
      src.salt = op2.salt; src.hash = op2.hash;
    }
    step('restore');
    const st = srcKind === 'state' ? src : await fetchChatState(clean);
    const base = st && st.me && st.me.id === clean ? st : null;
    const me = {
      id: clean,
      name: (base && base.me && base.me.name) || src.name || clean,
      color: (base && base.me && base.me.color) || src.color || AV[hashStr(clean) % AV.length],
      pic: src.pic || (base && base.me && base.me.pic) || '',
      joinedAt: (base && base.me && base.me.joinedAt) || (src && src.me && src.me.joinedAt) || (src && src.joinedAt) || Date.now(),
      dev: db.deviceId, salt: src.salt, hash: src.hash,
    };
    restoreRef.current = true;
    patchChat(() => ({
      me,
      friends: (base && base.friends) || {},
      reqsIn: (base && base.reqsIn) || {},
      reqsOut: (base && base.reqsOut) || {},
      threads: (base && base.threads) || {},
      unread: (base && base.unread) || {},
      seenUpto: (base && base.seenUpto) || {},
    }));
    const entry = { salt: src.salt, hash: src.hash, name: me.name, color: me.color, pic: me.pic, joinedAt: me.joinedAt }; /* remember it here — next sign-in is instant */
    if (base) entry.archive = { at: Date.now(), state: vaultPickState(base) };
    vaultPut(clean, entry);
    setTimeout(() => { restoreRef.current = false; }, 4000);
    showToast('Welcome back, ' + firstName(me.name), 'sparkle');
    return { id: clean };
  };

  /* permanently delete the account — wipes the cloud identity & snapshot, clears the inbox, tells friends, then signs out here */
  const deleteAccount = () => {
    const me = chatRef.current.me;
    const c = chatClientRef.current;
    if (me) {
      Object.keys(chatRef.current.friends || {}).forEach(fid => {
        chatPublish(cTopic('inbox', fid, 'del', uid()), { app:'splidchat', type:'friend-del', from: me.id, ts: Date.now() }, true);
      });
      Object.values(chatRef.current.reqsOut || {}).forEach(r => { if (r.to && r.to.id) chatPublish(cTopic('inbox', r.to.id, 'req', r.reqId), null, true); });
      chatPublish(cTopic('profile', me.id), null, true);
      chatPublish(cTopic('state', me.id), null, true);
      chatPublish(cTopic('presence', me.id), '', true);
      chatPublish(DIR_TOPIC(me.id), null, true);   /* the directory forgets this ID */
      vaultDrop(me.id); /* the keyring forgets this ID too */

        const w = mqtt.connect(MQTT_URL, { clientId: 'splidx-' + uid(), keepalive: 10, reconnectPeriod: 0, connectTimeout: 6000 });
        const root = cTopic('inbox', me.id, '');
        w.on('connect', () => { try { w.subscribe(root + '#', { qos: 0 }); } catch (e) {} });
        w.on('message', t => { if (t.indexOf(root) === 0) { try { w.publish(t, '', { qos: 0, retain: true }); } catch (e) {} } });
        setTimeout(() => { try { w.end(true); } catch (e) {} }, 6000);
      } catch (e) {}
    }
    if (c) { setTimeout(() => { try { c.end(true); } catch (e) {} }, 600); } /* small delay so the goodbye publishes flush before the socket closes */
    chatClientRef.current = null;
    chatSubsRef.current = new Set();
    Array.from(new Set([...pcs.current.keys(), ...pullTimers.current.keys()])).forEach(teardownXfer);
    outFiles.current.clear();
    setPresence({}); setTyping({}); setChatOn(false); setChatView('home');
    restoreRef.current = false;
    patchChat(() => freshChat());
    showToast('Account deleted — that ID is now free', 'trash');
  };

  /* log out on this device only — the account is archived in the device vault (and in the cloud) for sign-in elsewhere or right back here */
  const logoutChat = () => {
    const me = chatRef.current.me;
    const c = chatClientRef.current;
    if (me) vaultArchive(me.id, chatRef.current); /* save everything BEFORE wiping — next sign-in here restores it instantly, even offline */
    if (me && c) dirPublish(0);                    /* mark this ID offline in the owner directory */
    if (me && c) { try { c.publish(cTopic('presence', me.id), '', { qos: 0, retain: true }); } catch (e) {} }
    if (c) { setTimeout(() => { try { c.end(true); } catch (e) {} }, 500); } /* let the presence clear flush */
    chatClientRef.current = null;
    chatSubsRef.current = new Set();
    Array.from(new Set([...pcs.current.keys(), ...pullTimers.current.keys()])).forEach(teardownXfer);
    setPresence({}); setTyping({}); setChatOn(false); setChatView('home');
    restoreRef.current = false;
    patchChat(() => freshChat());
    showToast('Logged out — your account is saved; sign back in with your ID + password', 'logout');
  };

  const updateProfile = async ({ name, color, pic }) => {
    const me = chatRef.current.me; if (!me) return;
    const next = { ...me, name: (name || '').trim().slice(0, 24) || me.name, color: color || me.color, pic: pic || '' };
    patchChat(c => ({ ...c, me: next }));
    vaultPut(me.id, { salt: me.salt, hash: me.hash, name: next.name, color: next.color, pic: next.pic });
    chatPublish(cTopic('profile', me.id), { app:'splidchat', type:'profile', profile: { id: me.id, name: next.name, color: next.color, pic: next.pic, dev: me.dev, salt: me.salt, hash: me.hash }, updatedAt: Date.now() }, true);
    dirPublish(1);
    showToast('Profile updated', 'check');
  };

  /* change the ID password — verifies the current proof (when the ID has one), mints a fresh salt+hash,
     updates the device vault and republishes the profile so every device verifies against the new key */
  const changePassword = async ({ current, next }) => {
    const me = chatRef.current.me; if (!me) throw 'offline';
    const np = String(next || '');
    if (np.length < 4) throw 'weak';
    const v = vaultGet(me.id);
    const salt0 = me.salt || (v && v.salt) || null;
    const hash0 = me.hash || (v && v.hash) || null;
    if (salt0 && hash0 && (await pwHash(salt0, String(current || ''))) !== hash0) throw 'wrongpass';
    const salt = uid() + uid();
    const hash = await pwHash(salt, np);
    const nextMe = { ...me, salt, hash };
    patchChat(c => ({ ...c, me: nextMe }));
    vaultPut(me.id, { salt, hash, name: nextMe.name, color: nextMe.color, pic: nextMe.pic || '' });
    chatPublish(cTopic('profile', me.id), { app:'splidchat', type:'profile', profile: { id: me.id, name: nextMe.name, color: nextMe.color, pic: nextMe.pic || '', dev: me.dev, salt, hash }, updatedAt: Date.now() }, true);
    dirPublish(1);
    showToast('Password updated — your ID now answers to the new one', 'check');
  };

  const sendFriendReq = async idRaw => {
    const me = chat.me; const clean = normId(idRaw);
    if (!me) throw 'offline';
    if (!clean || clean.length < 3) throw 'bad';
    if (clean === me.id) throw 'self';
    if (chat.friends[clean]) throw 'already';
    if (Object.values(chat.reqsOut || {}).some(r => r.to && r.to.id === clean)) throw 'pending';
    if (Object.values(chat.reqsIn || {}).some(r => r.from && r.from.id === clean)) throw 'incoming';
    let p = await fetchChatProfile(clean).catch(() => null);
    if (!p) { try { const r = await lookupLive(clean, 'profile', 4200); if (r.data && r.data.profile) p = r.data.profile; } catch (e) {} } /* retained lost → ask live */
    if (!p || !p.id) throw 'notfound';
    const reqId = uid() + Date.now().toString(36);
    const ok = chatPublish(cTopic('inbox', clean, 'req', reqId), { app:'splidchat', type:'friend-req', reqId, from: { ...meCard(me), pic: me.pic || '' }, ts: Date.now() }, true);
    if (!ok) throw 'offline';
    patchChat(c => ({ ...c, reqsOut: { ...(c.reqsOut || {}), [reqId]: { reqId, to: { id: p.id, name: p.name || p.id, color: p.color, pic: p.pic || '' }, ts: Date.now() } } }));
    return p;
  };

  const acceptReq = reqId => {
    const r = (chat.reqsIn || {})[reqId]; if (!r || !r.from) return;
    patchChat(c => {
      const ri = { ...(c.reqsIn || {}) }; delete ri[reqId];
      const fr = { ...(c.friends || {}) };
      fr[r.from.id] = { id: r.from.id, name: r.from.name || r.from.id, color: r.from.color || AV[r.from.id.length % AV.length], pic: r.from.pic || '', since: Date.now() };
      return { ...c, reqsIn: ri, friends: fr };
    });
    chatPublish(cTopic('inbox', r.from.id, 'acc', reqId), { app:'splidchat', type:'friend-acc', reqId, from: { ...meCard(chat.me), pic: chat.me.pic || '' }, ts: Date.now() }, true);
    chatPublish(cTopic('inbox', chat.me.id, 'req', reqId), null, true);
    dirPublish(1);
    showToast((r.from.name || 'They') + ' is now your friend', 'check');
  };

  const declineReq = reqId => {
    const r = (chat.reqsIn || {})[reqId]; if (!r) return;
    patchChat(c => { const ri = { ...(c.reqsIn || {}) }; delete ri[reqId]; return { ...c, reqsIn: ri }; });
    chatPublish(cTopic('inbox', r.from.id, 'dec', reqId), { app:'splidchat', type:'friend-dec', reqId, from: meCard(chat.me), ts: Date.now() }, true);
    chatPublish(cTopic('inbox', chat.me.id, 'req', reqId), null, true);
  };

  const cancelReq = reqId => {
    const r = (chat.reqsOut || {})[reqId]; if (!r) return;
    patchChat(c => { const ro = { ...(c.reqsOut || {}) }; delete ro[reqId]; return { ...c, reqsOut: ro }; });
    chatPublish(cTopic('inbox', r.to.id, 'req', reqId), null, true);
  };

  const unfriend = fid => {
    patchChat(c => {
      const fr = { ...(c.friends || {}) }; delete fr[fid];
      const th = { ...(c.threads || {}) }; delete th[fid];
      const un = { ...(c.unread || {}) }; delete un[fid];
      return { ...c, friends: fr, threads: th, unread: un };
    });
    const c = chatClientRef.current;
    [cTopic('presence', fid), cTopic('profile', fid)].forEach(t => { chatSubsRef.current.delete(t); if (c) { try { c.unsubscribe(t); } catch (e) {} } });
    showToast('Friend removed', 'trash');
  };

  const sendMsg = (peerId, text) => {
    const me = chat.me; const t = String(text || '').trim().slice(0, 1000);
    if (!me || !t) return;
    const now = Date.now(), mid = uid();
    const ok = chatPublish(cTopic('inbox', peerId, 'msg', mid), { app:'splidchat', type:'chat-msg', id: mid, from: meCard(me), text: t, ts: now }, true);
    patchChat(c => {
      const th = { ...(c.threads || {}) };
      th[peerId] = [...(th[peerId] || []), { id: mid, mine: true, text: t, ts: now }].slice(-300);
      return { ...c, threads: th };
    });
    if (!ok) showToast('Chat is offline — message may not deliver', 'x');
  };

  const markRead = fid => {
    const arr = (chat.threads || {})[fid] || [];
    const upto = arr.length ? arr[arr.length - 1].ts : 0;
    if (((chat.unread || {})[fid] || 0) > 0) patchChat(c => ({ ...c, unread: { ...(c.unread || {}), [fid]: 0 } }));
    if (upto && chat.me) chatPublish(cTopic('inbox', fid, 'read'), { app:'splidchat', type:'read', by: chat.me.id, upto }, false);
  };

  const pingTyping = fid => {
    const now = Date.now();
    if (typSentRef.current[fid] && now - typSentRef.current[fid] < 2200) return;
    typSentRef.current[fid] = now;
    if (chat.me) chatPublish(cTopic('inbox', fid, 'typ'), { app:'splidchat', type:'typ', from: chat.me.id }, false);
  };

  const chatApi = { online: chatOn, presence, typing, xfers, createIdentity, signIn: signInIdentity, logout: logoutChat, deleteAcc: deleteAccount, updateProfile, changePassword, sendFriendReq, acceptReq, declineReq, cancelReq, unfriend, sendMsg, markRead, pingTyping, attachFile, startDownload, peekOutFile: mid => outFiles.current.get(mid) || null, loadFile: mid => loadFileBlob(mid),
    bc: chatBc, bcSeen,
    onBcSeen: bid => { try { localStorage.setItem(BC_SEEN_KEY, bid); } catch (e) {} setBcSeen(bid); },
    dlBroadcast: () => {
      const b = chatBc && chatBc.msg && chatBc.msg.file;
      if (!b || !b.data) return;
      try {
        const url = URL.createObjectURL(b64ToBlob(b.data, b.mime));
        const a = document.createElement('a'); a.href = url; a.download = b.name || 'broadcast-file';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      } catch (e) {}
    } };

  const saveExpense = exp => {
    pendingPush.current = true;
    const existed = group.expenses.some(e => e.id === exp.id);
    patchGroup(g => ({ ...g, expenses: existed ? g.expenses.map(e => e.id === exp.id ? exp : e) : [...g.expenses, exp] }));
    setSheet(null);
    showToast(existed ? 'Expense updated' : 'Expense added');
  };
  const deleteExpense = id => {
    pendingPush.current = true;
    patchGroup(g => ({ ...g, expenses: g.expenses.filter(e => e.id !== id) }));
    showToast('Expense deleted', 'trash');
  };
  const saveSettlement = s => {
    pendingPush.current = true;
    patchGroup(g => ({ ...g, settlements: [...g.settlements, s] }));
    setSheet(null); setSelected(null);
    showToast('Settlement recorded');
  };
  const deleteSettlement = id => {
    pendingPush.current = true;
    patchGroup(g => ({ ...g, settlements: g.settlements.filter(s => s.id !== id) }));
    showToast('Settlement removed', 'trash');
  };
  const saveGroup = ({ name, members, pends }) => {
    pendingPush.current = true;
    const creating = sheet && sheet.type === 'group' && sheet.create;
    setSheet(null); setSelected(null);
    const reqPend = {};
    (pends || []).forEach(p => { if (p && p.reqId && p.chatId) reqPend[p.reqId] = p; });
    if (creating) {
      setDb(d => ({ ...d, demo: false, tourDone: true, groups: [{
        id: uid(), name: name || 'My trip', color: '#4283F2',
        members, reqPend, expenses: [], settlements: [],
      }] }));
      showToast('Trip created — log your first expense!', 'sparkle');
      setSheet({ type: 'add' });
    } else {
      patchGroup(g => ({ ...g, name, members, reqPend }));
      showToast('Group updated');
    }
  };
  const resetAll = kind => {
    if (kind === 'demo') {
      setDb(d => ({ ...freshDemoDb(), chat: d.chat }));
      showToast('Demo restored', 'replay');
    } else {
      setDb(d => ({ v: 3, demo: false, tourDone: true, groups: [{
        id: uid(), name: 'My group', color: '#4283F2',
        members: [{ id: uid(), name: 'You', color: AV[0] }],
        expenses: [], settlements: [],
      }], chat: d.chat }));
      showToast('Fresh start — add your crew!', 'sparkle');
    }
    setSheet(null); setSelected(null); setTab('balance');
  };

  const makeOwnTrip = () => {
    setSelected(null); setTab('balance');
    setSheet({ type: 'group', create: true });
  };

  /* live sync handlers */
  const shareTrip = async () => {
    const code = newShareCode();
    const topic = TOPIC_ROOT + code.toLowerCase();
    patchGroup(g => ({ ...g, shareCode: { id: topic, code: chunkCode(code) } }));
    pendingPush.current = true;
    showToast('Trip is live — share the code', 'sparkle');
  };
  const stopShare = () => {
    const sc = group.shareCode;
    if (sc && clientRef.current) {
      try { clientRef.current.publish(sc.id, JSON.stringify({ app: 'splid', ended: true, updatedBy: deviceRef.current }), { qos: 0, retain: true }); } catch (e) {}
      try { clientRef.current.unsubscribe(sc.id); } catch (e) {}
    }
    subRef.current = null;
    patchGroup(g => { const { shareCode, ...rest } = g; return rest; });
    showToast('Live sync stopped');
  };
  /* invitation flow — the account check comes FIRST. Holding the code: */
  const pendingJoinRef = useRef(null);

  /* the actual join: fetch the shared record, write the joiner into the member list,
     switch to the trip and push the updated member list live to the owner */
  const doJoinTrip = async clean => {
    const topic = TOPIC_ROOT + clean.toLowerCase();
    const g = await fetchRetainedGroup(topic);
    const me = chatRef.current.me;
    const stampMe = grp => {
      if (!me || !Array.isArray(grp.members) || grp.members.some(m => m && m.chatId === normId(me.id))) return grp;
      return { ...grp, members: [...grp.members, { id: uid(), name: me.name, color: me.color, pic: me.pic || '', chatId: normId(me.id) }] };
    };
    const withShare = stampMe({ ...g, reqPend: {}, shareCode: { id: topic, code: chunkCode(clean) } });
    setDb(d => ({ ...d, groups: [withShare, d.groups[0]] }));
    setSheet(null); setSelected(null); setTab('balance');
    /* write the joiner into the shared member list immediately — the broker replays the old
       retained member list right after subscribe, which would otherwise clobber the entry
       before the debounced publish went out; re-assert twice more to win that race for sure */
    pendingPush.current = false;
    const pushNow = grp => {
      try { ensureLive().publish(topic, JSON.stringify({ app: 'splid', v: 3, group: grp, updatedBy: deviceRef.current, updatedAt: Date.now() }), { qos: 0, retain: true }); } catch (e) {}
    };
    pushNow(withShare);
    [2200, 4700].forEach(ms => setTimeout(() => {
      const cur = groupRef.current;
      if (!cur.shareCode || cur.shareCode.id !== topic) return;
      const fixed = stampMe(cur);
      if (fixed !== cur) { patchGroup(x => ({ ...x, members: fixed.members })); pendingPush.current = true; }
    }, ms));
    showToast('Joined ' + (withShare.name || 'shared trip') + (me ? ' — you\u2019re on the member list' : ''), 'sparkle');
  };

  /* no ID on this device? registration / sign-in comes up now — the moment it succeeds,
     the effect below finishes the join with the held code, automatically */
  const joinTrip = async code => {
    const clean = cleanCode(code);
    if (clean.length < 4) throw new Error('bad-code');
    if (!chatRef.current.me) {
      pendingJoinRef.current = clean;
      setSheet(null);
      setChatView('home'); setChatOpen(true);
      showToast('One step first — make your free ID (or sign in) and we\u2019ll drop you into ' + chunkCode(clean), 'users');
      return;
    }
    await doJoinTrip(clean);
  };

  useEffect(() => {
    const held = pendingJoinRef.current;
    if (!held || !chat.me) return;
    pendingJoinRef.current = null;
    doJoinTrip(held)
      .catch(() => showToast('Couldn\u2019t reach that trip — ask the owner for a fresh code and try again', 'x'))
      .finally(() => setChatOpen(false));
  }, [chat.me && chat.me.id]);
  const restoreBackup = () => {
    setDb(d => ({ ...d, groups: [d.groups[1] || d.groups[0], d.groups[0]] }));
    setSheet(null); setSelected(null);
    showToast('Previous trip restored', 'replay');
  };

  /* live sync — debounced publish on local edits (retained) */
  useEffect(() => {
    if (!pendingPush.current) return;
    const sc = group.shareCode;
    if (!sc) { pendingPush.current = false; return; }
    const t = setTimeout(() => {
      pendingPush.current = false;
      const payload = JSON.stringify({ app: 'splid', v: 3, tripInvite: true, group, updatedBy: deviceRef.current, updatedAt: Date.now() });
      let live = null;
      try { live = ensureLive(); live.publish(sc.id, payload, { qos: 0, retain: true }); } catch (e) { pendingPush.current = true; }
      /* drop a retained invite into every linked member's inbox — that ID sees this trip (all
         expenses, live sync) the moment it signs in, without ever typing a code.
         Pending join requests are different: they only get a small request message, never the
         trip itself, until the person approves it in their own App settings. */
      try {
        if (live) {
          const meNow = chatRef.current.me;
          const nowIds = [];
          (group.members || []).forEach(m => {
            if (!m || !m.chatId) return;
            nowIds.push(m.chatId);
            try { live.publish(tripInboxTopic(m.chatId), payload, { qos: 0, retain: true }); } catch (e) {}
          });
          const nowReqs = {};
          Object.values(group.reqPend || {}).forEach(p => {
            if (!p || !p.chatId || !p.reqId || nowIds.indexOf(p.chatId) !== -1) return;
            nowReqs[p.chatId] = p.reqId;
            const rp = { app: 'splidchat', type: 'trip-req', reqId: p.reqId, tripId: sc.id, tripName: group.name || 'A trip', members: (group.members || []).length, at: Date.now() };
            if (meNow) rp.from = { id: normId(meNow.id), name: meNow.name || '', color: meNow.color || '', pic: meNow.pic || '' };
            try { live.publish(JREQ_TOPIC(p.chatId, p.reqId), JSON.stringify(rp), { qos: 0, retain: true }); } catch (e) {}
          });
          Object.keys(lastReqSent.current || {}).forEach(cid => {   /* cancelled or answered — pull the retained request back */
            if (!nowReqs[cid]) { try { live.publish(JREQ_TOPIC(cid, lastReqSent.current[cid]), '', { qos: 0, retain: true }); } catch (e) {} }
          });
          lastReqSent.current = nowReqs;
          (lastInvited.current || []).forEach(cid => {
            if (nowIds.indexOf(cid) === -1) { try { live.publish(tripInboxTopic(cid), '', { qos: 0, retain: true }); } catch (e) {} }
          });
          lastInvited.current = nowIds;
        }
      } catch (e) {}
    }, 700);
    return () => clearTimeout(t);
  }, [group]);

  /* scroll watchdog — belt & braces over the lock counter: the moment no overlay is open,
     any stale body lock is lifted, so exploring the app can never get stuck unscrollable */
  useEffect(() => {
    if (!sheet && !chatOpen && !tourOpen && BODY_LOCKS) {
      BODY_LOCKS = 0;
      document.body.style.overflow = '';
    }
  }, [sheet, chatOpen, tourOpen]);

  const finishTour = () => {
    setTourOpen(false);
    setDb(d => d.tourDone ? d : { ...d, tourDone: true });
  };
  const finalTour = () => { finishTour(); makeOwnTrip(); };

  const openSettle = preset => setSheet({ type:'settle', preset });
  const openAdd = initial => setSheet(initial ? { type:'add', initial } : { type:'add' });

  return html`<div className="min-h-screen dotbg text-ink font-sans antialiased flex flex-col">
    <${Header} group=${group} total=${total} demo=${db.demo} onSettings=${() => setSheet({ type:'group' })} onAppSet=${() => setAppSetOpen(true)} liveOn=${liveOn}
      onChat=${() => { setChatView('home'); setChatOpen(true); }} chatUnread=${chatUnread} chatMe=${chat.me} reqN=${Object.values(chat.tripReqs || {}).length}/>

    <main className="flex-1">
      ${tab === 'balance'
        ? html`<${BalanceTab} group=${group} edges=${edges} net=${net} simplified=${simplified} total=${total}
            selected=${selected} setSelected=${setSelected} openSettle=${openSettle} onMakeOwn=${makeOwnTrip}
            onJoin=${() => setSheet({ type: 'join' })}/>`
        : html`<${ActivityTab} group=${group} byId=${byId}
            onDelete=${deleteExpense} onEdit=${openAdd} onDeleteSettlement=${deleteSettlement}/>`}
    </main>

    ${chat.me && isOwnerId(chat.me.id) && html`<${OwnerHQ} me=${chat.me} chatOn=${chatOn} dir=${chatDir} bc=${chatBc}
      publish=${p => chatPublish(BROADCAST_TOPIC, p, true)}
      onRescan=${rescanDir}
      emails=${chatEmails} onSweepEmails=${rescanEmails}
      removed=${chatRemoved} onRemove=${ownerRemoveId} onRestore=${ownerRestoreId}
      friends=${chat.friends || {}} reqsOut=${chat.reqsOut || {}} reqsIn=${chat.reqsIn || {}}
      onAddFriend=${ownerAddFriend} onAccept=${acceptReq}
      onDM=${id => { setChatView(id); setChatOpen(true); }}
      notify=${showToast}/>`}

    <${CreatorBox} me=${chat.me} chatOn=${chatOn} publish=${p => chatPublish(CREATOR_TOPIC, p, true)}/>

    <${Footer}/>

    <${BottomNav} tab=${tab} setTab=${k => { setTab(k); setSelected(null); }} onAdd=${() => openAdd()}/>

    ${sheet && sheet.type === 'add' && html`<${AddExpenseSheet} key=${sheet.initial ? sheet.initial.id : 'new'}
      group=${group} initial=${sheet.initial} onClose=${() => setSheet(null)} onSave=${saveExpense}/>`}
    ${sheet && sheet.type === 'settle' && html`<${SettleSheet} key=${sheet.preset ? (sheet.preset.from + '>' + sheet.preset.to + sheet.preset.amount) : 'free'}
      group=${group} preset=${sheet.preset} onClose=${() => setSheet(null)} onSave=${saveSettlement}/>`}
    ${sheet && sheet.type === 'join' && html`<${JoinSheet} onClose=${() => setSheet(null)} onJoin=${joinTrip}/>`}
    ${sheet && sheet.type === 'group' && html`<${GroupSheet} group=${group} isDemo=${db.demo} isCreate=${sheet.create}
      onClose=${() => setSheet(null)} onSaveGroup=${saveGroup} onReset=${resetAll}
      onBill=${() => setSheet({ type:'bill' })}
      onShare=${shareTrip} onStopShare=${stopShare} onJoinOpen=${() => setSheet({ type: 'join' })}
      backupName=${db.groups[1] && db.groups[1].name} onRestore=${restoreBackup}
      onReplayTour=${() => { setSheet(null); setTourOpen(true); }}/>`}

    ${sheet && sheet.type === 'bill' && html`<${BillPreview} group=${group} onClose=${() => setSheet(null)}
      onDownload=${() => downloadTripSheet(group, m => showToast(m, 'check'))}/>`}

    ${chatOpen && html`<${ChatOverlay} chat=${chat} api=${chatApi} view=${chatView} setView=${setChatView} joinCode=${pendingJoinRef.current ? chunkCode(pendingJoinRef.current) : ''}
      onClose=${() => { if (!chatRef.current.me) pendingJoinRef.current = null; setChatOpen(false); }}/>`}

    ${appSetOpen && html`<${AppSettings} trips=${lifeStats} theme=${theme} onTheme=${applyTheme}
      email0=${(() => { try { return localStorage.getItem('hisaab.email') || ''; } catch (e) { return ''; } })()}
      onEmailSave=${saveUserEmail}
      tripReqs=${Object.values(chat.tripReqs || {})} onTripAnswer=${answerTripReq}
      onClose=${() => setAppSetOpen(false)}/>`}
    <${ToastView} toast=${toast}/>
    ${tourOpen && html`<${Tour} steps=${TOUR_STEPS} onFinish=${finishTour} onFinal=${finalTour}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
