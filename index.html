function Icon({ name, size=18, sw=2, className='' }) {
  if (!ICONS[name]) return null;
  return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true">
    ${ICONS[name].map((s, i) => s.t === 'p'
      ? html`<path key=${i} d=${s.d}/>`
      : html`<circle key=${i} cx=${s.cx} cy=${s.cy} r=${s.r}/>`)}
  </svg>`;
}

function fmt(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return new Intl.NumberFormat('en-IN', {
    style:'currency', currency:'INR',
    minimumFractionDigits: Number.isInteger(v) ? 0 : 2,
    maximumFractionDigits: 2,
  }).format(v);
}
const round2 = n => Math.round(n * 100) / 100;
const firstName = n => (n || '?').trim().split(/\s+/)[0];

function equalShares(amount, ids) {
  const p = Math.round(amount * 100), n = ids.length || 1;
  const base = Math.floor(p / n), rem = p - base * n;
  const o = {};
  ids.forEach((id, i) => { o[id] = (base + (i < rem ? 1 : 0)) / 100; });
  return o;
}

function dayLabel(ts) {
  const d = new Date(ts), t = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, t)) return 'Today';
  if (same(d, new Date(t.getTime() - 864e5))) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' })
    + (d.getFullYear() !== t.getFullYear() ? ' ' + d.getFullYear() : '');
}
const timeLabel = ts => new Date(ts).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });

/* ---------------- money math ---------------- */

function computePairwise(group) {
  const ids = group.members.map(m => m.id);
  const Pm = {};
  ids.forEach(a => { Pm[a] = {}; ids.forEach(b => { if (a !== b) Pm[a][b] = 0; }); });
  for (const e of group.expenses || []) {
    if (!Pm[e.payerId]) continue;
    for (const [uidv, sh] of Object.entries(e.splits || {})) {
      if (uidv !== e.payerId && Pm[uidv] && Pm[uidv][e.payerId] != null) {
        Pm[uidv][e.payerId] += Number(sh) || 0;
      }
    }
  }
  for (const s of group.settlements || []) {
    if (Pm[s.fromId] && Pm[s.fromId][s.toId] != null) Pm[s.fromId][s.toId] -= s.amount;
  }
  const edges = [];
  ids.forEach(a => ids.forEach(b => {
    if (a >= b) return;
    const v = Pm[a][b] - Pm[b][a];
    if (v > 0.005) edges.push({ from:a, to:b, amount: round2(v) });
    else if (v < -0.005) edges.push({ from:b, to:a, amount: round2(-v) });
  }));
  const net = {};
  ids.forEach(a => {
    let s = 0;
    ids.forEach(b => { if (a !== b) s += (Pm[b][a] || 0) - (Pm[a][b] || 0); });
    net[a] = round2(s);
  });
  return { edges, net };
}

/* Minimum-cash-flow greedy: repeatedly settle the biggest debtor against the biggest creditor */
function simplify(net) {
  const ds = [], cs = [];
  for (const id in net) {
    const v = Math.round(net[id] * 100);
    if (v > 0) cs.push({ id, amt: v });
    else if (v < 0) ds.push({ id, amt: -v });
  }
  ds.sort((a, b) => b.amt - a.amt);
  cs.sort((a, b) => b.amt - a.amt);
  const out = [];
  let i = 0, j = 0;
  while (i < ds.length && j < cs.length) {
    const amt = Math.min(ds[i].amt, cs[j].amt);
    out.push({ from: ds[i].id, to: cs[j].id, amount: amt / 100 });
    ds[i].amt -= amt; cs[j].amt -= amt;
    if (!ds[i].amt) i++;
    if (!cs[j].amt) j++;
  }
  return out;
}

function memberStat(group, id) {
  let paid = 0, share = 0;
  for (const e of group.expenses) {
    if (e.payerId === id) paid += e.amount;
    share += Number(e.splits && e.splits[id]) || 0;
  }
  return { paid, share };
}
function groupStats(g) {
  const total = g.expenses.reduce((s, e) => s + (+e.amount || 0), 0);
  const { edges } = computePairwise(g);
  return { total, debts: edges.length };
}

}

/* ---------------- tiny hooks ---------------- */

function useCountUp(target, dur = 700) {
  const [val, setVal] = useState(target);
  const fromRef = useRef(target);
  useEffect(() => {
    const from = fromRef.current, to = target;
    if (Math.abs(to - from) < 0.5) { fromRef.current = to; setVal(to); return; }
    let raf; const t0 = performance.now();
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const v = from + (to - from) * e;
      fromRef.current = v; setVal(v);
      if (p < 1) raf = requestAnimationFrame(tick); else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

/* ---------------- primitives ---------------- */

function Avatar({ m, size = 36, className = '' }) {
  return html`<span className=${'inline-flex items-center justify-center rounded-full font-semibold text-[#FCF9F3] select-none shrink-0 ' + className}

    ${(m.name || '?').trim()[0].toUpperCase()}

}

function AvStack({ members, size = 26, max = 5 }) {
  const shown = members.slice(0, max);
  return html`<div className="flex items-center">
    ${shown.map((m, i) => html`<span key=${m.id} className="relative" style=${{ zIndex: 20 - i, marginLeft: i > 0 ? -size * .3 : 0 }}><${Avatar} m=${m} size=${size}/></span>`)}

      style=${{ width:size, height:size, fontSize:10, zIndex:1, marginLeft:-size * .3 }}>+${members.length - max}</span>`}
  </div>`;
}

function Sheet({ title, onClose, children, footer, wide }) {
  useEffect(() => {
    const h = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', h); document.body.style.overflow = prev; };
  }, []);
  return html`<div className="fixed inset-0 z-50">
    <div className="absolute inset-0 bg-ink/40 backdrop-in" onClick=${onClose}></div>
    <div className="absolute inset-0 flex items-end sm:items-center justify-center pointer-events-none p-0 sm:p-6">
      <div className=${'pointer-events-auto sheet-in w-full ' + (wide ? 'sm:max-w-lg' : 'sm:max-w-md') +
        ' bg-card rounded-t-3xl sm:rounded-3xl shadow-pop max-h-[92vh] flex flex-col overflow-hidden'}>
        <div className="flex items-center justify-between px-5 pt-4 pb-3.5 border-b border-line shrink-0">
          <h3 className="font-display text-[19px] font-semibold">${title}</h3>
          <button onClick=${onClose} aria-label="Close" className="p-1.5 -mr-1 rounded-full text-muted hover:bg-paper hover:text-ink transition"><${Icon} name="x" size=${18}/></button>
        </div>
        <div className="overflow-y-auto px-5 py-4 flex-1">${children}</div>
        ${footer}
      </div>
    </div>
  </div>`;
}

function ToastView({ toast }) {
  if (!toast) return null;
  return html`<div key=${toast.key} className="fixed left-1/2 bottom-6 sm:bottom-10 z-[90]" style=${{ transform:'translateX(-50%)' }}>
    <div className="toast-in flex items-center gap-2.5 bg-ink text-paper rounded-full pl-2 pr-4 py-2 shadow-pop">
      <span className="w-6 h-6 rounded-full bg-sage flex items-center justify-center shrink-0"><${Icon} name=${toast.icon || 'check'} size=${13} sw=${3} className="text-paper"/></span>
      <span className="text-[13.5px] font-semibold pr-1">${toast.msg}</span>
    </div>
  </div>`;
}

/* ---------------- guided tour (coach marks) ---------------- */

const TOUR_STEPS = [
  { target:'tour-graph', title:"The balance graph", body:"Every arrow is a live debt — who owes whom, and how much. A thicker arrow means a bigger amount. Tap any person or arrow to dig in." },
  { target:'tour-toggle', title:"Direct vs Simplified", body:"\u201CDirect\u201D shows real person-to-person debts. \u201CSimplified\u201D computes the fewest payments that clear everything." },
  { target:'tour-settle', title:"Settle up in one tap", body:"When someone pays you back, record it — fully or partially. The graph, balances and history update instantly." },
  { target:'tour-add', title:"Three taps to log an expense", body:"Amount \u2192 who paid \u2192 Add. Equal split is the default; switch to sliders or percentages anytime." },
  { target:'tour-activity', title:"A story, not a spreadsheet", body:"Expenses and settlements stream in chronologically. Tap any entry to see the exact split — or edit it." },
  { title:"Make it yours", body:"This demo lives only in your browser. When you\u2019re ready, wipe it and set up your own group — everything is editable: rename, members, expenses, settlements.", final:true },
];

function Tour({ steps, onFinish, onFinal }) {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const [cardPos, setCardPos] = useState(null);
  const cardRef = useRef(null);
  const step = steps[i];
  const last = i === steps.length - 1;

  const measureNow = () => {
    const el = step.target ? document.getElementById(step.target) : null;
    if (!el) { setRect(null); return; }
    const r = el.getBoundingClientRect();
    setRect({ top: r.top - 10, left: r.left - 10, width: r.width + 20, height: r.height + 20 });
  };

  useEffect(() => {
    const el = step.target ? document.getElementById(step.target) : null;
    if (!el) { setRect(null); return; }
    el.scrollIntoView({ block:'center', behavior:'smooth' });
    const t1 = setTimeout(measureNow, 430);
    let raf = 0;
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(measureNow); };
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    return () => { clearTimeout(t1); cancelAnimationFrame(raf); window.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onScroll); };
  }, [i]);

  useLayoutEffect(() => {
    const c = cardRef.current; if (!c) return;
    const cr = c.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const W = cr.width, H = cr.height;
    let top, left;
    if (!rect) { top = (vh - H) / 2; left = (vw - W) / 2; }
    else {
      const below = rect.top + rect.height + 14;
      const above = rect.top - H - 14;
      top = (below + H < vh - 12) ? below : (above > 12 ? above : Math.max(12, Math.min(vh - H - 12, below)));
      left = Math.max(12, Math.min(vw - W - 12, rect.left + rect.width / 2 - W / 2));
    }
    setCardPos({ top, left });
  }, [i, rect]);

  useEffect(() => {
    const h = e => {
      if (e.key === 'Escape') onFinish();
      if (e.key === 'ArrowRight') setI(v => Math.min(v + 1, steps.length - 1));
      if (e.key === 'ArrowLeft') setI(v => Math.max(v - 1, 0));
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const next = () => (i < steps.length - 1 ? setI(i + 1) : onFinish());

  return html`<div className="fixed inset-0 z-[80]">
    ${rect
      ? html`<div className="absolute pointer-events-none" style=${{
          top:rect.top, left:rect.left, width:rect.width, height:rect.height, borderRadius:18,
          boxShadow:'0 0 0 2px rgba(252,249,243,.85), 0 10px 44px rgba(38,34,27,.28), 0 0 0 9999px rgba(38,34,27,.48)',
          transition:'all .4s cubic-bezier(.22,.9,.3,1)' }}/>`
      : html`<div className="absolute inset-0 bg-ink/45 backdrop-in"></div>`}
    <div className="absolute inset-0" onClick=${last ? onFinish : next}></div>
    <div ref=${cardRef}
      className="absolute bg-card rounded-2xl shadow-pop border border-line p-4 sm:p-5"
      style=${{
        top: cardPos ? cardPos.top : -9999, left: cardPos ? cardPos.left : '50%',
        width: 'min(92vw, 350px)',
        opacity: cardPos ? 1 : 0,
        transition:'top .35s cubic-bezier(.22,.9,.3,1), left .35s cubic-bezier(.22,.9,.3,1), opacity .25s ease' }}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted">${step.final ? 'Ready?' : (i + 1) + ' of ' + steps.length}</span>
        ${!last && html`<button onClick=${onFinish} className="text-[12px] font-semibold text-muted hover:text-ink transition">Skip tour</button>`}
      </div>
      <h4 className="font-display text-[19px] font-semibold leading-snug">${step.title}</h4>
      <p className="text-[13.5px] text-muted mt-1.5 leading-relaxed">${step.body}</p>
      <div className="mt-4 flex items-center gap-2">
        ${i > 0 && html`<button onClick=${() => setI(i - 1)} className="rounded-full border border-line px-3.5 py-2 text-[13px] font-semibold hover:border-muted transition">Back</button>`}
        <div className="flex-1"></div>
        ${last
          ? html`<button onClick=${onFinish} className="rounded-full border border-line px-3.5 py-2 text-[13px] font-semibold text-muted hover:text-ink hover:border-muted transition">Keep exploring</button>
             <button onClick=${onFinal} className="inline-flex items-center gap-1.5 rounded-full bg-ink text-paper px-4 py-2 text-[13px] font-semibold hover:bg-ink/90 transition active:scale-95">
               <${Icon} name="sparkle" size=${14}/> Make your own</button>`
          : html`<button onClick=${next} className="inline-flex items-center gap-1 rounded-full bg-ink text-paper px-4 py-2 text-[13px] font-semibold hover:bg-ink/90 transition active:scale-95">
               Next <${Icon} name="right" size=${14} sw=${2.4}/></button>`}
      </div>
    </div>
  </div>`;
}

/* ---------------- the balance graph (custom SVG) ---------------- */

function edgeGeom(a, b, CX, CY) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy) || 1;
  const ux = dx / dist, uy = dy / dist;
  let px = -uy, py = ux;
  const mx = (a.x + b.x) / 2 - CX, my = (a.y + b.y) / 2 - CY;
  if (px * mx + py * my < 0) { px = -px; py = -py; }
  const bow = Math.min(46, dist * 0.18);
  const s = { x: a.x + ux * (a.r + 6) + px * bow * .4, y: a.y + uy * (a.r + 6) + py * bow * .4 };
  const e = { x: b.x - ux * (b.r + 14) + px * bow * .4, y: b.y - uy * (b.r + 14) + py * bow * .4 };
  const c = { x: (a.x + b.x) / 2 + px * bow, y: (a.y + b.y) / 2 + py * bow };
  const mid = { x: .25 * s.x + .5 * c.x + .25 * e.x, y: .25 * s.y + .5 * c.y + .25 * e.y };
  const ang = Math.atan2(e.y - c.y, e.x - c.x);
  return {
    s, c, e, mid, ang, px, py,
    d: `M ${s.x.toFixed(1)} ${s.y.toFixed(1)} Q ${c.x.toFixed(1)} ${c.y.toFixed(1)} ${e.x.toFixed(1)} ${e.y.toFixed(1)}`,
  };
}
function qpt(g, t) {
  const u = 1 - t;
  return { x: u * u * g.s.x + 2 * u * t * g.c.x + t * t * g.e.x, y: u * u * g.s.y + 2 * u * t * g.c.y + t * t * g.e.y };
}
function qdist(g, t, cx, cy) { const p = qpt(g, t); return Math.hypot(p.x - cx, p.y - cy); }
function arrowPts(g) {
  const L = 10, Wd = 7;
  const bx = g.e.x - Math.cos(g.ang) * L, by = g.e.y - Math.sin(g.ang) * L;
  const nx = -Math.sin(g.ang), ny = Math.cos(g.ang);
  return `${g.e.x.toFixed(1)},${g.e.y.toFixed(1)} ${(bx + nx * Wd).toFixed(1)},${(by + ny * Wd).toFixed(1)} ${(bx - nx * Wd).toFixed(1)},${(by - ny * Wd).toFixed(1)}`;
}

function BalanceGraph({ members, edges, simplified, net, total, expenseCount, mode, selected, onNodeClick, onEdgeClick }) {
  const [hover, setHover] = useState(null);
  const W = 480, H = 456, CX = 240, CY = 214;

  const layout = useMemo(() => {
    const n = members.length;
    const R = n <= 4 ? 150 : n <= 6 ? 136 : 120;
    const pos = {};
    members.forEach((m, i) => {
      const ang = n === 2 ? (i === 0 ? 180 : 0) : -90 + i * 360 / n;
      const rad = ang * Math.PI / 180;
      pos[m.id] = { x: CX + R * Math.cos(rad), y: CY + R * Math.sin(rad), r: 27 };
    });
    return { pos, R };
  }, [members]);

  const useEdges = mode === 'direct' ? edges : simplified;
  const maxAmt = Math.max(1, ...useEdges.map(e => e.amount));
  const eNodes = useEdges
    .map(e => ({ ...e, key: e.from + '>' + e.to }))
    .filter(e => layout.pos[e.from] && layout.pos[e.to]);

  const focusN = (hover && hover.t === 'n') ? hover.id : (selected || null);
  const focusE = (hover && hover.t === 'e') ? hover.id : null;
  const edgeDim = e => focusE ? (e.key === focusE ? 1 : .1)
    : focusN ? ((e.from === focusN || e.to === focusN) ? 1 : .08) : 1;
  const nodeDim = id => {
    if (focusE) { const e = eNodes.find(x => x.key === focusE); return e && (e.from === id || e.to === id) ? 1 : .4; }
    if (focusN) return focusN === id ? 1 : .45;
    return 1;
  };

  const settledAll = eNodes.length === 0;
  const totalAnim = useCountUp(total);

  return html`<div className="px-1 pb-1">
    <svg viewBox="0 0 480 456" display="block" role="img" aria-label="Balance graph"
      className="w-full h-auto select-none" style=${{ fontFamily:'"Instrument Sans",sans-serif' }}>
      <defs>
        <pattern id="gdots" width="26" height="26" patternUnits="userSpaceOnUse">
          <circle cx="1.4" cy="1.4" r="1.1" fill="#E7DEC9"/>
        </pattern>
      </defs>
      <rect width="480" height="456" fill="url(#gdots)" opacity=".5"/>
      <circle cx=${CX} cy=${CY} r=${layout.R} fill="none" stroke="#E3D9C3" strokeWidth="1.2" strokeDasharray="1.5 7.5" strokeLinecap="round"/>

      ${eNodes.map(e => {
        const a = layout.pos[e.from], b = layout.pos[e.to];
        const g = edgeGeom(a, b, CX, CY);
        const w = 2.2 + 4.8 * Math.sqrt(e.amount / maxAmt);
        const hot = focusE === e.key;
        const col = hot ? '#8C3B20' : '#AE4E2E';
        const label = fmt(e.amount);
        const lw = label.length * 6.8 + 16;
        const nearC = Math.hypot(g.mid.x - CX, g.mid.y - CY) < 52;
        const L = nearC ? (qdist(g, .3, CX, CY) > qdist(g, .7, CX, CY) ? qpt(g, .3) : qpt(g, .7)) : g.mid;
        const lx = L.x + g.px * 15, ly = L.y + g.py * 15;
        return html`<g key=${mode + e.key} className="cursor-pointer"
          style=${{ opacity: edgeDim(e), transition:'opacity .25s ease' }}
          onClick=${ev => { ev.stopPropagation(); onEdgeClick(e); }}
          onMouseEnter=${() => setHover({ t:'e', id: e.key })}
          onMouseLeave=${() => setHover(null)}>
          <path d=${g.d} stroke="#E7DEC9" strokeWidth="1.4" fill="none"/>
          <path d=${g.d} stroke=${col} fill="none" strokeLinecap="round" className="edge-main"
            style=${{ strokeWidth: hot ? w + 1.5 : w, transition:'stroke-width .2s ease' }}/>
          <path d=${g.d} stroke="#F8EEE3" fill="none" strokeLinecap="round" strokeDasharray="2.5 9.5" className="edge-flow"
            style=${{ strokeWidth: Math.max(1.3, w * .3) }}/>
          <polygon points=${arrowPts(g)} fill=${col}/>
          <g style=${{ transform:`translate(${lx}px,${ly}px)`, transition:'transform .6s cubic-bezier(.22,.9,.3,1)' }}>
            <rect x=${-lw / 2} y=${-11.5} width=${lw} height=${23} rx=${11.5} fill="#26221B" stroke="#FCF9F3" strokeWidth="3"/>
            <text textAnchor="middle" dominantBaseline="central" fontSize="12.5" fontWeight="600" fill="#F6F1E8" className="numtab">${label}</text>
          </g>
          <path d=${g.d} stroke="#FFFFFF" strokeOpacity="0" strokeWidth="26" fill="none"/>
        </g>`;
      })}

      ${members.map(m => {
        const p = layout.pos[m.id]; if (!p) return null;
        const nv = net[m.id] || 0;
        const pos_ = nv > 0.005, neg = nv < -0.005;
        const netTxt = pos_ ? ('+' + fmt(nv)) : neg ? ('−' + fmt(-nv)) : 'settled';
        const netCol = pos_ ? '#35603D' : neg ? '#8C3B20' : '#8B8271';
        const sel = selected === m.id;
        return html`<g key=${m.id} className="cursor-pointer"
          style=${{ transform:`translate(${p.x}px,${p.y}px)`, transition:'transform .7s cubic-bezier(.22,.9,.3,1), opacity .25s ease', opacity: nodeDim(m.id) }}
          onClick=${() => onNodeClick(m.id)}
          onMouseEnter=${() => setHover({ t:'n', id: m.id })}
          onMouseLeave=${() => setHover(null)}>
          <g className="node-pop" style=${{ transformBox:'fill-box', transformOrigin:'center' }}>
            ${sel && html`<circle r="33.5" fill="none" stroke="#26221B" strokeWidth="1.5" strokeDasharray="3 4.5" strokeLinecap="round"/>`}
            <circle r="27" fill=${m.color} stroke="#FCF9F3" strokeWidth="4"/>
            <text textAnchor="middle" dominantBaseline="central" fontSize="17" fontWeight="600" fill="#FCF9F3">${(m.name || '?').trim()[0].toUpperCase()}</text>
            <text y="46" textAnchor="middle" fontSize=${m.name.length > 9 ? 12 : 13.5} fontWeight="600" fill="#26221B">${m.name}</text>
            <text y="63" textAnchor="middle" fontSize="12" fontWeight="700" fill=${netCol} className="numtab">${netTxt}</text>
          </g>
        </g>`;
      })}

      <g style=${{ pointerEvents:'none' }}>
        <text x=${CX} y=${CY - 8} textAnchor="middle" fontSize="33" fontWeight="600" fill="#26221B" className="font-display numtab">${fmt(Math.round(totalAnim))}</text>
        <text x=${CX} y=${CY + 15} textAnchor="middle" fontSize="10" fontWeight="700" letterSpacing="2.2" fill="#8A8171" style=${{ textTransform:'uppercase' }}>Total spent</text>
        <text x=${CX} y=${CY + 35} textAnchor="middle" fontSize="12" fill="#8A8171">
          ${expenseCount} expense${expenseCount === 1 ? '' : 's'}${settledAll ? '' : ' · ' + eNodes.length + ' open debt' + (eNodes.length === 1 ? '' : 's')}
        </text>
        ${settledAll && html`<g transform=${`translate(${CX} ${CY + 62})`}>
          <rect x="-78" y="-14" width="156" height="28" rx="14" fill="#E3EEE0" stroke="#FCF9F3" strokeWidth="3"/>
          <text textAnchor="middle" dominantBaseline="central" fontSize="12" fontWeight="700" fill="#35603D">All settled up</text>
        </g>`}
      </g>
    </svg>
  </div>`;
}

      </div>`)}
      ${gets.map(e => html`<div key=${'g' + e.from} className="flex items-center gap-2.5 py-1">
        <${Avatar} m=${byId[e.from]} size=${24}/>
        <span className="flex-1 text-[13.5px]">is owed by <span className="font-semibold">${byId[e.from].name}</span></span>

        total=${total} expenseCount=${group.expenses.length} mode=${mode} selected=${selected}
        onNodeClick=${id => setSelected(selected === id ? null : id)}
        onEdgeClick=${e => openSettle({ from: e.from, to: e.to, amount: e.amount })}/>
    </div>

    ${selected && html`<${MemberPanel} key=${selected} group=${group} memberId=${selected} edges=${edges} net=${net}
      byId=${byId} onClose=${() => setSelected(null)} onSettle=${openSettle}/>`}

    <div className="mt-5" id="tour-settle"><${SettleSuggestions} items=${simplified} byId=${byId} onSettle=${openSettle}/></div>
    <div className="mt-4"><${SettleHistory} group=${group} byId=${byId}/></div>
  </div>`;
}

function TimelineEntry({ item, byId, isLast, onDelete, onEdit, onDeleteSettlement }) {
  const [open, setOpen] = useState(false);
  const [confirm, setConfirm] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);

  if (item.k === 's') {
    const s = item.s;
    const f = byId[s.from], t = byId[s.to];
    return html`<div className="flex gap-3">
      <div className="flex flex-col items-center">
        <span className="w-9 h-9 rounded-full bg-sage-tint border border-sage/30 text-sage-deep flex items-center justify-center shrink-0"><${Icon} name="check" size=${16} sw=${3}/></span>
        ${!isLast && html`<span className="w-px flex-1 bg-line my-1.5"></span>`}
      </div>
      <div className="flex-1 min-w-0 pb-6">
        <div className="rounded-2xl border border-dashed border-sage/40 bg-sage-tint/60 px-3.5 py-2.5 flex items-center gap-3">
          <div className="flex-1 min-w-0">
            <div className="text-[14px] font-semibold truncate">${(f || {}).name || '?'} → ${(t || {}).name || '?'}</div>
            <div className="text-[12px] text-sage-deep/80">${s.full ? 'Full settlement' : 'Partial payment'} · ${timeLabel(s.date)}</div>
          </div>
          <span className="font-display text-[16.5px] font-semibold numtab text-sage-deep">${fmt(s.amount)}</span>
          <button onClick=${() => { if (confirmDel) onDeleteSettlement(s.id); else setConfirmDel(true); }} aria-label="Delete settlement"
            className=${'p-1.5 rounded-full transition shrink-0 ' + (confirmDel ? 'bg-rust text-paper' : 'text-muted hover:text-rust hover:bg-rust-tint')}>
            <${Icon} name="trash" size=${13}/>
          </button>
        </div>
      </div>
    </div>`;
  }

  const e = item.e;
  const payer = byId[e.payerId];
  const cat = CATS[e.category] || CATS.misc;
  const splitTxt = e.splitType === 'equal' ? 'split equally' : e.splitType === 'pct' ? 'split by percentage' : 'custom split';
  const parts = Object.entries(e.splits || {});
  return html`<div className="flex gap-3">
    <div className="flex flex-col items-center">
      <span className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style=${{ background: cat.tint, color: cat.fg }}><${Icon} name=${cat.icon} size=${16}/></span>
      ${!isLast && html`<span className="w-px flex-1 bg-line my-1.5"></span>`}
    </div>
    <div className="flex-1 min-w-0 pb-6">
      <div className="cursor-pointer" onClick=${() => { setOpen(!open); setConfirm(false); }}>
        <div className="flex items-baseline justify-between gap-3">
          <span className="text-[15px] font-semibold text-ink truncate">${e.desc}</span>
          <span className="font-display text-[17px] font-semibold numtab shrink-0">${fmt(e.amount)}</span>
        </div>
        <div className="text-[12.5px] text-muted mt-0.5 flex items-center gap-1.5 flex-wrap">
          <span><span className="font-semibold text-ink/70">${(payer || {}).name || '?'}</span> paid</span>
          <span>· ${splitTxt}</span>
          <span className="inline-flex items-center px-1.5 rounded-full text-[10.5px] font-bold uppercase tracking-wide" style=${{ background: cat.tint, color: cat.fg }}>${cat.label}</span>
        </div>
      </div>
      ${open && html`<div className="rise mt-2.5">
        <div className="flex flex-wrap gap-1.5">
          ${parts.map(([pid, v]) => html`<span key=${pid} className="inline-flex items-center gap-1.5 bg-paper border border-line rounded-full pl-1 pr-2.5 py-0.5">
            ${byId[pid] && html`<${Avatar} m=${byId[pid]} size=${20}/>`}
            <span className="text-[12px] font-medium">${firstName(byId[pid] && byId[pid].name)}</span>
            <span className="text-[12px] font-semibold numtab">${fmt(v)}</span>
          </span>`)}
        </div>
        <div className="mt-2.5 flex items-center gap-2 flex-wrap">
          <button onClick=${() => onEdit(e)}
            className="inline-flex items-center gap-1.5 text-[12.5px] font-semibold rounded-full px-3 py-1.5 border border-line text-ink hover:border-ink transition">
            <${Icon} name="pencil" size=${13}/> Edit
          </button>
          <button onClick=${() => { if (confirm) onDelete(e.id); else setConfirm(true); }}
            className=${'inline-flex items-center gap-1.5 text-[12.5px] font-semibold rounded-full px-3 py-1.5 border transition ' +
              (confirm ? 'bg-rust-tint text-rust-deep border-rust/40' : 'border-line text-muted hover:text-rust hover:border-rust/40')}>

          </button>
        </div>
      </div>`}

function ActivityTab({ group, byId, onDelete, onEdit, onDeleteSettlement }) {
  const entries = useMemo(() => [
    ...group.expenses.map(e => ({ k: 'e', ts: e.date, e })),
    ...group.settlements.map(s => ({ k: 's', ts: s.date, s })),
  ].sort((a, b) => b.ts - a.ts), [group]);

  if (entries.length === 0) return html`<div className="max-w-3xl mx-auto px-4 sm:px-6 pt-16 pb-16 text-center">
    <span className="inline-flex w-14 h-14 rounded-full bg-card border border-line items-center justify-center text-muted"><${Icon} name="wallet" size=${22}/></span>
    <p className="mt-3 font-display text-lg font-semibold">Nothing yet</p>
    <p className="text-[13.5px] text-muted mt-1">Expenses and settlements will appear here as a story feed.</p>
  </div>`;

  const days = [];
  for (const it of entries) {
    const lab = dayLabel(it.ts);
    let d = days.find(x => x.label === lab);
    if (!d) { d = { label: lab, items: [] }; days.push(d); }
    d.items.push(it);
  }
  const lastId = (entries[entries.length - 1].e || entries[entries.length - 1].s).id;

  return html`<div className="max-w-3xl mx-auto px-4 sm:px-6 pt-5 pb-10">
    ${days.map(day => html`<div key=${day.label} className="mb-7">
      <div className="flex items-center gap-3 mb-3.5">
        <span className="text-[11px] font-bold tracking-[.18em] uppercase text-muted">${day.label}</span>
        <span className="h-px flex-1 bg-line"></span>
      </div>
      ${day.items.map(it => html`<${TimelineEntry} key=${(it.e || it.s).id} item=${it} byId=${byId}
        isLast=${(it.e || it.s).id === lastId}
        onDelete=${onDelete} onEdit=${onEdit} onDeleteSettlement=${onDeleteSettlement}/>`)}
    </div>`)}
  </div>`;
}

const QUICK = [['Dinner','food'],['Groceries','food'],['Cab','travel'],['Hotel','stay'],['Snacks','food'],['Tickets','misc']];

function AddExpenseSheet({ group, onClose, onSave, initial }) {
  const members = group.members;
  const init = initial || null;
  const [amount, setAmount] = useState(init ? String(init.amount) : '');
  const [desc, setDesc] = useState(init ? init.desc : '');
  const [cat, setCat] = useState(init ? init.category : 'food');
  const [payer, setPayer] = useState(init ? init.payerId : (members[0] ? members[0].id : null));
  const [mode, setMode] = useState(init ? init.splitType : 'equal');
  const [incl, setIncl] = useState(() => {
    const o = {};
    members.forEach(m => { o[m.id] = init ? Number(init.splits[m.id] || 0) > 0.005 : true; });
    return o;
  });
  const [cvals, setCvals] = useState(() => {
    const o = {};
    members.forEach(m => { o[m.id] = init ? String(round2(init.splits[m.id] || 0)) : ''; });
    return o;
  });
  const [pvals, setPvals] = useState(() => {
    const o = {};
    if (init) {
      const ids = members.map(m => m.id);
      let acc = 0;
      ids.forEach((id, idx) => {
        if (idx < ids.length - 1) {
          const v = Math.round(((init.splits[id] || 0) / init.amount * 100) * 100) / 100;
          o[id] = String(v); acc += v;
        }
      });
      o[ids[ids.length - 1]] = String(Math.round((100 - acc) * 100) / 100);
    } else members.forEach(m => { o[m.id] = ''; });
    return o;
  });

  const amt = Math.max(0, parseFloat(amount) || 0);
  const amtP = Math.round(amt * 100);
  const inclIds = members.filter(m => incl[m.id]).map(m => m.id);
  const eqShares = equalShares(amt, inclIds);
  const each = inclIds.length ? amt / inclIds.length : 0;

  const cP = Object.fromEntries(members.map(m => [m.id, Math.round((parseFloat(cvals[m.id]) || 0) * 100)]));
  const cSum = members.reduce((s, m) => s + cP[m.id], 0);
  const cRem = amtP - cSum;

  const pN = Object.fromEntries(members.map(m => [m.id, parseFloat(pvals[m.id]) || 0]));
  const pSum = members.reduce((s, m) => s + pN[m.id], 0);
  const pOk = Math.abs(pSum - 100) < 0.011;
  const pPaise = (() => {
    const o = {}; let acc = 0;
    members.forEach(m => { const v = Math.round(amtP * pN[m.id] / 100); o[m.id] = v; acc += v; });
    const diff = amtP - acc;
    if (diff !== 0) { const f = members.find(m => pN[m.id] > 0) || members[0]; if (f) o[f.id] += diff; }
    return o;
  })();

  const valid = amtP > 0 && (mode === 'equal' ? inclIds.length >= 1 : mode === 'custom' ? cRem === 0 : pOk);

  const evenPct = () => {
    const n = members.length, o = {}; let acc = 0;
    members.forEach((m, i) => {
      if (i < n - 1) { const v = Math.round((100 / n) * 10) / 10; o[m.id] = String(v); acc += v; }
    });
    o[members[n - 1].id] = String(Math.round((100 - acc) * 10) / 10);
    setPvals(o);
  };

  const save = () => {
    if (!valid) return;
    let splits;
    if (mode === 'equal') splits = Object.fromEntries(members.map(m => [m.id, eqShares[m.id] || 0]));
    else if (mode === 'custom') splits = Object.fromEntries(members.map(m => [m.id, cP[m.id] / 100]));
    else splits = Object.fromEntries(members.map(m => [m.id, pPaise[m.id] / 100]));
    onSave({
      id: init ? init.id : uid(),
      desc: desc.trim() || (CATS[cat] ? CATS[cat].label : 'Expense'),
      amount: round2(amt),
      payerId: payer,
      category: cat,
      splitType: mode,
      date: init ? init.date : Date.now(),
      splits,
    });
  };

  return html`<${Sheet} title=${init ? 'Edit expense' : 'Add expense'} onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex items-center gap-2 bg-card">
      <button onClick=${onClose} className="rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <div className="flex-1"></div>
      <button onClick=${save} disabled=${!valid}
        className=${'rounded-full px-5 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' +
          (valid ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        ${init ? 'Save changes' : 'Add expense'}
      </button>
    </div>`}>
    <div className="space-y-5">
      <div>
        <label className="lbl">Amount</label>
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 font-display text-[20px] font-semibold text-muted">₹</span>
          <input inputMode="decimal" className="inp !pl-9 font-display text-[22px] font-semibold numtab" placeholder="0"
            value=${amount} onChange=${e => setAmount(e.target.value.replace(/[^\d.]/g, ''))}/>
        </div>
      </div>

      <div>
        <label className="lbl">Description</label>
        <input className="inp" placeholder="What was it for?" maxLength=${60} value=${desc} onChange=${e => setDesc(e.target.value)}/>
        <div className="mt-2 flex flex-wrap gap-1.5">
          ${QUICK.map(([q, c]) => html`<button key=${q} onClick=${() => { setDesc(q); setCat(c); }}
            className=${'text-[12px] font-semibold rounded-full px-2.5 py-1 border transition ' +
              (desc === q ? 'bg-ink text-paper border-ink' : 'border-line text-muted hover:text-ink hover:border-muted')}>${q}</button>`)}
        </div>
      </div>

      <div>
        <label className="lbl">Category</label>
        <div className="flex gap-2">
          ${Object.entries(CATS).map(([k, c]) => html`<button key=${k} onClick=${() => setCat(k)}
            className=${'flex-1 flex flex-col items-center gap-1 rounded-2xl border px-2 py-2.5 transition ' + (cat === k ? 'border-ink' : 'border-line hover:border-muted')}
            style=${cat === k ? { background: c.tint } : null}>
            <span className="w-8 h-8 rounded-full flex items-center justify-center border-2 border-card" style=${{ background: c.tint, color: c.fg }}><${Icon} name=${c.icon} size=${16}/></span>
            <span className="text-[11.5px] font-semibold" style=${{ color: c.fg }}>${c.label}</span>
          </button>`)}
        </div>
      </div>

      <div>
        <label className="lbl">Paid by</label>
        <div className="flex flex-wrap gap-2">
          ${members.map(m => html`<button key=${m.id} onClick=${() => setPayer(m.id)}
            className=${'flex items-center gap-2 rounded-full border pl-1 pr-3 py-1 transition ' + (payer === m.id ? 'border-ink bg-paper' : 'border-line hover:border-muted')}>
            <${Avatar} m=${m} size=${26}/>
            <span className="text-[13px] font-semibold">${firstName(m.name)}</span>
          </button>`)}
        </div>
      </div>

      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="lbl" style=${{ marginBottom: 0 }}>Split</label>
          <div className="flex bg-paper border border-line rounded-full p-0.5 text-[11.5px] font-semibold">
            ${[['equal','Equal'],['custom','Sliders'],['pct','%']].map(([k, l]) => html`<button key=${k} onClick=${() => setMode(k)}
              className=${'px-2.5 py-1 rounded-full transition ' + (mode === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
          </div>
        </div>

        ${mode === 'equal' && html`<div className="space-y-1.5">
          ${members.map(m => html`<button key=${m.id} onClick=${() => setIncl(o => ({ ...o, [m.id]: !o[m.id] }))}
            className=${'w-full flex items-center gap-2.5 rounded-2xl border px-3 py-2 transition ' + (incl[m.id] ? 'border-line bg-paper' : 'border-line/60 opacity-50')}>
            <span className=${'w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition ' + (incl[m.id] ? 'bg-ink border-ink text-paper' : 'border-muted/50')}>
              ${incl[m.id] && html`<${Icon} name="check" size=${12} sw=${3}/>`}
            </span>
            <${Avatar} m=${m} size=${28}/>
            <span className="text-[13.5px] font-semibold flex-1 text-left">${m.name}</span>
            <span className="numtab text-[13.5px] font-semibold">${fmt(eqShares[m.id] || 0)}</span>
          </button>`)}
          <p className="text-[12px] text-muted pt-1">Each selected person pays <span className="font-semibold text-ink">${fmt(each)}</span>.</p>
        </div>`}

        ${mode === 'custom' && html`<div className="space-y-3">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-3">
            <${Avatar} m=${m} size=${28}/>
            <input type="range" min="0" max=${Math.max(amtP, 1)} step="1" value=${Math.min(cP[m.id], Math.max(amtP, 0))} disabled=${amtP <= 0}
              onChange=${e => {
                const remaining = amtP - (cSum - cP[m.id]);
                const v = Math.max(0, Math.min(remaining, Number(e.target.value)));
                setCvals(o => ({ ...o, [m.id]: String(v / 100) }));
              }} className="flex-1"/>
            <span className="numtab text-[13px] font-semibold w-16 text-right">${fmt(cP[m.id] / 100)}</span>
          </div>`)}
          <div className=${'text-[12.5px] font-semibold numtab ' + (cRem === 0 ? 'text-sage-deep' : 'text-rust-deep')}>
            ${cRem === 0 ? '✓ Fully assigned' : fmt(Math.abs(cRem) / 100) + (cRem > 0 ? ' left to assign' : ' over — reduce someone')}
          </div>
        </div>`}

        ${mode === 'pct' && html`<div className="space-y-2">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-3">
            <${Avatar} m=${m} size=${28}/>
            <input inputMode="decimal" className="inp !py-1.5 text-[13.5px] numtab" placeholder="0" value=${pvals[m.id]}
              onChange=${e => setPvals(o => ({ ...o, [m.id]: e.target.value.replace(/[^\d.]/g, '') }))}/>
            <span className="text-[13px] text-muted font-semibold w-4">%</span>
            <span className="numtab text-[13px] font-semibold w-20 text-right">${fmt(pPaise[m.id] / 100)}</span>
          </div>`)}
          <div className="flex items-center justify-between pt-1">
            <div className=${'text-[12.5px] font-semibold numtab ' + (pOk ? 'text-sage-deep' : 'text-rust-deep')}>${Math.round(pSum * 100) / 100}% assigned</div>
            <button onClick=${evenPct} className="text-[12px] font-bold rounded-full border border-line px-3 py-1.5 hover:border-ink transition">Split evenly</button>
          </div>
        </div>`}
      </div>
    </div>
  <//>`;
}

function SettleSheet({ group, preset, onClose, onSave }) {
  const members = group.members;
  const [fromId, setFromId] = useState(preset ? preset.from : members[0].id);
  const [toId, setToId] = useState(preset ? preset.to : (members[1] || members[0]).id);
  const [amount, setAmount] = useState(preset ? String(preset.amount) : '');
  const amt = Math.max(0, parseFloat(amount) || 0);
  const valid = amt > 0 && fromId !== toId;
  const full = preset ? Math.abs(amt - preset.amount) < 0.005 : false;
  const byId = Object.fromEntries(members.map(m => [m.id, m]));

  const setFrom = id => { setFromId(id); if (id === toId && members.length > 1) setToId(members.find(m => m.id !== id).id); };
  const setTo = id => { setToId(id); if (id === fromId && members.length > 1) setFromId(members.find(m => m.id !== id).id); };

  const save = () => {
    if (!valid) return;
    onSave({ id: uid(), fromId, toId, amount: round2(amt), date: Date.now(), full });
  };

  const Row = ({ label, val, set }) => html`<div className="mb-2.5">
    <div className="text-[11px] font-bold uppercase tracking-[.13em] text-muted mb-1.5">${label}</div>
    <div className="flex flex-wrap gap-2">
      ${members.map(m => html`<button key=${m.id} onClick=${() => set(m.id)}
        className=${'flex items-center gap-2 rounded-full border pl-1 pr-3 py-1 transition ' + (val === m.id ? 'border-ink bg-paper' : 'border-line hover:border-muted')}>
        <${Avatar} m=${m} size=${24}/>
        <span className="text-[13px] font-semibold">${firstName(m.name)}</span>
      </button>`)}
    </div>
  </div>`;

  return html`<${Sheet} title="Settle up" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex items-center gap-2 bg-card">
      <button onClick=${onClose} className="rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <div className="flex-1"></div>
      <button onClick=${save} disabled=${!valid}
        className=${'rounded-full px-5 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' +
          (valid ? 'bg-sage text-paper hover:bg-sage-deep' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        Record payment
      </button>
    </div>`}>
    <div className="space-y-5">
      ${preset && html`<div className="flex items-center gap-2.5 bg-paper border border-line rounded-2xl px-3.5 py-2.5">
        <${Avatar} m=${byId[preset.from]} size=${26}/>
        <span className="text-[13px] flex-1">owes <span className="font-semibold">${(byId[preset.to] || {}).name || '?'}</span></span>
        <span className="numtab text-[13.5px] font-semibold">${fmt(preset.amount)}</span>
      </div>`}

      <div>
        <label className="lbl">Direction</label>
        <${Row} label="From (who paid)" val=${fromId} set=${setFrom}/>
        <${Row} label="To (who received)" val=${toId} set=${setTo}/>
      </div>

      <div>
        <label className="lbl">Amount</label>
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 font-display text-[20px] font-semibold text-muted">₹</span>
          <input inputMode="decimal" className="inp !pl-9 font-display text-[22px] font-semibold numtab" placeholder="0"
            value=${amount} onChange=${e => setAmount(e.target.value.replace(/[^\d.]/g, ''))}/>
        </div>
        ${preset && html`<div className="mt-2 flex flex-wrap gap-1.5">
          <button onClick=${() => setAmount(String(round2(preset.amount / 2)))}
            className="text-[12px] font-semibold rounded-full border border-line px-2.5 py-1 text-muted hover:text-ink hover:border-muted transition">Half · ${fmt(round2(preset.amount / 2))}</button>
          <button onClick=${() => setAmount(String(preset.amount))}
            className="text-[12px] font-semibold rounded-full border border-line px-2.5 py-1 text-muted hover:text-ink hover:border-muted transition">Full · ${fmt(preset.amount)}</button>
        </div>`}
        ${preset && html`<p className="text-[12px] text-muted mt-2">${full ? 'This clears the debt completely.' : 'Recorded as a partial payment.'}</p>`}
      </div>
    </div>
  <//>`;
}

function GroupSheet({ group, onClose, onSaveGroup, onReset, onReplayTour, isDemo }) {
  const [name, setName] = useState(group.name);
  const [members, setMembers] = useState(group.members);
  const [newName, setNewName] = useState('');

  const addMember = () => {
    const n = newName.trim(); if (!n) return;
    setMembers(ms => [...ms, { id: uid(), name: n, color: AV[ms.length % AV.length] }]);
    setNewName('');
  };
  const removeMember = id => { if (members.length > 2) setMembers(ms => ms.filter(m => m.id !== id)); };
  const save = () => onSaveGroup({ name: name.trim() || group.name, members });

  return html`<${Sheet} title="Group settings" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <button onClick=${save} className="flex-1 rounded-full bg-ink text-paper px-4 py-2.5 text-[13.5px] font-semibold hover:bg-ink/90 active:scale-95 transition">Save changes</button>
    </div>`}>
    <div className="space-y-5">
      <div>
        <label className="lbl">Group name</label>
        <input className="inp" value=${name} maxLength=${40} onChange=${e => setName(e.target.value)}/>
      </div>

      <div>
        <label className="lbl">Members · ${members.length}</label>
        <div className="space-y-1.5">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-2.5 bg-paper border border-line rounded-2xl pl-2 pr-2 py-1.5">
            <${Avatar} m=${m} size=${30}/>
            <span className="text-[13.5px] font-semibold flex-1 truncate">${m.name}</span>
            <button onClick=${() => removeMember(m.id)} disabled=${members.length <= 2} aria-label=${'Remove ' + m.name}
              className=${'p-1.5 rounded-full transition ' + (members.length <= 2 ? 'opacity-30 cursor-not-allowed text-muted' : 'text-muted hover:text-rust hover:bg-rust-tint')}>
              <${Icon} name="x" size=${14}/>
            </button>
          </div>`)}
        </div>
        <div className="mt-2 flex gap-2">
          <input className="inp flex-1" placeholder="Add someone…" maxLength=${24} value=${newName}
            onChange=${e => setNewName(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter') addMember(); }}/>
          <button onClick=${addMember} disabled=${!newName.trim()} aria-label="Add member"
            className=${'shrink-0 w-11 rounded-xl flex items-center justify-center transition ' + (newName.trim() ? 'bg-ink text-paper hover:bg-ink/90 active:scale-95' : 'bg-paper border border-line text-muted')}>
            <${Icon} name="plus" size=${18}/>
          </button>
        </div>
      </div>

      <button onClick=${onReplayTour} className="w-full flex items-center gap-2.5 rounded-2xl border border-line px-4 py-3 hover:border-muted transition">
        <${Icon} name="replay" size=${16} className="text-muted"/>
        <span className="text-[13.5px] font-semibold flex-1 text-left">Replay the guided tour</span>
        <${Icon} name="right" size=${14} className="text-muted"/>
      </button>

      <div className="bg-rust-tint/60 border border-rust/25 rounded-2xl px-4 py-3.5">
        <div className="text-[13px] font-bold text-rust-deep">${isDemo ? 'You’re viewing the demo' : 'Danger zone'}</div>
        <p className="text-[12.5px] text-rust-deep/80 mt-0.5">${isDemo
          ? 'Everything here is sample data stored only in your browser.'
          : 'This wipes all expenses and settlements in this group.'}</p>
        <div className="mt-2.5 flex flex-wrap gap-2">
          ${isDemo && html`<button onClick=${() => onReset('own')}
            className="rounded-full bg-ink text-paper text-[12.5px] font-semibold px-3.5 py-2 hover:bg-ink/90 active:scale-95 transition">Start my own group</button>`}
          <button onClick=${() => onReset(isDemo ? 'demo' : 'own')}
            className="inline-flex items-center gap-1.5 rounded-full border border-rust/40 text-rust-deep text-[12.5px] font-semibold px-3.5 py-2 hover:bg-card transition">
            <${Icon} name="replay" size=${13}/> ${isDemo ? 'Reset demo' : 'Wipe & start over'}
          </button>
        </div>
      </div>
    </div>
  <//>`;
}

/* ---------------- chrome: header & bottom nav ---------------- */

function Header({ group, total, demo, onSettings }) {
  return html`<header className="sticky top-0 z-40 bg-paper/85 backdrop-blur-md border-b border-line">
    <div className="max-w-3xl mx-auto px-4 sm:px-6 h-[60px] flex items-center gap-3">
      <span className="w-9 h-9 rounded-2xl bg-ink text-paper flex items-center justify-center font-display font-bold text-[16px] shrink-0 shadow-soft">H</span>
      <div className="min-w-0 flex-1">
        <div className="flex items-center gap-2">
          <h1 className="font-display text-[17px] font-semibold truncate leading-tight">${group.name}</h1>
          ${demo && html`<span className="text-[9.5px] font-bold tracking-[.14em] uppercase bg-rust-tint text-rust-deep rounded-full px-1.5 py-0.5 shrink-0">Demo</span>`}
        </div>
        <div className="text-[11.5px] text-muted truncate numtab">${group.members.length} member${group.members.length === 1 ? '' : 's'} · ${fmt(total)} spent</div>
      </div>
      <${AvStack} members=${group.members} size=${24} max=${4}/>
      <button onClick=${onSettings} aria-label="Group settings" className="p-2 rounded-full text-muted hover:bg-card hover:text-ink transition">
        <${Icon} name="slider" size=${18}/>
      </button>
    </div>
  </header>`;
}

function BottomNav({ tab, setTab, onAdd }) {
  const item = (k, icon, label, id) => html`<button key=${k} id=${id} onClick=${() => setTab(k)}
    className=${'flex flex-col items-center gap-0.5 px-6 py-1.5 rounded-2xl transition ' + (tab === k ? 'text-ink' : 'text-muted hover:text-ink')}>
    <${Icon} name=${icon} size=${20} sw=${tab === k ? 2.4 : 2}/>
    <span className="text-[10.5px] font-bold tracking-wide">${label}</span>
  </button>`;
  return html`<nav className="fixed bottom-0 inset-x-0 z-40 border-t border-line bg-card/95 backdrop-blur-md">
    <div className="max-w-3xl mx-auto px-8 h-[64px] flex items-center justify-between relative">
      ${item('balance', 'wallet', 'Balance')}
      <button id="tour-add" onClick=${onAdd} aria-label="Add expense"
        className="absolute left-1/2 -translate-x-1/2 -top-6 w-14 h-14 rounded-full bg-ink text-paper flex items-center justify-center shadow-pop border-4 border-paper transition active:scale-90 hover:bg-ink/90">
        <${Icon} name="plus" size=${24} sw=${2.4}/>
      </button>
      ${item('activity', 'book', 'Activity', 'tour-activity')}
    </div>
  </nav>`;
}

/* ---------------- app ---------------- */

function App() {
  const [db, setDb] = useState(() => {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.groups && d.groups.length) return d; }
    } catch (e) {}
    return freshDemoDb();
  });
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }, [db]);

  const group = db.groups[0];
  const [tab, setTab] = useState('balance');
  const [selected, setSelected] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const [tourOpen, setTourOpen] = useState(!db.tourDone);

  const showToast = (msg, icon) => {
    const key = Date.now();
    setToast({ key, msg, icon });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  };

  const byId = useMemo(() => Object.fromEntries(group.members.map(m => [m.id, m])), [group.members]);
  const { edges, net } = useMemo(() => computePairwise(group), [group]);
  const simplified = useMemo(() => simplify(net), [net]);
  const total = useMemo(() => group.expenses.reduce((s, e) => s + (+e.amount || 0), 0), [group.expenses]);

  const patchGroup = fn => setDb(d => ({ ...d, groups: d.groups.map((g, i) => i === 0 ? fn(g) : g) }));

  const saveExpense = exp => {
    const existed = group.expenses.some(e => e.id === exp.id);
    patchGroup(g => ({ ...g, expenses: existed ? g.expenses.map(e => e.id === exp.id ? exp : e) : [...g.expenses, exp] }));
    setSheet(null);
    showToast(existed ? 'Expense updated' : 'Expense added');
  };
  const deleteExpense = id => {
    patchGroup(g => ({ ...g, expenses: g.expenses.filter(e => e.id !== id) }));
    showToast('Expense deleted', 'trash');
  };
  const saveSettlement = s => {
    patchGroup(g => ({ ...g, settlements: [...g.settlements, s] }));
    setSheet(null); setSelected(null);
    showToast('Settlement recorded');
  };
  const deleteSettlement = id => {
    patchGroup(g => ({ ...g, settlements: g.settlements.filter(s => s.id !== id) }));
    showToast('Settlement removed', 'trash');
  };
  const saveGroup = ({ name, members }) => {
    patchGroup(g => ({ ...g, name, members }));
    setSheet(null); setSelected(null);
    showToast('Group updated');
  };
  const resetAll = kind => {
    if (kind === 'demo') {
      setDb(freshDemoDb());
      showToast('Demo restored', 'replay');
    } else {
      setDb({ v: 2, demo: false, tourDone: true, groups: [{
        id: uid(), name: 'My group', color: '#48764F',
        members: [{ id: uid(), name: 'You', color: AV[0] }],
        expenses: [], settlements: [],
      }] });
      showToast('Fresh start — add your crew!', 'sparkle');
    }
    setSheet(null); setSelected(null); setTab('balance');
  };

  const finishTour = () => {
    setTourOpen(false);
    setDb(d => d.tourDone ? d : { ...d, tourDone: true });
  };
  const finalTour = () => { finishTour(); setSheet({ type:'group' }); };

  const openSettle = preset => setSheet({ type:'settle', preset });
  const openAdd = initial => setSheet(initial ? { type:'add', initial } : { type:'add' });

  return html`<div className="min-h-screen bg-paper text-ink font-sans antialiased flex flex-col">
    <${Header} group=${group} total=${total} demo=${db.demo} onSettings=${() => setSheet({ type:'group' })}/>

    <main className="flex-1">
      ${tab === 'balance'
        ? html`<${BalanceTab} group=${group} edges=${edges} net=${net} simplified=${simplified} total=${total}
            selected=${selected} setSelected=${setSelected} openSettle=${openSettle}/>`
        : html`<${ActivityTab} group=${group} byId=${byId}
            onDelete=${deleteExpense} onEdit=${openAdd} onDeleteSettlement=${deleteSettlement}/>`}
    </main>

    <${Footer}/>

    <${BottomNav} tab=${tab} setTab=${k => { setTab(k); setSelected(null); }} onAdd=${() => openAdd()}/>

    ${sheet && sheet.type === 'add' && html`<${AddExpenseSheet} key=${sheet.initial ? sheet.initial.id : 'new'}
      group=${group} initial=${sheet.initial} onClose=${() => setSheet(null)} onSave=${saveExpense}/>`}
    ${sheet && sheet.type === 'settle' && html`<${SettleSheet} key=${sheet.preset ? (sheet.preset.from + '>' + sheet.preset.to + sheet.preset.amount) : 'free'}
      group=${group} preset=${sheet.preset} onClose=${() => setSheet(null)} onSave=${saveSettlement}/>`}
    ${sheet && sheet.type === 'group' && html`<${GroupSheet} group=${group} isDemo=${db.demo}
      onClose=${() => setSheet(null)} onSaveGroup=${saveGroup} onReset=${resetAll}
      onReplayTour=${() => { setSheet(null); setTourOpen(true); }}/>`}

    <${ToastView} toast=${toast}/>
    ${tourOpen && html`<${Tour} steps=${TOUR_STEPS} onFinish=${finishTour} onFinal=${finalTour}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
