const QUICK = [['Dinner','food'],['Groceries','food'],['Cab','travel'],['Hotel','stay'],['Snacks','food'],['Tickets','misc']];

function AddExpenseSheet({ group, onClose, onSave, initial }) {
  const members = group.members;
  const init = initial || null;
  const [amount, setAmount] = useState(init ? String(init.amount) : '');
  const [desc, setDesc] = useState(init ? init.desc : '');
  const [cat, setCat] = useState(init ? init.category : 'food');
  const [payer, setPayer] = useState(init ? init.payerId : (members[0] ? members[0].id : null));
  const [mode, setMode] = useState(init ? init.splitType : 'equal');
  const [incl, setIncl] = useState(() => {
    const o = {};
    members.forEach(m => { o[m.id] = init ? Number(init.splits[m.id] || 0) > 0.005 : true; });
    return o;
  });
  const [cvals, setCvals] = useState(() => {
    const o = {};
    members.forEach(m => { o[m.id] = init ? String(round2(init.splits[m.id] || 0)) : ''; });
    return o;
  });
  const [pvals, setPvals] = useState(() => {
    const o = {};
    if (init) {
      const ids = members.map(m => m.id);
      let acc = 0;
      ids.forEach((id, idx) => {
        if (idx < ids.length - 1) {
          const v = Math.round(((init.splits[id] || 0) / init.amount * 100) * 100) / 100;
          o[id] = String(v); acc += v;
        }
      });
      o[ids[ids.length - 1]] = String(Math.round((100 - acc) * 100) / 100);
    } else members.forEach(m => { o[m.id] = ''; });
    return o;
  });

  const amt = Math.max(0, parseFloat(amount) || 0);
  const amtP = Math.round(amt * 100);
  const inclIds = members.filter(m => incl[m.id]).map(m => m.id);
  const eqShares = equalShares(amt, inclIds);
  const each = inclIds.length ? amt / inclIds.length : 0;

  const cP = Object.fromEntries(members.map(m => [m.id, Math.round((parseFloat(cvals[m.id]) || 0) * 100)]));
  const cSum = members.reduce((s, m) => s + cP[m.id], 0);
  const cRem = amtP - cSum;

  const pN = Object.fromEntries(members.map(m => [m.id, parseFloat(pvals[m.id]) || 0]));
  const pSum = members.reduce((s, m) => s + pN[m.id], 0);
  const pOk = Math.abs(pSum - 100) < 0.011;
  const pPaise = (() => {
    const o = {}; let acc = 0;
    members.forEach(m => { const v = Math.round(amtP * pN[m.id] / 100); o[m.id] = v; acc += v; });
    const diff = amtP - acc;
    if (diff !== 0) { const f = members.find(m => pN[m.id] > 0) || members[0]; if (f) o[f.id] += diff; }
    return o;
  })();

  const valid = amtP > 0 && (mode === 'equal' ? inclIds.length >= 1 : mode === 'custom' ? cRem === 0 : pOk);

  const evenPct = () => {
    const n = members.length, o = {}; let acc = 0;
    members.forEach((m, i) => {
      if (i < n - 1) { const v = Math.round((100 / n) * 10) / 10; o[m.id] = String(v); acc += v; }
    });
    o[members[n - 1].id] = String(Math.round((100 - acc) * 10) / 10);
    setPvals(o);
  };

  const save = () => {
    if (!valid) return;
    let splits;
    if (mode === 'equal') splits = Object.fromEntries(members.map(m => [m.id, eqShares[m.id] || 0]));
    else if (mode === 'custom') splits = Object.fromEntries(members.map(m => [m.id, cP[m.id] / 100]));
    else splits = Object.fromEntries(members.map(m => [m.id, pPaise[m.id] / 100]));
    onSave({
      id: init ? init.id : uid(),
      desc: desc.trim() || (CATS[cat] ? CATS[cat].label : 'Expense'),
      amount: round2(amt),
      payerId: payer,
      category: cat,
      splitType: mode,
      date: init ? init.date : Date.now(),
      splits,
    });
  };

  return html`<${Sheet} title=${init ? 'Edit expense' : 'Add expense'} onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex items-center gap-2 bg-card">
      <button onClick=${onClose} className="rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <div className="flex-1"></div>
      <button onClick=${save} disabled=${!valid}
        className=${'rounded-full px-5 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' +
          (valid ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        ${init ? 'Save changes' : 'Add expense'}
      </button>
    </div>`}>
    <div className="space-y-5">
      <div>
        <label className="lbl">Amount</label>
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 font-display text-[20px] font-semibold text-muted">₹</span>
          <input inputMode="decimal" className="inp !pl-9 font-display text-[22px] font-semibold numtab" placeholder="0"
            value=${amount} onChange=${e => setAmount(e.target.value.replace(/[^\d.]/g, ''))}/>
        </div>
      </div>

      <div>
        <label className="lbl">Description</label>
        <input className="inp" placeholder="What was it for?" maxLength=${60} value=${desc} onChange=${e => setDesc(e.target.value)}/>
        <div className="mt-2 flex flex-wrap gap-1.5">
          ${QUICK.map(([q, c]) => html`<button key=${q} onClick=${() => { setDesc(q); setCat(c); }}
            className=${'text-[12px] font-semibold rounded-full px-2.5 py-1 border transition ' +
              (desc === q ? 'bg-ink text-paper border-ink' : 'border-line text-muted hover:text-ink hover:border-muted')}>${q}</button>`)}
        </div>
      </div>

      <div>
        <label className="lbl">Category</label>
        <div className="flex gap-2">
          ${Object.entries(CATS).map(([k, c]) => html`<button key=${k} onClick=${() => setCat(k)}
            className=${'flex-1 flex flex-col items-center gap-1 rounded-2xl border px-2 py-2.5 transition ' + (cat === k ? 'border-ink' : 'border-line hover:border-muted')}
            style=${cat === k ? { background: c.tint } : null}>
            <span className="w-8 h-8 rounded-full flex items-center justify-center border-2 border-card" style=${{ background: c.tint, color: c.fg }}><${Icon} name=${c.icon} size=${16}/></span>
            <span className="text-[11.5px] font-semibold" style=${{ color: c.fg }}>${c.label}</span>
          </button>`)}
        </div>
      </div>

      <div>
        <label className="lbl">Paid by</label>
        <${PeoplePill} members=${members} selected=${[payer]} single emptyLabel="Who paid?"
          onToggle=${id => setPayer(id)}/>
      </div>

      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="lbl" style=${{ marginBottom: 0 }}>Split</label>
          <div className="flex bg-paper border border-line rounded-full p-0.5 text-[11.5px] font-semibold">
            ${[['equal','Equal'],['custom','Sliders'],['pct','%']].map(([k, l]) => html`<button key=${k} onClick=${() => setMode(k)}
              className=${'px-2.5 py-1 rounded-full transition ' + (mode === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
          </div>
        </div>

        ${mode === 'equal' && html`<div className="space-y-2.5">
          <${PeoplePill} members=${members} selected=${inclIds} emptyLabel="Nobody yet"
            onToggle=${id => setIncl(o => ({ ...o, [id]: !o[id] }))}
            sub=${m => incl[m.id] ? fmt(eqShares[m.id] || 0) : 'not included'}/>
          <p className="text-[12px] text-muted pt-0.5">Each selected person pays <span className="font-semibold text-ink">${fmt(each)}</span>.</p>
        </div>`}

        ${mode === 'custom' && html`<div className="space-y-3">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-3">
            <${Avatar} m=${m} size=${28}/>
            <input type="range" min="0" max=${Math.max(amtP, 1)} step="1" value=${Math.min(cP[m.id], Math.max(amtP, 0))} disabled=${amtP <= 0}
              onChange=${e => {
                const remaining = amtP - (cSum - cP[m.id]);
                const v = Math.max(0, Math.min(remaining, Number(e.target.value)));
                setCvals(o => ({ ...o, [m.id]: String(v / 100) }));
              }} className="flex-1"/>
            <span className="numtab text-[13px] font-semibold w-16 text-right">${fmt(cP[m.id] / 100)}</span>
          </div>`)}
          <div className=${'text-[12.5px] font-semibold numtab ' + (cRem === 0 ? 'text-sage-deep' : 'text-rust-deep')}>
            ${cRem === 0 ? '✓ Fully assigned' : fmt(Math.abs(cRem) / 100) + (cRem > 0 ? ' left to assign' : ' over — reduce someone')}
          </div>
        </div>`}

        ${mode === 'pct' && html`<div className="space-y-2">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-3">
            <${Avatar} m=${m} size=${28}/>
            <input inputMode="decimal" className="inp !py-1.5 text-[13.5px] numtab" placeholder="0" value=${pvals[m.id]}
              onChange=${e => setPvals(o => ({ ...o, [m.id]: e.target.value.replace(/[^\d.]/g, '') }))}/>
            <span className="text-[13px] text-muted font-semibold w-4">%</span>
            <span className="numtab text-[13px] font-semibold w-20 text-right">${fmt(pPaise[m.id] / 100)}</span>
          </div>`)}
          <div className="flex items-center justify-between pt-1">
            <div className=${'text-[12.5px] font-semibold numtab ' + (pOk ? 'text-sage-deep' : 'text-rust-deep')}>${Math.round(pSum * 100) / 100}% assigned</div>
            <button onClick=${evenPct} className="text-[12px] font-bold rounded-full border border-line px-3 py-1.5 hover:border-ink transition">Split evenly</button>
          </div>
        </div>`}
      </div>
    </div>
  <//>`;
}

function SettleSheet({ group, preset, onClose, onSave }) {
  const members = group.members;
  const [fromId, setFromId] = useState(preset ? preset.from : members[0].id);
  const [toId, setToId] = useState(preset ? preset.to : (members[1] || members[0]).id);
  const [amount, setAmount] = useState(preset ? String(preset.amount) : '');
  const amt = Math.max(0, parseFloat(amount) || 0);
  const valid = amt > 0 && fromId !== toId;
  const full = preset ? Math.abs(amt - preset.amount) < 0.005 : false;
  const byId = Object.fromEntries(members.map(m => [m.id, m]));

  const setFrom = id => { setFromId(id); if (id === toId && members.length > 1) setToId(members.find(m => m.id !== id).id); };
  const setTo = id => { setToId(id); if (id === fromId && members.length > 1) setFromId(members.find(m => m.id !== id).id); };

  const save = () => {
    if (!valid) return;
    onSave({ id: uid(), fromId, toId, amount: round2(amt), date: Date.now(), full });
  };

  const Row = ({ label, val, set }) => html`<div className="mb-2.5">
    <div className="text-[11px] font-bold uppercase tracking-[.13em] text-muted mb-1.5">${label}</div>
    <div className="flex flex-wrap gap-2">
      ${members.map(m => html`<button key=${m.id} onClick=${() => set(m.id)}
        className=${'flex items-center gap-2 rounded-full border pl-1 pr-3 py-1 transition ' + (val === m.id ? 'border-ink bg-paper' : 'border-line hover:border-muted')}>
        <${Avatar} m=${m} size=${24}/>
        <span className="text-[13px] font-semibold">${firstName(m.name)}</span>
      </button>`)}
    </div>
  </div>`;

  return html`<${Sheet} title="Settle up" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex items-center gap-2 bg-card">
      <button onClick=${onClose} className="rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <div className="flex-1"></div>
      <button onClick=${save} disabled=${!valid}
        className=${'rounded-full px-5 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' +
          (valid ? 'bg-sage text-paper hover:bg-sage-deep' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        Record payment
      </button>
    </div>`}>
    <div className="space-y-5">
      ${preset && html`<div className="flex items-center gap-2.5 bg-paper border border-line rounded-2xl px-3.5 py-2.5">
        <${Avatar} m=${byId[preset.from]} size=${26}/>
        <span className="text-[13px] flex-1">owes <span className="font-semibold">${(byId[preset.to] || {}).name || '?'}</span></span>
        <span className="numtab text-[13.5px] font-semibold">${fmt(preset.amount)}</span>
      </div>`}

      <div>
        <label className="lbl">Direction</label>
        <${Row} label="From (who paid)" val=${fromId} set=${setFrom}/>
        <${Row} label="To (who received)" val=${toId} set=${setTo}/>
      </div>

      <div>
        <label className="lbl">Amount</label>
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 font-display text-[20px] font-semibold text-muted">₹</span>
          <input inputMode="decimal" className="inp !pl-9 font-display text-[22px] font-semibold numtab" placeholder="0"
            value=${amount} onChange=${e => setAmount(e.target.value.replace(/[^\d.]/g, ''))}/>
        </div>
        ${preset && html`<div className="mt-2 flex flex-wrap gap-1.5">
          <button onClick=${() => setAmount(String(round2(preset.amount / 2)))}
            className="text-[12px] font-semibold rounded-full border border-line px-2.5 py-1 text-muted hover:text-ink hover:border-muted transition">Half · ${fmt(round2(preset.amount / 2))}</button>
          <button onClick=${() => setAmount(String(preset.amount))}
            className="text-[12px] font-semibold rounded-full border border-line px-2.5 py-1 text-muted hover:text-ink hover:border-muted transition">Full · ${fmt(preset.amount)}</button>
        </div>`}
        ${preset && html`<p className="text-[12px] text-muted mt-2">${full ? 'This clears the debt completely.' : 'Recorded as a partial payment.'}</p>`}
      </div>
    </div>
  <//>`;
}

function GroupSheet({ group, onClose, onSaveGroup, onReset, onReplayTour, isDemo, isCreate, onSheet, onShare, onStopShare, onJoinOpen, onRestore, backupName }) {
  const [name, setName] = useState(isCreate ? 'My trip' : group.name);
  const [members, setMembers] = useState(isCreate ? [{ id: uid(), name: 'You', color: AV[0] }] : group.members);
  const [newName, setNewName] = useState('');
  const [sharing, setSharing] = useState(false);
  const [shareErr, setShareErr] = useState(false);
  const [copied, setCopied] = useState(false);

  const share = async () => {
    setSharing(true); setShareErr(false);
    try { await onShare(); } catch (e) { setShareErr(true); }
    setSharing(false);
  };
  const copyCode = () => {
    const c = group.shareCode && group.shareCode.code; if (!c) return;
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = c; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
  };

  const addMember = () => {
    const n = newName.trim(); if (!n) return;
    setMembers(ms => [...ms, { id: uid(), name: n, color: AV[ms.length % AV.length] }]);
    setNewName('');
  };
  const removeMember = id => { if (members.length > 2) setMembers(ms => ms.filter(m => m.id !== id)); };
  const save = () => onSaveGroup({ name: name.trim() || (isCreate ? 'My trip' : group.name), members });

  return html`<${Sheet} title=${isCreate ? 'Make your own trip' : 'Group settings'} onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <button onClick=${save} className="flex-1 rounded-full bg-ink text-paper px-4 py-2.5 text-[13.5px] font-semibold hover:bg-ink/90 active:scale-95 transition">${isCreate ? 'Create trip' : 'Save changes'}</button>
    </div>`}>
    <div className="space-y-5">
      ${isCreate && html`<p className="text-[12px] text-muted leading-relaxed bg-paper border border-line rounded-xl px-3.5 py-2.5">Your current group and expenses stay untouched until you tap <span className="font-semibold text-ink">Create trip</span>.</p>`}
      <div>
        <label className="lbl">Group name</label>
        <input className="inp" value=${name} maxLength=${40} onChange=${e => setName(e.target.value)}/>
      </div>

      <div>
        <label className="lbl">Members · ${members.length}</label>
        <div className="space-y-1.5">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-2.5 bg-paper border border-line rounded-2xl pl-2 pr-2 py-1.5">
            <${Avatar} m=${m} size=${30}/>
            <span className="text-[13.5px] font-semibold flex-1 truncate">${m.name}</span>
            <button onClick=${() => removeMember(m.id)} disabled=${members.length <= 2} aria-label=${'Remove ' + m.name}
              className=${'p-1.5 rounded-full transition ' + (members.length <= 2 ? 'opacity-30 cursor-not-allowed text-muted' : 'text-muted hover:text-rust hover:bg-rust-tint')}>
              <${Icon} name="x" size=${14}/>
            </button>
          </div>`)}
        </div>
        <div className="mt-2 flex gap-2">
          <input className="inp flex-1" placeholder="Add someone…" maxLength=${24} value=${newName}
            onChange=${e => setNewName(e.target.value)}
            onKeyDown=${e => { if (e.key === 'Enter') addMember(); }}/>
          <button onClick=${addMember} disabled=${!newName.trim()} aria-label="Add member"
            className=${'shrink-0 w-11 rounded-xl flex items-center justify-center transition ' + (newName.trim() ? 'bg-ink text-paper hover:bg-ink/90 active:scale-95' : 'bg-paper border border-line text-muted')}>
            <${Icon} name="plus" size=${18}/>
          </button>
        </div>
      </div>

      ${!isCreate && html`
      <button onClick=${onSheet} className="w-full flex items-center gap-2.5 rounded-2xl border border-line px-4 py-3 hover:border-muted transition">
        <${Icon} name="sheet" size=${16} className="text-muted"/>
        <span className="text-[13.5px] font-semibold flex-1 text-left">Download trip sheet · Excel</span>
        <${Icon} name="right" size=${14} className="text-muted"/>
      </button>

      <div>
        <label className="lbl">Share & live sync</label>
        ${!group.shareCode ? html`
        <button onClick=${share} disabled=${sharing} className="w-full flex items-center gap-2.5 rounded-2xl border border-line px-4 py-3 hover:border-muted transition disabled:opacity-50">
          <${Icon} name="arrLR" size=${16} className="text-muted"/>
          <span className="text-[13.5px] font-semibold flex-1 text-left">${sharing ? 'Creating your code…' : 'Share this trip — get a code'}</span>
          <${Icon} name="right" size=${14} className="text-muted"/>
        </button>
        ${shareErr && html`<p className="text-[12px] text-rust-deep mt-1.5">Couldn’t create the code — check your internet and try again.</p>`}
        <p className="text-[11.5px] text-muted mt-2 leading-relaxed">Generates a code you can paste into Splid on any other device. That device joins this trip, and every expense or settlement syncs live, both ways.</p>
        ` : html`
        <div className="bg-paper border border-line rounded-2xl p-3.5">
          <div className="flex items-center gap-2">
            <span className="w-2 h-2 rounded-full bg-sage live-dot"></span>
            <span className="text-[11px] font-bold tracking-[.14em] uppercase text-sage-deep">Live sync active</span>
          </div>
          <div className="mt-2.5 flex items-center gap-2">
            <code className="font-mono text-[13px] font-bold tracking-[.06em] leading-snug break-all flex-1 numtab">${group.shareCode.code}</code>
            <button onClick=${copyCode} className="shrink-0 rounded-full bg-ink text-paper text-[11.5px] font-bold px-3 py-1.5 hover:bg-ink/90 active:scale-95 transition w-[76px]">${copied ? 'Copied ✓' : 'Copy'}</button>
          </div>
          <p className="text-[11.5px] text-muted mt-2.5 leading-relaxed">Paste this code into Splid on another device to invite it here. Edits flow live, both ways.</p>
          <div className="mt-3 flex flex-wrap gap-2">
            <button onClick=${onJoinOpen} className="rounded-full border border-line text-[12px] font-semibold px-3.5 py-2 hover:border-muted transition">Join another trip</button>
            <button onClick=${onStopShare} className="rounded-full border border-rust/40 text-rust-deep text-[12px] font-semibold px-3.5 py-2 hover:bg-rust-tint transition">Stop live sync</button>
          </div>
        </div>
        `}
      </div>

      ${backupName && html`<button onClick=${onRestore} className="w-full flex items-center gap-2.5 rounded-2xl border border-line px-4 py-3 hover:border-muted transition">
        <${Icon} name="replay" size=${16} className="text-muted"/>
        <span className="text-[13.5px] font-semibold flex-1 text-left">Restore “${backupName}”</span>
        <${Icon} name="right" size=${14} className="text-muted"/>
      </button>`}

      <button onClick=${onReplayTour} className="w-full flex items-center gap-2.5 rounded-2xl border border-line px-4 py-3 hover:border-muted transition">
        <${Icon} name="replay" size=${16} className="text-muted"/>
        <span className="text-[13.5px] font-semibold flex-1 text-left">Replay the guided tour</span>
        <${Icon} name="right" size=${14} className="text-muted"/>
      </button>

      <div className="bg-rust-tint/60 border border-rust/25 rounded-2xl px-4 py-3.5">
        <div className="text-[13px] font-bold text-rust-deep">${isDemo ? 'You’re viewing the demo' : 'Danger zone'}</div>
        <p className="text-[12.5px] text-rust-deep/80 mt-0.5">${isDemo
          ? 'Everything here is sample data stored only in your browser.'
          : 'This wipes all expenses and settlements in this group.'}</p>
        <div className="mt-2.5 flex flex-wrap gap-2">
          ${isDemo && html`<button onClick=${() => onReset('own')}
            className="rounded-full bg-ink text-paper text-[12.5px] font-semibold px-3.5 py-2 hover:bg-ink/90 active:scale-95 transition">Start my own group</button>`}
          <button onClick=${() => onReset(isDemo ? 'demo' : 'own')}
            className="inline-flex items-center gap-1.5 rounded-full border border-rust/40 text-rust-deep text-[12.5px] font-semibold px-3.5 py-2 hover:bg-card transition">
            <${Icon} name="replay" size=${13}/> ${isDemo ? 'Reset demo' : 'Wipe & start over'}
          </button>
        </div>
      </div>
      `}
    </div>
  <//>`;
}

/* ---------------- join sheet ---------------- */

function JoinSheet({ onClose, onJoin }) {

  const [err, setErr] = useState(null);

    if (!code.trim() || busy) return;

    try { await onJoin(code); }
    catch (e) { setErr('No trip found for that code — double-check it and try again.'); setBusy(false); }
  };
  return html`<${Sheet} title="Join a shared trip" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <button onClick=${submit} disabled=${!code.trim() || busy} className="flex-1 rounded-full bg-ink text-paper px-4 py-2.5 text-[13.5px] font-semibold hover:bg-ink/90 active:scale-95 transition disabled:opacity-40">${busy ? 'Joining…' : 'Join trip'}</button>

    <div className="space-y-4">
      <p className="text-[12.5px] text-muted leading-relaxed">Ask the trip owner for their share code, paste it below, and this device joins the same record — expenses and settlements flow live, both ways.</p>

/* ---------------- splid chat ui ---------------- */

function ChatIdCopy({ id, big }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(id).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = id; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
  };
  return html`<button onClick=${copy} aria-label="Copy Splid ID" title="Copy your ID"
    className="shrink-0 inline-flex items-center gap-2 bg-paper border border-line rounded-full pl-3.5 pr-1.5 py-1.5 hover:border-muted transition active:scale-95">
    <code className=${'font-mono font-bold tracking-[.12em] numtab ' + (big ? 'text-[15px]' : 'text-[12.5px]')}>${chunkCode(id)}</code>
    <span className=${'w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition ' + (copied ? 'bg-sage text-paper' : 'bg-ink text-paper')}>
      <${Icon} name=${copied ? 'check' : 'copy'} size=${12} sw=${2.4}/>
    </span>
  </button>`;
}

const SIGNIN_ERRS = {
  notfound: 'We couldn’t find that ID on the chat network right now. Check the spelling — if the ID was created on another device, the network may be slow to sync, so try again in a moment.',
  nopass: 'This ID was made before passwords existed, so it can’t be verified on a new device.',
  wrongpass: 'Wrong password for that ID — try again.',
  bad: 'Enter your ID (3–14 letters or numbers) and your password.',
  offline: 'Couldn’t reach the chat network — check your internet and try again.',
  try: 'Sign-in failed — check your connection and try again.',
};
const SIGNIN_STEPS = { lookup: 'Searching the network for your ID…', cloud: 'Checking the cloud snapshot…', live: 'Asking online devices for your ID…', verify: 'Checking your password…', restore: 'Restoring your friends & chats…' };

/* circular profile-picture picker: tap → file input → compressed JPEG preview */
function PicPicker({ pic, color, initial, onPic, size = 72 }) {
  const fileRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const pick = async e => {
    const f = e.target && e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    setBusy(true);
    const url = await fileToPic(f);
    setBusy(false);
    if (url) onPic(url);
  };
  return html`<button type="button" onClick=${() => fileRef.current && fileRef.current.click()} aria-label="Choose profile picture"
    title="Upload a profile picture"
    className="relative rounded-full shrink-0 transition active:scale-95 group" style=${{ width:size, height:size }}>
    ${pic
      ? html`<img src=${pic} alt="Profile picture" draggable=${false} className="w-full h-full rounded-full object-cover bg-paper"
          style=${{ boxShadow:'0 0 0 2px rgb(var(--c-card)), 0 10px 28px -12px rgba(38,34,27,.4)' }}/>`
      : html`<span className="w-full h-full rounded-full flex items-center justify-center font-semibold text-[#FCF9F3] select-none"
          style=${{ background:color, fontSize:Math.round(size * .4), boxShadow:'0 0 0 2px rgb(var(--c-card)), 0 10px 28px -12px rgba(38,34,27,.4)' }}>${(initial || '?').toUpperCase()}</span>`}
    <span className=${'absolute -bottom-0.5 -right-0.5 w-7 h-7 rounded-full bg-ink text-paper border-2 border-card flex items-center justify-center transition ' + (busy ? 'opacity-60' : 'group-hover:bg-ink/90')}>
      <${Icon} name="camera" size=${13} sw=${2.2}/>
    </span>
    <input ref=${fileRef} type="file" accept="image/*" className="hidden" onChange=${pick}/>
  </button>`;
}

function ChatOnboard({ onCreate, onSignIn }) {
  const [tab, setTab] = useState('create');
  const [name, setName] = useState('');
  const [idv, setIdv] = useState(newChatId());
  const [color, setColor] = useState(AV[Math.floor(Math.random() * AV.length)]);
  const [pic, setPic] = useState('');
  const [pass, setPass] = useState('');
  const [pass2, setPass2] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [inId, setInId] = useState('');
  const [inPass, setInPass] = useState('');
  const [chk, setChk] = useState('idle');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const [busyStep, setBusyStep] = useState(null);
  /* IDs this device already knows — one tap prefills the sign-in form */
  const [known] = useState(() => Object.values(vaultAll()).filter(e => e && e.id && e.salt && e.hash).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0)).slice(0, 4));

  const targetId = normId(idv);        /* exactly what you type — any length from 3 to 14, no padding */
  const idOk = targetId.length >= 3 && targetId.length <= 14;
  const passOk = pass.length >= 4;
  const passMatch = pass === pass2;

  useEffect(() => {
    if (tab !== 'create' || !idOk) { setChk('idle'); return; }
    let live = true;
    setChk('checking');
    const t = setTimeout(async () => {
      const v0 = vaultGet(targetId);       /* the device remembers — no network needed to know it's taken */
      if (v0 && v0.salt && v0.hash) { if (live) setChk('yours'); return; }
      const p = await fetchChatProfile(targetId);
      if (live) setChk(p ? 'taken' : 'free');
    }, 600);
    return () => { live = false; clearTimeout(t); };
  }, [targetId, tab]);

  const canCreate = name.trim().length >= 1 && idOk && chk !== 'checking' && chk !== 'taken' && chk !== 'yours' && passOk && passMatch && !busy;

  const create = async () => {
    if (!canCreate) return;
    setBusy(true); setErr(null);
    const res = await onCreate({ name, id: targetId, color, pic, password: pass });
    if (res && res.taken) setChk('taken');
    if (res && res.takenLocal) {   /* this device already holds that ID — send them to sign in instead */
      setTab('signin'); setInId(targetId); setPass(''); setPass2('');
      setErr('You already made ' + chunkCode(targetId) + ' on this device — type its password to sign in.');
    }
    setBusy(false);
  };

  const cleanIn = normId(inId);
  const knownMatch = cleanIn ? vaultGet(cleanIn) : null;
  const canSign = cleanIn.length >= 3 && inPass.length >= 1 && !busy;
  const signIn = async () => {
    if (!canSign) return;
    setBusy(true); setErr(null); setBusyStep(null);
    try { await onSignIn({ id: cleanIn, password: inPass, onStep: setBusyStep }); }
    catch (e) { setErr(SIGNIN_ERRS[e] || SIGNIN_ERRS.try); }
    setBusyStep(null); setBusy(false);
  };

  const pickKnown = k => {
    setInId(k.id); setErr(null);
    const el = document.getElementById('signin-pass');
    if (el) el.focus();
  };

  const passField = (val, set, ph, ac, onEnter, inpId) => html`<div className="relative">
    <input type=${showPass ? 'text' : 'password'} className="inp pr-11" placeholder=${ph} autoComplete=${ac} id=${inpId}
      maxLength=${40} value=${val} onChange=${e => { set(e.target.value); setErr(null); }}
      onKeyDown=${e => { if (e.key === 'Enter' && onEnter) onEnter(); }}/>
    <button type="button" onClick=${() => setShowPass(s => !s)} aria-label=${showPass ? 'Hide password' : 'Show password'}
      className="absolute right-1.5 top-1/2 -translate-y-1/2 w-8 h-8 rounded-full flex items-center justify-center text-muted hover:text-ink transition">
      <${Icon} name=${showPass ? 'eyeOff' : 'eye'} size=${15}/>
    </button>
  </div>`;

  return html`<div className="flex-1 overflow-y-auto flex items-start sm:items-center justify-center p-4">
    <div className="sheet-in w-full max-w-md bg-card border border-line rounded-3xl shadow-pop p-5 sm:p-6 my-4">
      <div className="flex flex-col items-center text-center">
        ${tab === 'create'
          ? html`<${PicPicker} pic=${pic} color=${color} initial=${name.trim()[0]} onPic=${setPic} size=${72}/>`
          : html`<span className="w-12 h-12 rounded-2xl bg-ink text-paper flex items-center justify-center shadow-soft"><${Icon} name="chat" size=${22}/></span>`}
        <h2 className="font-display text-[22px] font-semibold mt-3 leading-tight">${tab === 'create' ? 'Make your Splid ID' : 'Welcome back'}</h2>
        <p className="text-[13px] text-muted mt-1.5 leading-relaxed max-w-[330px]">${tab === 'create'
          ? 'One ID, all your chats. Add friends with their ID, they accept, and you talk — no phone number needed.'
          : 'Verify your ID + password and your friends, requests and conversations come right back on this device.'}</p>
      </div>

      ${tab === 'create' ? html`
      <div className="mt-5">
        <label className="lbl">Your name</label>
        <input className="inp" placeholder="What should friends call you?" maxLength=${24} value=${name}
          onChange=${e => setName(e.target.value)}/>
      </div>

      <div className="mt-4">
        <label className="lbl">Your ID</label>
        <div className="flex gap-2">
          <input className="inp font-mono font-bold tracking-[.14em] uppercase text-[16px] select-all" placeholder="PICK-ANY-ID" spellCheck=${false}
            maxLength=${14} value=${idv} onChange=${e => setIdv(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''))}/>
          <button onClick=${() => setIdv(idFromName(name))} title="Randomize an ID from your name" aria-label="Randomize an ID from your name"
            className="shrink-0 w-11 rounded-xl bg-paper border border-line text-muted hover:text-ink hover:border-muted flex items-center justify-center transition active:scale-95">
            <${Icon} name="dice" size=${17}/>
          </button>
        </div>
        <div className="mt-2 text-[12px] font-semibold flex items-center gap-1.5 min-h-[18px]">
          ${chk === 'checking' && html`<span className="w-1.5 h-1.5 rounded-full bg-sage live-dot"></span><span className="text-muted">Checking ${chunkCode(targetId)}…</span>`}
          ${chk === 'free' && idOk && html`<span className="w-1.5 h-1.5 rounded-full bg-sage"></span><span className="text-sage-deep">${chunkCode(targetId)} is free — grab it!</span>`}
          ${chk === 'taken' && html`<span className="w-1.5 h-1.5 rounded-full bg-rust"></span><span className="text-rust-deep">${chunkCode(targetId)} is already taken — try another</span>`}
          ${chk === 'yours' && html`<span className="w-1.5 h-1.5 rounded-full bg-sage"></span><span className="text-sage-deep">That one’s yours — it’s saved on this device.</span>
            <button onClick=${() => { setTab('signin'); setInId(targetId); setErr(null); }} className="underline underline-offset-2 text-ink hover:text-ink/80 transition">Sign in instead</button>`}
          ${chk === 'idle' && html`<span className="text-muted">3–14 letters or numbers — short or long, your call · the dice builds one from your name</span>`}
        </div>
      </div>

      <div className="mt-4">
        <label className="lbl">Your color</label>
        <div className="flex flex-wrap gap-2">
          ${AV.map(c => html`<button key=${c} onClick=${() => setColor(c)} aria-label=${'Color ' + c}
            className=${'w-8 h-8 rounded-full transition active:scale-90 ' + (color === c ? 'ring-2 ring-offset-2 ring-ink ring-offset-card' : 'hover:scale-110')}
            style=${{ background: c }}></button>`)}
        </div>
      </div>

      <div className="mt-4">
        <label className="lbl"><span className="inline-flex items-center gap-1.5"><${Icon} name="lock" size=${12} sw=${2.4}/>Password</span></label>
        ${passField(pass, setPass, 'At least 4 characters — needed on every new device', 'new-password', null)}
        <div className="mt-2">${passField(pass2, setPass2, 'Repeat the password', 'new-password', create)}</div>
        ${pass2 && !passMatch && html`<div className="mt-2 text-[12px] font-semibold text-rust-deep">Passwords don’t match yet</div>`}
      </div>

      <button onClick=${create} disabled=${!canCreate}
        className=${'mt-6 w-full rounded-full py-3 text-[14px] font-semibold transition active:scale-[.98] ' +
          (canCreate ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        ${busy ? 'Creating your ID…' : 'Create my ID'}
      </button>
      <p className="text-[11px] text-muted mt-3 text-center leading-relaxed">Your ID is 3–14 letters or numbers — short or long, exactly as you type it — and public, so friends can find you. Your password is the key: it unlocks this account on any device, with friends & chats intact.</p>
      <button onClick=${() => { setTab('signin'); setErr(null); }} className="mt-2 w-full text-center text-[12.5px] font-semibold text-muted hover:text-ink transition py-1">
        Already have an ID? <span className="text-ink underline underline-offset-2">Sign in</span>
      </button>`
      : html`
      <div className="mt-5">
        <label className="lbl">Your Splid ID</label>
        <input className="inp font-mono font-bold tracking-[.14em] uppercase text-[16px]" placeholder="YOUR-ID" spellCheck=${false}
          maxLength=${14} value=${inId} onChange=${e => { setInId(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '')); setErr(null); }}/>
        ${cleanIn && html`<p className="text-[11.5px] text-muted mt-1.5 numtab">Signing in as ${chunkCode(cleanIn)}</p>`}
        ${knownMatch && knownMatch.salt && html`<p className="mt-2 text-[11.5px] font-semibold text-sage-deep flex items-center gap-1.5">
          <${Icon} name="check" size=${12} sw=${2.6}/>Saved on this device — sign-in is instant, even offline</p>`}
      </div>
      <div className="mt-4">
        <label className="lbl"><span className="inline-flex items-center gap-1.5"><${Icon} name="lock" size=${12} sw=${2.4}/>Password</span></label>
        ${passField(inPass, setInPass, 'Your password', 'current-password', signIn, 'signin-pass')}
      </div>
      ${!inId && known.length > 0 && html`<div className="mt-4">
        <div className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted mb-2">On this device</div>
        <div className="flex flex-wrap gap-2">
          ${known.map(k => html`<button key=${k.id} type="button" onClick=${() => pickKnown(k)}
            title=${'Sign in as ' + (k.name || k.id)}
            className="flex items-center gap-2 rounded-full bg-paper border border-line pl-1 pr-3 py-1 hover:border-muted transition active:scale-95">
            <span className="w-7 h-7 rounded-full text-[#FCF9F3] text-[12px] font-semibold flex items-center justify-center shrink-0" style=${{ background: k.color || '#26221B' }}>${(k.name || k.id)[0].toUpperCase()}</span>
            <span className="text-left leading-tight">
              <span className="block text-[12px] font-semibold text-ink max-w-[110px] truncate">${k.name || k.id}</span>
              <span className="block text-[10px] font-mono font-bold tracking-[.1em] text-muted numtab">${chunkCode(k.id)}</span>
            </span>
          </button>`)}
        </div>
      </div>`}
      ${err && html`<div className="mt-4 rounded-2xl px-3.5 py-2.5 text-[12.5px] font-semibold leading-relaxed bg-rust-tint text-rust-deep border border-rust/25">${err}</div>`}
      <button onClick=${signIn} disabled=${!canSign}
        className=${'mt-6 w-full rounded-full py-3 text-[14px] font-semibold transition active:scale-[.98] ' +
          (canSign ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        ${busy ? (SIGNIN_STEPS[busyStep] || 'Verifying…') : (knownMatch && knownMatch.salt ? 'Verify & sign in — it’s instant' : 'Verify & sign in')}
      </button>
      <p className="text-[11px] text-muted mt-3 text-center leading-relaxed">Saved IDs are verified right on this device — instantly, even offline. A new device verifies over the live network, then picks up right where you left off.</p>
      <button onClick=${() => { setTab('create'); setErr(null); }} className="mt-2 w-full text-center text-[12.5px] font-semibold text-muted hover:text-ink transition py-1">
        New here? <span className="text-ink underline underline-offset-2">Create an ID</span>
      </button>`}
    </div>
  </div>`;
}

              <span className="text-muted numtab text-[12px] ml-1.5">${chunkCode(r.to.id)}</span>
            </div>
            <span className="inline-flex items-center gap-1.5 text-[10.5px] font-bold tracking-[.12em] uppercase text-muted border border-line rounded-full px-2 py-1 shrink-0"><span className="w-1.5 h-1.5 rounded-full bg-muted live-dot"></span>Pending</span>
            <button onClick=${() => api.cancelReq(r.reqId)} aria-label="Cancel request" className="p-1.5 rounded-full text-muted hover:text-rust hover:bg-rust-tint transition shrink-0"><${Icon} name="x" size=${14}/></button>
          </div>`)}
        </div>
      </div>`}

      <div className="mt-6">
        <div className="flex items-center gap-3 mb-2.5">
          <span className="text-[11px] font-bold tracking-[.18em] uppercase text-muted">Friends · ${rows.length}</span>
          <span className="h-px flex-1 bg-line"></span>
        </div>
        ${rows.length === 0 ? html`<div className="bg-card border border-line rounded-3xl px-4 py-8 flex flex-col items-center text-center gap-2">
          <span className="w-11 h-11 rounded-full bg-paper border border-line flex items-center justify-center text-muted"><${Icon} name="users" size=${19}/></span>
          <div className="text-[14px] font-semibold">No friends yet</div>
          <div className="text-[12.5px] text-muted max-w-[260px] leading-relaxed">Add your first friend with their Splid ID — once they accept, your chat opens up.</div>
        </div>`
        : html`<div className="bg-card border border-line rounded-3xl shadow-soft overflow-hidden divide-y divide-line">
          ${rows.map(({ f, last, unread }) => html`<button key=${f.id} onClick=${() => onOpenThread(f.id)}
            className="w-full flex items-center gap-3 px-4 py-3 hover:bg-paper/70 transition text-left">
            <span className="relative shrink-0">
              <${Avatar} m=${f} size=${40}/>
              <span className=${'absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-card ' + (api.presence[f.id] ? 'bg-sage' : 'bg-muted/40')}></span>
            </span>
            <span className="flex-1 min-w-0">
              <span className="block text-[14px] font-semibold truncate">${f.name}</span>
              <span className=${'block text-[12.5px] truncate ' + (unread > 0 ? 'text-ink font-semibold' : 'text-muted')}>
                ${(api.typing[f.id] || 0) > Date.now() ? 'typing…' : last ? (last.kind === 'file' ? (last.mine ? 'You sent a file' : 'Sent a file') + ' · ' + (last.name || '') : (last.mine ? 'You: ' : '') + last.text) : 'Say hi — no messages yet'}
              </span>
            </span>
            <span className="shrink-0 flex flex-col items-end gap-1">
              <span className="text-[11px] text-muted numtab">${last ? when(last.ts) : ''}</span>
              ${unread > 0 && html`<span className="min-w-[18px] h-[18px] px-1.5 rounded-full bg-rust text-paper text-[10px] font-bold flex items-center justify-center numtab">${unread > 9 ? '9+' : unread}</span>`}
            </span>
          </button>`)}
        </div>`}
      </div>

    </div>
  </div>`;
}

const ADDFRIEND_ERRS = {
  self: 'That’s your own ID — share it with a friend instead!',
  already: 'You two are already friends — start chatting!',
  pending: 'Request already sent — waiting for them to accept.',
  incoming: 'They already sent you a request — accept it from your requests list.',
  notfound: 'No Splid ID found for that code — double-check it, or ask them to open Splid Chat once.',
  offline: 'Couldn’t reach the chat network — check your internet and try again.',
  bad: 'Enter an ID of 3–14 letters or numbers.',
};

function AddFriendSheet({ onClose, onSend }) {
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const clean = normId(val);
  const submit = async () => {
    if (busy) return;
    if (!clean) { setMsg({ kind: 'err', text: ADDFRIEND_ERRS.bad }); return; }
    setBusy(true); setMsg(null);
    try {
      const p = await onSend(clean);
      setMsg({ kind: 'ok', text: 'Request sent to ' + (p && p.name ? p.name : chunkCode(clean)) + ' — you’ll see them here once they accept.' });
      setVal('');
    } catch (e) { setMsg({ kind: 'err', text: ADDFRIEND_ERRS[e] || ADDFRIEND_ERRS.offline }); }
    setBusy(false);
  };
  return html`<${Sheet} title="Add a friend" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Close</button>
      <button onClick=${submit} disabled=${busy || !clean} className=${'flex-1 rounded-full px-4 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' + (!clean || busy ? 'bg-ink/20 text-paper cursor-not-allowed' : 'bg-ink text-paper hover:bg-ink/90')}>${busy ? 'Sending…' : 'Send request'}</button>
    </div>`}>
    <div className="space-y-4">
      <p className="text-[12.5px] text-muted leading-relaxed">Ask a friend for their Splid ID (they’ll find it inside Splid Chat). Paste it below — once they accept your request, you two can talk.</p>
      <div>
        <label className="lbl">Friend’s Splid ID</label>
        <input className="inp font-mono tracking-[.16em] uppercase text-[15px]" placeholder="THEIR-ID" spellCheck=${false} maxLength=${14}
          value=${val} onChange=${e => { setVal(e.target.value); setMsg(null); }}
          onKeyDown=${e => { if (e.key === 'Enter') submit(); }}/>
        ${clean && val !== clean && html`<p className="text-[11.5px] text-muted mt-1.5 numtab">Will send to ${chunkCode(clean)}</p>`}
      </div>
      ${msg && html`<div className=${'rounded-2xl px-3.5 py-2.5 text-[12.5px] font-semibold leading-relaxed ' + (msg.kind === 'ok' ? 'bg-sage-tint text-sage-deep border border-sage/25' : 'bg-rust-tint text-rust-deep border border-rust/25')}>${msg.text}</div>`}
    </div>
  <//>`;
}

function ProfileSheet({ me, onClose, onSave, onLogout, onDelete }) {
  const [name, setName] = useState(me.name);
  const [color, setColor] = useState(me.color);
  const [pic, setPic] = useState(me.pic || '');
  const [busy, setBusy] = useState(false);
  const [confirmOut, setConfirmOut] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);

  useEffect(() => {
    if (!confirmOut && !confirmDel) return;
    const t = setTimeout(() => { setConfirmOut(false); setConfirmDel(false); }, 2600);
    return () => clearTimeout(t);
  }, [confirmOut, confirmDel]);

  const save = async () => {
    if (busy || !name.trim()) return;
    setBusy(true);
    await onSave({ name, color, pic });
    setBusy(false);
  };

  return html`<${Sheet} title="Your profile" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${() => { if (confirmOut) onLogout(); else setConfirmOut(true); }} title="Log out on this device"
        className=${'rounded-full px-3.5 py-2.5 text-[12.5px] font-semibold border transition active:scale-95 ' +
          (confirmOut ? 'bg-rust text-paper border-rust' : 'border-line text-muted hover:text-rust hover:border-rust/40')}>
        <span className="inline-flex items-center gap-1.5"><${Icon} name="logout" size=${13} sw=${2.4}/>${confirmOut ? 'Tap again' : 'Log out'}</span>
      </button>
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <button onClick=${save} disabled=${busy || !name.trim()}
        className=${'flex-1 rounded-full px-4 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' + (busy || !name.trim() ? 'bg-ink/20 text-paper cursor-not-allowed' : 'bg-ink text-paper hover:bg-ink/90')}>${busy ? 'Saving…' : 'Save'}</button>
    </div>`}>
    <div className="space-y-4">
      <div className="flex justify-center pt-1">
        <${PicPicker} pic=${pic} color=${color} initial=${name.trim()[0]} onPic=${setPic} size=${80}/>
      </div>
      <div>
        <label className="lbl">Display name</label>
        <input className="inp" maxLength=${24} value=${name} onChange=${e => setName(e.target.value)}/>
      </div>
      <div>
        <label className="lbl">Your color</label>
        <div className="flex flex-wrap gap-2">
          ${AV.map(c => html`<button key=${c} onClick=${() => setColor(c)} aria-label=${'Color ' + c}
            className=${'w-8 h-8 rounded-full transition active:scale-90 ' + (color === c ? 'ring-2 ring-offset-2 ring-ink ring-offset-card' : 'hover:scale-110')}
            style=${{ background: c }}></button>`)}
        </div>
      </div>
      <div className="bg-paper border border-line rounded-2xl px-3.5 py-3 flex items-center gap-2.5">
        <span className="w-7 h-7 rounded-full bg-ink text-paper flex items-center justify-center shrink-0"><${Icon} name="lock" size=${13} sw=${2.4}/></span>
        <p className="text-[11.5px] text-muted leading-relaxed">Signed in as <span className="font-bold text-ink numtab">${chunkCode(me.id)}</span>. Changes reach your friends instantly. Logging out keeps your account in the cloud — sign back in anywhere with your ID + password.</p>
      </div>

      <div className="bg-rust-tint/60 border border-rust/25 rounded-2xl px-3.5 py-3">
        <div className="flex items-start gap-2.5">
          <span className="w-7 h-7 rounded-full bg-rust text-paper flex items-center justify-center shrink-0"><${Icon} name="trash" size=${13} sw=${2.4}/></span>
          <div className="flex-1 min-w-0">
            <div className="text-[12.5px] font-bold text-rust-deep">Delete account</div>
            <p className="text-[11.5px] text-muted leading-relaxed mt-0.5">Erases your ID for good, removes you from every friend’s list and wipes your cloud data. This cannot be undone.</p>
          </div>
        </div>
        <button onClick=${() => { if (confirmDel) onDelete(); else setConfirmDel(true); }}
          className=${'mt-2.5 w-full rounded-full py-2 text-[12.5px] font-bold transition active:scale-[.98] ' + (confirmDel ? 'bg-rust text-paper' : 'border border-rust/40 text-rust-deep hover:bg-rust hover:text-paper')}>
          ${confirmDel ? 'Tap again — delete forever' : 'Delete my account'}
        </button>
      </div>
    </div>
  <//>`;
}

const FILE_META = {
  image: { tint: 'bg-sage-tint text-sage-deep', label: 'Photo' },
  video: { tint: 'bg-[#F3E8FF] text-[#8B5CF6]', label: 'Video' },
  audio: { tint: 'bg-[#E3EDFE] text-[#2563C9]', label: 'Audio' },
  pdf:   { tint: 'bg-rust-tint text-rust-deep', label: 'PDF' },
  zip:   { tint: 'bg-[#FCEFD4] text-[#B45309]', label: 'Archive' },
  doc:   { tint: 'bg-[#E3EDFE] text-[#2563C9]', label: 'Document' },
  file:  { tint: 'bg-paper text-muted', label: 'File' },
};
const XFER_ERR = {
  offline: 'You are offline — tap to retry',
  wake: 'Couldn’t reach them — tap to retry',
  drop: 'Transfer interrupted — tap to retry',
  save: 'Couldn’t save the file — tap to retry',
  rtc: 'Connection failed — tap to retry',
};

function FileBubble({ m, peerId, api }) {
  const x = (api.xfers || {})[m.id] || {};
  const kind = fileKindOf(m.mime, m.name);
  const meta = FILE_META[kind] || FILE_META.file;
  const isImg = kind === 'image';
  const [have, setHave] = useState(false);
  const [url, setUrl] = useState('');
  const done = !m.mine && (x.status === 'done' || have);
  const showImg = isImg && (m.mine || done);

  useEffect(() => {
    if (m.mine) return;
    let dead = false;
    api.loadFile(m.id).then(b => { if (!dead && b) setHave(true); });
    return () => { dead = true; };
  }, [m.id, m.mine]);

  useEffect(() => {
    if (!showImg) return;
    let dead = false, created = '';
    const f = m.mine ? api.peekOutFile(m.id) : null;
    const use = b => { if (b && b.size <= 31457280) { created = URL.createObjectURL(b); if (!dead) setUrl(created); else URL.revokeObjectURL(created); } };
    if (f) use(f);
    else api.loadFile(m.id).then(use);
    return () => { dead = true; if (created) URL.revokeObjectURL(created); };
  }, [showImg, m.id, m.mine]);

  const grab = () => {
    if (done || x.status === 'wait' || x.status === 'run') return;
    api.startDownload(peerId, m.id);
  };
  const saveBlob = async () => {
    const b = await api.loadFile(m.id);
    if (!b) return;
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = m.name || 'file';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 60000);
  };
  const viewBlob = async () => {
    const b = m.mine ? (api.peekOutFile(m.id) || null) : await api.loadFile(m.id);
    if (b) window.open(URL.createObjectURL(b), '_blank');
  };

  const pct = Math.max(0, Math.min(100, Math.round((x.pct || 0) * 100)));
  return html`<div className=${'px-3 py-2.5 ' + (m.mine ? 'bg-ink text-paper rounded-2xl rounded-br-md' : 'bg-card border border-line text-ink rounded-2xl rounded-bl-md')}>
    ${showImg && url && html`<button onClick=${viewBlob} className="block mb-2" aria-label="View photo">
      <img src=${url} alt=${m.name || 'photo'} className="max-h-56 w-auto rounded-xl ${m.mine ? 'border border-paper/20' : 'border border-line'}"/>
    </button>`}
    <div className="flex items-center gap-2.5 min-w-[190px] max-w-full">
      ${(!showImg || !url) && html`<span className=${'w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ' + (m.mine ? 'bg-paper/10 text-paper/85' : meta.tint)}>
        <${Icon} name=${isImg ? 'camera' : 'doc'} size=${16}/>
      </span>`}
      <span className="flex-1 min-w-0">
        <span className="block text-[13.5px] font-semibold truncate">${m.name || 'file'}</span>
        <span className=${'block text-[11px] numtab ' + (m.mine ? 'text-paper/55' : 'text-muted')}>${prettyBytes(m.size)} · ${meta.label}</span>
      </span>
    </div>
    ${m.mine && html`<div className=${'mt-1.5 text-[10.5px] font-bold numtab ' + (x.status === 'ack' ? 'text-[#3DDC5C]' : 'text-paper/50')}>
      ${x.status === 'run' ? 'Sending · ' + pct + '%'
        : x.status === 'sent' ? 'Sent — waiting for them to download'
        : x.status === 'ack' ? 'Delivered'
        : x.status === 'err' ? 'Interrupted'
        : 'Sent'}
    </div>`}
    ${m.mine && x.status === 'run' && html`<div className="mt-1 h-1 rounded-full bg-paper/20 overflow-hidden">
      <div className="h-full bg-[#3DDC5C] rounded-full transition-all duration-300" style=${{ width: Math.max(3, pct) + '%' }}></div>
    </div>`}
    ${!m.mine && (x.status === 'run' || x.status === 'wait') && html`<div className="mt-2">
      ${x.status === 'run' && html`<div className="h-1.5 rounded-full bg-paper border border-line overflow-hidden">
        <div className="h-full bg-sage rounded-full transition-all duration-300" style=${{ width: Math.max(3, pct) + '%' }}></div>
      </div>`}
      <div className=${'mt-1 text-[10.5px] font-bold numtab flex items-center gap-1.5 ' + (x.status === 'run' ? 'text-sage-deep' : 'text-muted')}>
        <span className=${'w-1.5 h-1.5 rounded-full ' + (x.status === 'run' ? 'bg-sage live-dot' : 'bg-muted live-dot')}></span>
        ${x.status === 'run' ? 'Receiving · ' + pct + '%' : 'Connecting…'}
      </div>
    </div>`}
    ${!m.mine && x.status === 'gone' && html`<div className="mt-1.5 text-[11px] font-semibold text-muted">No longer available on their device</div>`}
    ${!m.mine && x.status === 'err' && html`<button onClick=${grab} className="mt-1.5 text-[11px] font-bold text-rust hover:underline text-left">${XFER_ERR[x.err] || 'Tap to retry'}</button>`}
    ${!m.mine && done && html`<div className="mt-2 flex items-center gap-2">
      <button onClick=${saveBlob} className="inline-flex items-center gap-1.5 rounded-full bg-sage text-paper text-[11.5px] font-bold px-3 py-1.5 hover:bg-sage-deep active:scale-95 transition">
        <${Icon} name="download" size=${12} sw=${2.4}/>Save
      </button>
      ${!isImg && html`<button onClick=${viewBlob} className="rounded-full border border-line text-muted text-[11.5px] font-bold px-3 py-1.5 hover:text-ink hover:border-muted transition">Open</button>`}
    </div>`}
    ${!m.mine && !x.status && !done && html`<button onClick=${grab} className="mt-2 inline-flex items-center gap-1.5 rounded-full bg-ink text-paper text-[11.5px] font-bold px-3 py-1.5 hover:bg-ink/90 active:scale-95 transition">
      <${Icon} name="download" size=${12} sw=${2.4}/>Download
    </button>`}
  </div>`;
}

function ChatThread({ peer, chat, api, onBack }) {
  const msgs = (chat.threads || {})[peer.id] || [];
  const seen = (chat.seenUpto || {})[peer.id] || 0;
  const typingNow = (api.typing[peer.id] || 0) > Date.now();
  const [text, setText] = useState('');
  const [confirmDel, setConfirmDel] = useState(false);
  const scRef = useRef(null);
  const inputRef = useRef(null);
  const fileRef = useRef(null);

  useEffect(() => { const el = scRef.current; if (el) el.scrollTop = el.scrollHeight; }, [msgs.length, typingNow]);
  useEffect(() => { api.markRead(peer.id); if (inputRef.current && window.innerWidth > 640) inputRef.current.focus(); }, [peer.id]);
  useEffect(() => {
    if (!confirmDel) return;
    const t = setTimeout(() => setConfirmDel(false), 2600);
    return () => clearTimeout(t);
  }, [confirmDel]);

  const send = () => {
    const t = text.trim(); if (!t) return;
    setText('');
    api.sendMsg(peer.id, t);
    if (inputRef.current) inputRef.current.focus();
  };

  const onPickFile = e => {
    const f = e.target.files && e.target.files[0];
    try { e.target.value = ''; } catch (err) {}
    if (f) api.attachFile(peer.id, f);
  };

  const groups = [];
  msgs.forEach(m => {
    const lab = dayLabel(m.ts);
    let g = groups[groups.length - 1];
    if (!g || g.label !== lab) { g = { label: lab, items: [] }; groups.push(g); }
    g.items.push(m);
  });

  return html`<div className="flex-1 flex flex-col min-h-0">
    <div className="shrink-0 border-b border-line bg-paper/90 backdrop-blur-md">
      <div className="max-w-3xl mx-auto px-3 sm:px-6 h-[60px] flex items-center gap-2.5">
        <button onClick=${onBack} aria-label="Back to chats" className="p-2 -ml-1 rounded-full text-muted hover:bg-card hover:text-ink transition"><${Icon} name="left" size=${18}/></button>
        <span className="relative shrink-0">
          <${Avatar} m=${peer} size=${34}/>
          <span className=${'absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-paper ' + (api.presence[peer.id] ? 'bg-sage' : 'bg-muted/40')}></span>
        </span>
        <div className="flex-1 min-w-0">
          <div className="text-[14.5px] font-semibold truncate leading-tight">${peer.name}</div>
          <div className=${'text-[11.5px] font-semibold truncate numtab ' + (typingNow || api.presence[peer.id] ? 'text-sage-deep' : 'text-muted')}>
            ${typingNow ? 'typing…' : api.presence[peer.id] ? 'online' : chunkCode(peer.id)}
          </div>
        </div>
        <button onClick=${() => { if (confirmDel) { api.unfriend(peer.id); onBack(); } else setConfirmDel(true); }} aria-label="Remove friend"
          title=${confirmDel ? 'Tap again to remove' : 'Remove friend'}
          className=${'p-2 rounded-full transition shrink-0 ' + (confirmDel ? 'bg-rust text-paper' : 'text-muted hover:text-rust hover:bg-rust-tint')}>
          <${Icon} name="trash" size=${15}/>
        </button>
      </div>
    </div>

    <div ref=${scRef} className="flex-1 overflow-y-auto px-3 sm:px-6 py-4">
      <div className="max-w-3xl mx-auto">
        ${msgs.length === 0 && html`<div className="flex flex-col items-center justify-center text-center gap-2 pt-16">
          <span className="w-11 h-11 rounded-full bg-card border border-line flex items-center justify-center text-muted"><${Icon} name="sparkle" size=${19}/></span>
          <div className="text-[14px] font-semibold">You two are friends now</div>
          <div className="text-[12.5px] text-muted">Send the first message — say hi!</div>
        </div>`}
        ${groups.map(g => html`<div key=${g.label}>
          <div className="flex justify-center my-3.5"><span className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted bg-card border border-line rounded-full px-3 py-1">${g.label}</span></div>
          ${g.items.map(m => html`<div key=${m.id} className="msg-in flex mb-1.5 ${m.mine ? 'justify-end' : 'justify-start'}">
            <div className=${'max-w-[86%] sm:max-w-[72%] ' + (m.kind === 'file' ? '' : 'px-3.5 py-2 ' + (m.mine ? 'bg-ink text-paper rounded-2xl rounded-br-md' : 'bg-card border border-line text-ink rounded-2xl rounded-bl-md'))}>
              ${m.kind === 'file'
                ? html`<${FileBubble} m=${m} peerId=${peer.id} api=${api}/>`
                : html`<div className="text-[14px] leading-snug break-words whitespace-pre-wrap">${m.text}</div>`}
              <div className=${'mt-0.5 flex items-center justify-end gap-1 text-[10px] numtab ' + (m.mine && m.kind !== 'file' ? 'text-paper/45' : 'text-muted')}>
                <span>${timeLabel(m.ts)}</span>
                ${m.mine && html`<span className="ml-0.5 inline-flex">${seen >= m.ts
                  ? html`<${Icon} name="checkCheck" size=${13} sw=${2.4} className="text-[#3DDC5C]"/>`
                  : html`<${Icon} name="check" size=${11} sw=${2.8} className="opacity-70"/>`}</span>`}
              </div>
            </div>
          </div>`)}
        </div>`)}
        ${typingNow && html`<div className="msg-in flex mb-1.5 justify-start">
          <div className="bg-card border border-line rounded-2xl rounded-bl-md px-3.5 py-2.5 flex items-center gap-1 text-muted">
            <span className="typ-dot"></span><span className="typ-dot"></span><span className="typ-dot"></span>
          </div>
        </div>`}
      </div>
    </div>

    <div className="shrink-0 border-t border-line bg-card/95 backdrop-blur-md">
      <div className="max-w-3xl mx-auto px-3 sm:px-6 py-3 flex items-center gap-2">
        <input ref=${fileRef} type="file" className="hidden" onChange=${onPickFile}/>
        <button onClick=${() => { if (fileRef.current) fileRef.current.click(); }} aria-label="Attach a file" title="Attach any file type · up to 200 MB"
          className="shrink-0 w-10 h-10 rounded-full bg-paper border border-line text-muted hover:text-ink hover:border-muted flex items-center justify-center transition active:scale-90">
          <${Icon} name="clip" size=${16}/>
        </button>
        <input ref=${inputRef} className="inp !rounded-full flex-1" placeholder="Message…" maxLength=${1000} value=${text}
