/* ---------------- app ---------------- */

function App() {
  const [db, setDb] = useState(() => {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) { const d = JSON.parse(raw); if (d && d.groups && d.groups.length) { if (!d.deviceId) d.deviceId = uid(); if (!d.chat) d.chat = freshChat(); return d; } }
    } catch (e) {}
    return freshDemoDb();
  });
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }, [db]);

  const group = db.groups[0];
  const [tab, setTab] = useState('balance');
  const [selected, setSelected] = useState(null);
  const [sheet, setSheet] = useState(null);
  const [toast, setToast] = useState(null);
  const toastTimer = useRef(null);
  const [tourOpen, setTourOpen] = useState(!db.tourDone);

  const showToast = (msg, icon) => {
    const key = Date.now();
    setToast({ key, msg, icon });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2400);
  };

  const byId = useMemo(() => Object.fromEntries(group.members.map(m => [m.id, m])), [group.members]);
  const { edges, net } = useMemo(() => computePairwise(group), [group]);
  const simplified = useMemo(() => simplify(net), [net]);
  const total = useMemo(() => group.expenses.reduce((s, e) => s + (+e.amount || 0), 0), [group.expenses]);

  /* live sync state */
  const pendingPush = useRef(false);
  const groupRef = useRef(group); groupRef.current = group;
  const deviceRef = useRef(db.deviceId); deviceRef.current = db.deviceId;
  const hashRef = useRef('');
  const clientRef = useRef(null);
  const subRef = useRef(null);
  const [liveOn, setLiveOn] = useState(false);
  useEffect(() => { hashRef.current = hashStr(JSON.stringify(group)); }, [group]);

  const ensureLive = () => {
    if (clientRef.current) return clientRef.current;
    const c = mqtt.connect(MQTT_URL, { clientId: 'splid-' + uid(), keepalive: 30, reconnectPeriod: 3000, connectTimeout: 8000 });
    c.on('connect', () => setLiveOn(true));
    c.on('close', () => setLiveOn(false));
    c.on('message', (t, payload) => {
      let d;
      try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!d || d.app !== 'splid') return;
      if (d.ended) {
        const g = groupRef.current;
        if (g.shareCode && g.shareCode.id === t) {
          patchGroup(x => { const { shareCode, ...rest } = x; return rest; });
          showToast('Owner stopped sharing this trip');
        }
        return;
      }
      if (t !== (groupRef.current.shareCode && groupRef.current.shareCode.id)) return;
      if (d.updatedBy === deviceRef.current) return;
      if (!d.group || !Array.isArray(d.group.members)) return;
      if (hashStr(JSON.stringify(d.group)) === hashRef.current) return;
      setDb(x => ({ ...x, groups: [d.group, ...x.groups.slice(1)] }));
      showToast('Trip updated live', 'sparkle');
    });
    clientRef.current = c;
    return c;
  };
  useEffect(() => () => { if (clientRef.current) { try { clientRef.current.end(true); } catch (e) {} } }, []);

  /* subscribe to the current trip's topic */
  useEffect(() => {
    const sc = group.shareCode;
    if (!sc) return;
    const c = ensureLive();
    if (subRef.current !== sc.id) {
      if (subRef.current) { try { c.unsubscribe(subRef.current); } catch (e) {} }
      try { c.subscribe(sc.id, { qos: 0 }); } catch (e) {}
      subRef.current = sc.id;
    }
  }, [group.shareCode]);

  const patchGroup = fn => setDb(d => ({ ...d, groups: d.groups.map((g, i) => i === 0 ? fn(g) : g) }));

  /* ---------------- splid chat engine ---------------- */

  const chat = db.chat || freshChat();
  const patchChat = fn => setDb(d => ({ ...d, chat: fn(d.chat || freshChat()) }));
  const chatUnread = Object.values((db.chat || {}).unread || {}).reduce((s, n) => s + (n || 0), 0);

  const [chatOpen, setChatOpen] = useState(false);
  const [chatView, setChatView] = useState('home');
  const [chatOn, setChatOn] = useState(false);
  const [presence, setPresence] = useState({});
  const [typing, setTyping] = useState({});
  const chatClientRef = useRef(null);
  const chatSubsRef = useRef(new Set());
  const chatRef = useRef(chat); chatRef.current = chat;
  const chatOpenRef = useRef(false); chatOpenRef.current = chatOpen;
  const chatThreadRef = useRef(null); chatThreadRef.current = chatView === 'home' ? null : chatView;
  const typSentRef = useRef({});

  const chatPublish = (topic, obj, retain) => {
    const c = chatClientRef.current; if (!c) return false;
    try { c.publish(topic, obj === null ? '' : JSON.stringify(obj), { qos: 0, retain: !!retain }); return true; } catch (e) { return false; }
  };
  const meCard = me => ({ id: me.id, name: me.name, color: me.color });

  const onChatMsg = (topic, payload) => {
    const me = chatRef.current.me; if (!me) return;
    const inboxRoot = cTopic('inbox', me.id, '');
    if (topic.indexOf(inboxRoot) === 0) {
      let d; try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (!d || d.app !== 'splidchat') return;
      if (d.type === 'friend-req' && d.from && d.from.id && d.from.id !== me.id && d.reqId) {
        chatPublish(topic, null, true);
        if (chatRef.current.reqsIn[d.reqId] || chatRef.current.friends[d.from.id]) {
          if (chatRef.current.friends[d.from.id]) chatPublish(cTopic('inbox', d.from.id, 'acc', d.reqId), { app:'splidchat', type:'friend-acc', reqId: d.reqId, from: meCard(me), ts: Date.now() }, true);
          return;
        }
        patchChat(c => {
          const ri = { ...(c.reqsIn || {}) };
          Object.keys(ri).forEach(k => { if (ri[k].from && ri[k].from.id === d.from.id) delete ri[k]; });
          ri[d.reqId] = { reqId: d.reqId, from: d.from, ts: d.ts || Date.now() };
          return { ...c, reqsIn: ri };
        });
        showToast((d.from.name || 'Someone') + ' sent you a friend request', 'users');
      } else if (d.type === 'friend-acc' && d.from && d.from.id && (!d.by || d.by === me.id)) {
        chatPublish(topic, null, true);
        const wasPending = !!chatRef.current.reqsOut[d.reqId];
        patchChat(c => {
          const ro = { ...(c.reqsOut || {}) }; delete ro[d.reqId];
          const fr = { ...(c.friends || {}) };
          if (!fr[d.from.id]) fr[d.from.id] = { id: d.from.id, name: d.from.name || d.from.id, color: d.from.color || AV[d.from.id.length % AV.length], since: Date.now() };
          return { ...c, reqsOut: ro, friends: fr };
        });
        if (wasPending) showToast((d.from.name || 'They') + ' accepted — you can chat now', 'check');
      } else if (d.type === 'friend-dec' && d.reqId) {
        chatPublish(topic, null, true);
        const out = chatRef.current.reqsOut[d.reqId];
        if (!out) return;
        patchChat(c => { const ro = { ...(c.reqsOut || {}) }; delete ro[d.reqId]; return { ...c, reqsOut: ro }; });
        showToast((out.to.name || 'They') + ' declined your request', 'x');
      } else if (d.type === 'chat-msg' && d.from && d.from.id && d.from.id !== me.id && typeof d.text === 'string') {
        chatPublish(topic, null, true);
        const fid = d.from.id;
        if (!chatRef.current.friends[fid]) return;
        if ((chatRef.current.threads || {})[fid] && chatRef.current.threads[fid].some(x => x.id === d.id)) return;
        const openNow = chatOpenRef.current && chatThreadRef.current === fid;
        patchChat(c => {
          const th = { ...(c.threads || {}) };
          th[fid] = [...(th[fid] || []), { id: d.id || uid(), mine: false, text: String(d.text).slice(0, 1000), ts: d.ts || Date.now() }].slice(-300);
          const un = { ...(c.unread || {}) };
          if (!openNow) un[fid] = (un[fid] || 0) + 1;
          const fr = { ...(c.friends || {}) };
          if (fr[fid] && d.from.name) fr[fid] = { ...fr[fid], name: d.from.name, color: d.from.color || fr[fid].color };
          return { ...c, threads: th, unread: un, friends: fr };
        });
        if (openNow) chatPublish(cTopic('inbox', fid, 'read'), { app:'splidchat', type:'read', by: me.id, upto: d.ts || Date.now() }, false);
        else showToast('New message from ' + firstName(d.from.name), 'chat');
      } else if (d.type === 'read' && d.by && chatRef.current.friends[d.by] && d.by !== me.id) {
        patchChat(c => ({ ...c, seenUpto: { ...(c.seenUpto || {}), [d.by]: Math.max((c.seenUpto || {})[d.by] || 0, d.upto || 0) } }));
      } else if (d.type === 'typ' && d.from && chatRef.current.friends[d.from] && d.from !== me.id) {
        setTyping(t => ({ ...t, [d.from]: Date.now() + 3200 }));
      }
      return;
    }
    if (topic === cTopic('profile', me.id)) {
      let d; try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (d && d.profile && d.profile.dev && me.dev && d.profile.dev !== me.dev) showToast('This ID is also active on another device', 'users');
      return;
    }
    let m = topic.match(/^splidchat\/v1\/presence\/([A-Z0-9]+)$/);
    if (m && chatRef.current.friends[m[1]]) {
      setPresence(p => ({ ...p, [m[1]]: payload.toString().length > 0 }));
      return;
    }
    m = topic.match(/^splidchat\/v1\/profile\/([A-Z0-9]+)$/);
    if (m && chatRef.current.friends[m[1]] && payload.toString()) {
      let d; try { d = JSON.parse(payload.toString()); } catch (e) { return; }
      if (d && d.profile && d.profile.id) patchChat(c => {
        const fr = { ...(c.friends || {}) }; const f = fr[d.profile.id]; if (!f) return c;
        fr[d.profile.id] = { ...f, name: d.profile.name || f.name, color: d.profile.color || f.color };
        return { ...c, friends: fr };
      });
    }
  };

  const connectChat = () => {
    if (chatClientRef.current || typeof mqtt === 'undefined') return;
    const me = chatRef.current.me; if (!me) return;
    let c;
    try {
      c = mqtt.connect(MQTT_URL, {
        clientId: 'splidchat-' + uid(), keepalive: 30, reconnectPeriod: 4000, connectTimeout: 8000, clean: true,
        will: { topic: cTopic('presence', me.id), payload: '', qos: 0, retain: true },
      });
    } catch (e) { return; }
    chatClientRef.current = c;
    c.on('connect', () => {
      setChatOn(true);
      const me2 = chatRef.current.me; if (!me2) return;
      chatSubsRef.current.add(cTopic('inbox', me2.id, '#'));
      chatSubsRef.current.add(cTopic('profile', me2.id));
      Object.keys(chatRef.current.friends || {}).forEach(f => { chatSubsRef.current.add(cTopic('presence', f)); chatSubsRef.current.add(cTopic('profile', f)); });
      chatSubsRef.current.forEach(t => { try { c.subscribe(t, { qos: 0 }); } catch (e) {} });
      chatPublish(cTopic('presence', me2.id), { app:'splidchat', on: 1, t: Date.now() }, true);
      chatPublish(cTopic('profile', me2.id), { app:'splidchat', type:'profile', profile: { id: me2.id, name: me2.name, color: me2.color, dev: me2.dev }, updatedAt: Date.now() }, true);
    });
    c.on('close', () => setChatOn(false));
    c.on('error', () => {});
    c.on('message', onChatMsg);
  };

  useEffect(() => { if (chat.me && !chatClientRef.current) connectChat(); }, [chat.me && chat.me.id]);

  const friendsSig = Object.keys(chat.friends || {}).sort().join(',');
  useEffect(() => {
    const c = chatClientRef.current; if (!c) return;
    friendsSig.split(',').filter(Boolean).forEach(f => {
      [cTopic('presence', f), cTopic('profile', f)].forEach(t => {
        if (!chatSubsRef.current.has(t)) { chatSubsRef.current.add(t); try { c.subscribe(t, { qos: 0 }); } catch (e) {} }
      });
    });
  }, [friendsSig, chatOn]);

  useEffect(() => {
    const iv = setInterval(() => setTyping(t => {
      const now = Date.now(); let ch = false; const o = {};
      Object.keys(t).forEach(k => { if (t[k] > now) o[k] = t[k]; else ch = true; });
      return ch ? o : t;
    }), 1200);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    const bye = () => {
      const me = chatRef.current.me; const c = chatClientRef.current;
      if (me && c) { try { c.publish(cTopic('presence', me.id), '', { qos: 0, retain: true }); } catch (e) {} try { c.end(true); } catch (e) {} }
    };
    window.addEventListener('beforeunload', bye);
    return () => { window.removeEventListener('beforeunload', bye); if (chatClientRef.current) { try { chatClientRef.current.end(true); } catch (e) {} } };
  }, []);

  /* ---- chat actions ---- */
  const createIdentity = async ({ name, id, color }) => {
    const clean = normId(id);
    if (!name.trim() || clean.length < 3) return { taken: false };
    const existing = await fetchChatProfile(clean);
    if (existing) return { taken: true };
    const me = { id: clean, name: name.trim().slice(0, 24), color: color || AV[hashStr(clean) % AV.length], dev: db.deviceId };
    patchChat(c => ({ ...(c || freshChat()), me }));
    showToast('ID created — share ' + chunkCode(clean) + ' with friends', 'sparkle');
    return { taken: false };
  };

  const sendFriendReq = async idRaw => {
    const me = chat.me; const clean = normId(idRaw);
    if (!me) throw 'offline';
    if (!clean || clean.length < 3) throw 'bad';
    if (clean === me.id) throw 'self';
    if (chat.friends[clean]) throw 'already';
    if (Object.values(chat.reqsOut || {}).some(r => r.to && r.to.id === clean)) throw 'pending';
    if (Object.values(chat.reqsIn || {}).some(r => r.from && r.from.id === clean)) throw 'incoming';
    const p = await fetchChatProfile(clean);
    if (!p || !p.id) throw 'notfound';
    const reqId = uid() + Date.now().toString(36);
    const ok = chatPublish(cTopic('inbox', clean, 'req', reqId), { app:'splidchat', type:'friend-req', reqId, from: meCard(me), ts: Date.now() }, true);
    if (!ok) throw 'offline';
    patchChat(c => ({ ...c, reqsOut: { ...(c.reqsOut || {}), [reqId]: { reqId, to: { id: p.id, name: p.name || p.id, color: p.color }, ts: Date.now() } } }));
    return p;
  };

  const acceptReq = reqId => {
    const r = (chat.reqsIn || {})[reqId]; if (!r || !r.from) return;
    patchChat(c => {
      const ri = { ...(c.reqsIn || {}) }; delete ri[reqId];
      const fr = { ...(c.friends || {}) };
      fr[r.from.id] = { id: r.from.id, name: r.from.name || r.from.id, color: r.from.color || AV[r.from.id.length % AV.length], since: Date.now() };
      return { ...c, reqsIn: ri, friends: fr };
    });
    chatPublish(cTopic('inbox', r.from.id, 'acc', reqId), { app:'splidchat', type:'friend-acc', reqId, from: meCard(chat.me), ts: Date.now() }, true);
    chatPublish(cTopic('inbox', chat.me.id, 'req', reqId), null, true);
    showToast((r.from.name || 'They') + ' is now your friend', 'check');
  };

  const declineReq = reqId => {
    const r = (chat.reqsIn || {})[reqId]; if (!r) return;
    patchChat(c => { const ri = { ...(c.reqsIn || {}) }; delete ri[reqId]; return { ...c, reqsIn: ri }; });
    chatPublish(cTopic('inbox', r.from.id, 'dec', reqId), { app:'splidchat', type:'friend-dec', reqId, from: meCard(chat.me), ts: Date.now() }, true);
    chatPublish(cTopic('inbox', chat.me.id, 'req', reqId), null, true);
  };

  const cancelReq = reqId => {
    const r = (chat.reqsOut || {})[reqId]; if (!r) return;
    patchChat(c => { const ro = { ...(c.reqsOut || {}) }; delete ro[reqId]; return { ...c, reqsOut: ro }; });
    chatPublish(cTopic('inbox', r.to.id, 'req', reqId), null, true);
  };

  const unfriend = fid => {
    patchChat(c => {
      const fr = { ...(c.friends || {}) }; delete fr[fid];
      const th = { ...(c.threads || {}) }; delete th[fid];
      const un = { ...(c.unread || {}) }; delete un[fid];
      return { ...c, friends: fr, threads: th, unread: un };
    });
    const c = chatClientRef.current;
    [cTopic('presence', fid), cTopic('profile', fid)].forEach(t => { chatSubsRef.current.delete(t); if (c) { try { c.unsubscribe(t); } catch (e) {} } });
    showToast('Friend removed', 'trash');
  };

  const sendMsg = (peerId, text) => {
    const me = chat.me; const t = String(text || '').trim().slice(0, 1000);
    if (!me || !t) return;
    const now = Date.now(), mid = uid();
    const ok = chatPublish(cTopic('inbox', peerId, 'msg', mid), { app:'splidchat', type:'chat-msg', id: mid, from: meCard(me), text: t, ts: now }, true);
    patchChat(c => {
      const th = { ...(c.threads || {}) };
      th[peerId] = [...(th[peerId] || []), { id: mid, mine: true, text: t, ts: now }].slice(-300);
      return { ...c, threads: th };
    });
    if (!ok) showToast('Chat is offline — message may not deliver', 'x');
  };

  const markRead = fid => {
    const arr = (chat.threads || {})[fid] || [];
    const upto = arr.length ? arr[arr.length - 1].ts : 0;
    if (((chat.unread || {})[fid] || 0) > 0) patchChat(c => ({ ...c, unread: { ...(c.unread || {}), [fid]: 0 } }));
    if (upto && chat.me) chatPublish(cTopic('inbox', fid, 'read'), { app:'splidchat', type:'read', by: chat.me.id, upto }, false);
  };

  const pingTyping = fid => {
    const now = Date.now();
    if (typSentRef.current[fid] && now - typSentRef.current[fid] < 2200) return;
    typSentRef.current[fid] = now;
    if (chat.me) chatPublish(cTopic('inbox', fid, 'typ'), { app:'splidchat', type:'typ', from: chat.me.id }, false);
  };

  const chatApi = { online: chatOn, presence, typing, createIdentity, sendFriendReq, acceptReq, declineReq, cancelReq, unfriend, sendMsg, markRead, pingTyping };

  const saveExpense = exp => {
    pendingPush.current = true;
    const existed = group.expenses.some(e => e.id === exp.id);
    patchGroup(g => ({ ...g, expenses: existed ? g.expenses.map(e => e.id === exp.id ? exp : e) : [...g.expenses, exp] }));
    setSheet(null);
    showToast(existed ? 'Expense updated' : 'Expense added');
  };
  const deleteExpense = id => {
    pendingPush.current = true;
    patchGroup(g => ({ ...g, expenses: g.expenses.filter(e => e.id !== id) }));
    showToast('Expense deleted', 'trash');
  };
  const saveSettlement = s => {
    pendingPush.current = true;
    patchGroup(g => ({ ...g, settlements: [...g.settlements, s] }));
    setSheet(null); setSelected(null);
    showToast('Settlement recorded');
  };
  const deleteSettlement = id => {
    pendingPush.current = true;
    patchGroup(g => ({ ...g, settlements: g.settlements.filter(s => s.id !== id) }));
    showToast('Settlement removed', 'trash');
  };
  const saveGroup = ({ name, members }) => {
    pendingPush.current = true;
    const creating = sheet && sheet.type === 'group' && sheet.create;
    setSheet(null); setSelected(null);
    if (creating) {
      setDb(d => ({ ...d, demo: false, tourDone: true, groups: [{
        id: uid(), name: name || 'My trip', color: '#4283F2',
        members, expenses: [], settlements: [],
      }] }));
      showToast('Trip created — log your first expense!', 'sparkle');
      setSheet({ type: 'add' });
    } else {
      patchGroup(g => ({ ...g, name, members }));
      showToast('Group updated');
    }
  };
  const resetAll = kind => {
    if (kind === 'demo') {
      setDb(d => ({ ...freshDemoDb(), chat: d.chat }));
      showToast('Demo restored', 'replay');
    } else {
      setDb(d => ({ v: 3, demo: false, tourDone: true, groups: [{
        id: uid(), name: 'My group', color: '#4283F2',
        members: [{ id: uid(), name: 'You', color: AV[0] }],
        expenses: [], settlements: [],
      }], chat: d.chat }));
      showToast('Fresh start — add your crew!', 'sparkle');
    }
    setSheet(null); setSelected(null); setTab('balance');
  };

  const makeOwnTrip = () => {
    setSelected(null); setTab('balance');
    setSheet({ type: 'group', create: true });
  };

  /* live sync handlers */
  const shareTrip = async () => {
    const code = newShareCode();
    const topic = TOPIC_ROOT + code.toLowerCase();
    patchGroup(g => ({ ...g, shareCode: { id: topic, code: chunkCode(code) } }));
    pendingPush.current = true;
    showToast('Trip is live — share the code', 'sparkle');
  };
  const stopShare = () => {
    const sc = group.shareCode;
    if (sc && clientRef.current) {
      try { clientRef.current.publish(sc.id, JSON.stringify({ app: 'splid', ended: true, updatedBy: deviceRef.current }), { qos: 0, retain: true }); } catch (e) {}
      try { clientRef.current.unsubscribe(sc.id); } catch (e) {}
    }
    subRef.current = null;
    patchGroup(g => { const { shareCode, ...rest } = g; return rest; });
    showToast('Live sync stopped');
  };
  const joinTrip = async code => {
    const clean = cleanCode(code);
    if (clean.length < 4) throw new Error('bad-code');
    const topic = TOPIC_ROOT + clean.toLowerCase();
    const g = await fetchRetainedGroup(topic);
    const withShare = { ...g, shareCode: { id: topic, code: chunkCode(clean) } };
    setDb(d => ({ ...d, groups: [withShare, d.groups[0]] }));
    setSheet(null); setSelected(null); setTab('balance');
    showToast('Joined ' + (withShare.name || 'shared trip'), 'sparkle');
  };
  const restoreBackup = () => {
    setDb(d => ({ ...d, groups: [d.groups[1] || d.groups[0], d.groups[0]] }));
    setSheet(null); setSelected(null);
    showToast('Previous trip restored', 'replay');
  };

  /* live sync — debounced publish on local edits (retained) */
  useEffect(() => {
    if (!pendingPush.current) return;
    const sc = group.shareCode;
    if (!sc) { pendingPush.current = false; return; }
    const t = setTimeout(() => {
      pendingPush.current = false;
      try {
        ensureLive().publish(sc.id, JSON.stringify({ app: 'splid', v: 3, group, updatedBy: deviceRef.current, updatedAt: Date.now() }), { qos: 0, retain: true });
      } catch (e) { pendingPush.current = true; }
    }, 700);
    return () => clearTimeout(t);
  }, [group]);

  const finishTour = () => {
    setTourOpen(false);
    setDb(d => d.tourDone ? d : { ...d, tourDone: true });
  };
  const finalTour = () => { finishTour(); makeOwnTrip(); };

  const openSettle = preset => setSheet({ type:'settle', preset });
  const openAdd = initial => setSheet(initial ? { type:'add', initial } : { type:'add' });

  return html`<div className="min-h-screen dotbg text-ink font-sans antialiased flex flex-col">
    <${Header} group=${group} total=${total} demo=${db.demo} onSettings=${() => setSheet({ type:'group' })} liveOn=${liveOn}
      onSheet=${() => downloadTripSheet(group, m => showToast(m, 'check'))}
      onChat=${() => { setChatView('home'); setChatOpen(true); }} chatUnread=${chatUnread}/>

    <main className="flex-1">
      ${tab === 'balance'
        ? html`<${BalanceTab} group=${group} edges=${edges} net=${net} simplified=${simplified} total=${total}
            selected=${selected} setSelected=${setSelected} openSettle=${openSettle} onMakeOwn=${makeOwnTrip}
            onJoin=${() => setSheet({ type: 'join' })}/>`
        : html`<${ActivityTab} group=${group} byId=${byId}
            onDelete=${deleteExpense} onEdit=${openAdd} onDeleteSettlement=${deleteSettlement}/>`}
    </main>

    <${Footer}/>

    <${BottomNav} tab=${tab} setTab=${k => { setTab(k); setSelected(null); }} onAdd=${() => openAdd()}/>

    ${sheet && sheet.type === 'add' && html`<${AddExpenseSheet} key=${sheet.initial ? sheet.initial.id : 'new'}
      group=${group} initial=${sheet.initial} onClose=${() => setSheet(null)} onSave=${saveExpense}/>`}
    ${sheet && sheet.type === 'settle' && html`<${SettleSheet} key=${sheet.preset ? (sheet.preset.from + '>' + sheet.preset.to + sheet.preset.amount) : 'free'}
      group=${group} preset=${sheet.preset} onClose=${() => setSheet(null)} onSave=${saveSettlement}/>`}
    ${sheet && sheet.type === 'join' && html`<${JoinSheet} onClose=${() => setSheet(null)} onJoin=${joinTrip}/>`}
    ${sheet && sheet.type === 'group' && html`<${GroupSheet} group=${group} isDemo=${db.demo} isCreate=${sheet.create}
      onClose=${() => setSheet(null)} onSaveGroup=${saveGroup} onReset=${resetAll}
      onSheet=${() => downloadTripSheet(group, m => showToast(m, 'check'))}
      onShare=${shareTrip} onStopShare=${stopShare} onJoinOpen=${() => setSheet({ type: 'join' })}
      backupName=${db.groups[1] && db.groups[1].name} onRestore=${restoreBackup}
      onReplayTour=${() => { setSheet(null); setTourOpen(true); }}/>`}

    ${chatOpen && html`<${ChatOverlay} chat=${chat} api=${chatApi} view=${chatView} setView=${setChatView} onClose=${() => setChatOpen(false)}/>`}

    <${ToastView} toast=${toast}/>
    ${tourOpen && html`<${Tour} steps=${TOUR_STEPS} onFinish=${finishTour} onFinal=${finalTour}/>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
