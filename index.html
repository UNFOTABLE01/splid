function Icon({ name, size=18, sw=2, className='' }) {
  if (!ICONS[name]) return null;
  return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true">
    ${ICONS[name].map((s, i) => s.t === 'p'
      ? html`<path key=${i} d=${s.d}/>`
      : html`<circle key=${i} cx=${s.cx} cy=${s.cy} r=${s.r}/>`)}
  </svg>`;
}

function fmt(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return new Intl.NumberFormat('en-IN', {
    style:'currency', currency:'INR',
    minimumFractionDigits: Number.isInteger(v) ? 0 : 2,
    maximumFractionDigits: 2,
  }).format(v);
}
const round2 = n => Math.round(n * 100) / 100;
const firstName = n => (n || '?').trim().split(/\s+/)[0];

function equalShares(amount, ids) {
  const p = Math.round(amount * 100), n = ids.length || 1;
  const base = Math.floor(p / n), rem = p - base * n;
  const o = {};
  ids.forEach((id, i) => { o[id] = (base + (i < rem ? 1 : 0)) / 100; });
  return o;
}

function dayLabel(ts) {
  const d = new Date(ts), t = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, t)) return 'Today';
  if (same(d, new Date(t.getTime() - 864e5))) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' })
    + (d.getFullYear() !== t.getFullYear() ? ' ' + d.getFullYear() : '');
}
const timeLabel = ts => new Date(ts).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });

/* ---------------- money math ---------------- */

function computePairwise(group) {
  const ids = group.members.map(m => m.id);
  const Pm = {};
  ids.forEach(a => { Pm[a] = {}; ids.forEach(b => { if (a !== b) Pm[a][b] = 0; }); });
  for (const e of group.expenses || []) {
    if (!Pm[e.payerId]) continue;
    for (const [uidv, sh] of Object.entries(e.splits || {})) {
      if (uidv !== e.payerId && Pm[uidv] && Pm[uidv][e.payerId] != null) {
        Pm[uidv][e.payerId] += Number(sh) || 0;
      }
    }
  }
  for (const s of group.settlements || []) {
    if (Pm[s.fromId] && Pm[s.fromId][s.toId] != null) Pm[s.fromId][s.toId] -= s.amount;
  }
  const edges = [];
  ids.forEach(a => ids.forEach(b => {
    if (a >= b) return;
    const v = Pm[a][b] - Pm[b][a];
    if (v > 0.005) edges.push({ from:a, to:b, amount: round2(v) });
    else if (v < -0.005) edges.push({ from:b, to:a, amount: round2(-v) });
  }));
  const net = {};
  ids.forEach(a => {
    let s = 0;
    ids.forEach(b => { if (a !== b) s += (Pm[b][a] || 0) - (Pm[a][b] || 0); });
    net[a] = round2(s);
  });
  return { edges, net };
}

/* Minimum-cash-flow greedy: repeatedly settle the biggest debtor against the biggest creditor */
function simplify(net) {
  const ds = [], cs = [];
  for (const id in net) {
    const v = Math.round(net[id] * 100);
    if (v > 0) cs.push({ id, amt: v });
    else if (v < 0) ds.push({ id, amt: -v });
  }
  ds.sort((a, b) => b.amt - a.amt);
  cs.sort((a, b) => b.amt - a.amt);
  const out = [];
  let i = 0, j = 0;
  while (i < ds.length && j < cs.length) {
    const amt = Math.min(ds[i].amt, cs[j].amt);
    out.push({ from: ds[i].id, to: cs[j].id, amount: amt / 100 });
    ds[i].amt -= amt; cs[j].amt -= amt;
    if (!ds[i].amt) i++;
    if (!cs[j].amt) j++;
  }
  return out;
}

function memberStat(group, id) {
  let paid = 0, share = 0;
  for (const e of group.expenses) {
    if (e.payerId === id) paid += e.amount;
    share += Number(e.splits && e.splits[id]) || 0;
  }
  return { paid, share };
}
function groupStats(g) {
  const total = g.expenses.reduce((s, e) => s + (+e.amount || 0), 0);
  const { edges } = computePairwise(g);
  return { total, debts: edges.length };
}

/* ---------------- trip sheet (excel export) ---------------- */

const sheetDate = ts => new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });

function buildTripAoas(group) {
  const { edges, net } = computePairwise(group);
  const byId = Object.fromEntries(group.members.map(m => [m.id, m]));
  const nm = id => (byId[id] && byId[id].name) || '?';
  const exps = [...group.expenses].sort((a, b) => b.date - a.date);
  const sets = [...(group.settlements || [])].sort((a, b) => b.date - a.date);
  const total = exps.reduce((s, e) => s + (+e.amount || 0), 0);
  const SPLIT_LBL = { equal:'Equal', custom:'Custom', pct:'Percentage' };

  /* sheet 1 — summary */
  const summary = [], numCells = [];
  const add = (arr, nums) => { const ri = summary.length; (nums || []).forEach(c => numCells.push([ri, c])); summary.push(arr); };
  add([(group.name || 'Trip').toUpperCase() + ' — TRIP SHEET']);
  add(['Full history record · auto-built from live trip data · made with Splid']);
  add(['Generated ' + sheetDate(Date.now()) + ' · ' + group.members.length + ' members · ' + exps.length + ' expenses · ' + sets.length + ' settlements']);
  add([]);
  add(['TOTAL SPEND', round2(total)], [1]);
  add(['OPEN DEBTS (PAIRWISE)', edges.length], [1]);
  add([]);
  add(['MEMBER', 'PAID (INR)', 'OWN SHARE (INR)', 'NET BALANCE (INR)', 'STATUS']);
  for (const m of group.members) {
    const st = memberStat(group, m.id);
    const n = round2(net[m.id] || 0);
    add([m.name, round2(st.paid), round2(st.share), n, n > 0.005 ? 'gets back' : n < -0.005 ? 'owes' : 'settled'], [1, 2, 3]);
  }
  add([]);
  add(['WHO OWES WHOM — SETTLE-UP PLAN']);
  const plan = simplify(net);
  if (plan.length) {
    add(['FROM', 'TO', 'AMOUNT (INR)']);
    for (const t of plan) add([nm(t.from), nm(t.to), round2(t.amount)], [2]);
  } else add(['Everyone is settled up.']);

  /* sheet 2 — expenses */
  const expenseRows = [['DATE', 'EXPENSE', 'CATEGORY', 'PAID BY', 'AMOUNT (INR)', 'SPLIT', 'SHARES DETAIL']];
  for (const e of exps) {
    const shares = Object.entries(e.splits || {})
      .filter(([, v]) => (+v || 0) > 0.004)
      .map(([id, v]) => firstName(byId[id] ? byId[id].name : '?') + ' ' + fmt(+v))
      .join(' · ');
    expenseRows.push([sheetDate(e.date), e.desc || 'Expense', (CATS[e.category] && CATS[e.category].label) || 'Misc',
      nm(e.payerId), round2(+e.amount || 0), SPLIT_LBL[e.splitType] || 'Custom', shares]);
  }
  expenseRows.push([]);
  expenseRows.push(['TOTAL', '', '', '', round2(total)]);

  /* sheet 3 — settlements */
  const settleRows = [['DATE', 'FROM (PAID)', 'TO (RECEIVED)', 'AMOUNT (INR)', 'TYPE']];
  if (!sets.length) settleRows.push(['No settlements recorded yet.']);
  for (const s of sets) settleRows.push([sheetDate(s.date), nm(s.fromId), nm(s.toId), round2(+s.amount || 0), s.full ? 'Full' : 'Part']);

  return { summary, numCells, expenseRows, settleRows };
}

function aoasToWorkbook(a) {
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(a.summary);
  ws1['!cols'] = [{ wch:30 }, { wch:15 }, { wch:17 }, { wch:19 }, { wch:12 }];
  ws1['!merges'] = [0, 1, 2].map(r => ({ s:{ r, c:0 }, e:{ r, c:4 } }));
  for (const [r, c] of a.numCells) {
    const cell = ws1[XLSX.utils.encode_cell({ r, c })];
    if (cell && typeof cell.v === 'number') cell.z = '#,##0.00';
  }
  XLSX.utils.book_append_sheet(wb, ws1, 'Summary');

  const ws2 = XLSX.utils.aoa_to_sheet(a.expenseRows);
  ws2['!cols'] = [{ wch:13 }, { wch:26 }, { wch:11 }, { wch:13 }, { wch:14 }, { wch:12 }, { wch:52 }];
  for (let r = 1; r < a.expenseRows.length; r++) {
    const cell = ws2[XLSX.utils.encode_cell({ r, c:4 })];
    if (cell && typeof cell.v === 'number') cell.z = '#,##0.00';
  }
  XLSX.utils.book_append_sheet(wb, ws2, 'Expenses');

  const ws3 = XLSX.utils.aoa_to_sheet(a.settleRows);
  ws3['!cols'] = [{ wch:13 }, { wch:16 }, { wch:17 }, { wch:14 }, { wch:10 }];
  for (let r = 1; r < a.settleRows.length; r++) {
    const cell = ws3[XLSX.utils.encode_cell({ r, c:3 })];
    if (cell && typeof cell.v === 'number') cell.z = '#,##0.00';
  }
  XLSX.utils.book_append_sheet(wb, ws3, 'Settlements');
  return wb;
}

function tripFileName(group, ext) {
  const safe = (group.name || 'trip').trim().replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'trip';
  return safe + '-sheet-' + new Date().toISOString().slice(0, 10) + '.' + ext;
}

function downloadTripSheet(group, notify) {
  try {
    if (typeof XLSX === 'undefined') throw new Error('xlsx-missing');
    XLSX.writeFile(aoasToWorkbook(buildTripAoas(group)), tripFileName(group, 'xlsx'));
    const n = group.expenses.length;
    notify('Trip sheet downloaded · ' + (n === 1 ? '1 expense' : n + ' expenses'));
  } catch (err) {
    try {
      const a = buildTripAoas(group);
      const esc = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
      const lines = ['SUMMARY'];
      a.summary.forEach(r => lines.push(r.map(esc).join(',')));
      lines.push('', 'EXPENSES');
      a.expenseRows.forEach(r => lines.push(r.map(esc).join(',')));
      lines.push('', 'SETTLEMENTS');
      a.settleRows.forEach(r => lines.push(r.map(esc).join(',')));
      const el = document.createElement('a');
      el.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }));
      el.download = tripFileName(group, 'csv');
      document.body.appendChild(el); el.click(); el.remove();
      notify('Saved as CSV — Excel export needs internet once');
    } catch (err2) { notify('Could not build the sheet'); }
  }
}

/* one-shot connection to fetch the retained trip state for a code */
function fetchRetainedGroup(topic) {
  return new Promise((resolve, reject) => {
    let c;
    try { c = mqtt.connect(MQTT_URL, { clientId: 'splid-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 7000 }); }
    catch (e) { return reject(e); }
    let done = false;
    const finish = (fn, arg) => { if (done) return; done = true; clearTimeout(to); try { c.end(true); } catch (e) {} fn(arg); };
    const to = setTimeout(() => finish(reject, new Error('not-found')), 9000);
    c.on('connect', () => { c.subscribe(topic, { qos: 0 }); });
    c.on('message', (t, payload) => {
      try {
        const d = JSON.parse(payload.toString());
        if (d && d.app === 'splid' && !d.ended && d.group && Array.isArray(d.group.members)) finish(resolve, d.group);
        else finish(reject, new Error('bad-data'));
      } catch (e) { finish(reject, e); }
    });
    c.on('error', e => finish(reject, e));
  });
}

/* one-shot lookup of a retained chat profile — resolves the profile, or null when free / unreachable */
function fetchChatProfile(id, timeout) {
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve(null); return; }
    let c;
    try { c = mqtt.connect(MQTT_URL, { clientId: 'splidq-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
    catch (e) { resolve(null); return; }
    let done = false;
    const finish = v => { if (done) return; done = true; clearTimeout(to); try { c.end(true); } catch (e) {} resolve(v); };
    const to = setTimeout(() => finish(null), timeout || 4500);
    c.on('connect', () => { try { c.subscribe(cTopic('profile', id), { qos: 0 }); } catch (e) {} });
    c.on('message', (t, payload) => {
      const s = payload.toString();
      if (!s) { finish(null); return; }
      try {
        const d = JSON.parse(s);
        if (d && d.app === 'splidchat' && d.profile && d.profile.id === id) finish(d.profile);
      } catch (e) {}
    });
    c.on('error', () => finish(null));
  });
}

/* ---------------- tiny hooks ---------------- */

function useCountUp(target, dur = 700) {
  const [val, setVal] = useState(target);
  const fromRef = useRef(target);
  useEffect(() => {
    const from = fromRef.current, to = target;
    if (Math.abs(to - from) < 0.5) { fromRef.current = to; setVal(to); return; }
    let raf; const t0 = performance.now();
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const v = from + (to - from) * e;
      fromRef.current = v; setVal(v);
      if (p < 1) raf = requestAnimationFrame(tick); else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

function Tour({ steps, onFinish, onFinal }) {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const [cardPos, setCardPos] = useState(null);
  const cardRef = useRef(null);
  const step = steps[i];
  const last = i === steps.length - 1;

  const measureNow = () => {
    const el = step.target ? document.getElementById(step.target) : null;
    if (!el) { setRect(null); return; }
    const r = el.getBoundingClientRect();
    setRect({ top: r.top - 10, left: r.left - 10, width: r.width + 20, height: r.height + 20 });
  };

  useEffect(() => {
    const el = step.target ? document.getElementById(step.target) : null;
    if (!el) { setRect(null); return; }
    el.scrollIntoView({ block:'center', behavior:'smooth' });
    const t1 = setTimeout(measureNow, 430);
    let raf = 0;
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(measureNow); };
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    return () => { clearTimeout(t1); cancelAnimationFrame(raf); window.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onScroll); };
  }, [i]);

  useLayoutEffect(() => {
    const c = cardRef.current; if (!c) return;
    const cr = c.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const W = cr.width, H = cr.height;
    let top, left;
    if (!rect) { top = (vh - H) / 2; left = (vw - W) / 2; }
    else {
      const below = rect.top + rect.height + 14;
      const above = rect.top - H - 14;
      top = (below + H < vh - 12) ? below : (above > 12 ? above : Math.max(12, Math.min(vh - H - 12, below)));
      left = Math.max(12, Math.min(vw - W - 12, rect.left + rect.width / 2 - W / 2));
    }
    setCardPos({ top, left });
  }, [i, rect]);

  useEffect(() => {
    const h = e => {
      if (e.key === 'Escape') onFinish();
      if (e.key === 'ArrowRight') setI(v => Math.min(v + 1, steps.length - 1));
      if (e.key === 'ArrowLeft') setI(v => Math.max(v - 1, 0));
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const next = () => (i < steps.length - 1 ? setI(i + 1) : onFinish());

  return html`<div className="fixed inset-0 z-[80]">
    ${rect
      ? html`<div className="absolute pointer-events-none" style=${{
          top:rect.top, left:rect.left, width:rect.width, height:rect.height, borderRadius:18,
          boxShadow:'0 0 0 2px rgba(252,249,243,.85), 0 10px 44px rgba(38,34,27,.28), 0 0 0 9999px rgba(38,34,27,.48)',
          transition:'all .4s cubic-bezier(.22,.9,.3,1)' }}/>`
      : html`<div className="absolute inset-0 bg-ink/45 backdrop-in"></div>`}
    <div className="absolute inset-0" onClick=${last ? onFinish : next}></div>
    <div ref=${cardRef}
      className="absolute bg-card rounded-2xl shadow-pop border border-line p-4 sm:p-5"
      style=${{
        top: cardPos ? cardPos.top : -9999, left: cardPos ? cardPos.left : '50%',
        width: 'min(92vw, 350px)',
        opacity: cardPos ? 1 : 0,
        transition:'top .35s cubic-bezier(.22,.9,.3,1), left .35s cubic-bezier(.22,.9,.3,1), opacity .25s ease' }}>
      <div className="flex items-center justify-between mb-2">
        <span className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted">${step.final ? 'Ready?' : (i + 1) + ' of ' + steps.length}</span>
        ${!last && html`<button onClick=${onFinish} className="text-[12px] font-semibold text-muted hover:text-ink transition">Skip tour</button>`}
      </div>
      <h4 className="font-display text-[19px] font-semibold leading-snug">${step.title}</h4>
      <p className="text-[13.5px] text-muted mt-1.5 leading-relaxed">${step.body}</p>
      <div className="mt-4 flex items-center gap-2">
        ${i > 0 && html`<button onClick=${() => setI(i - 1)} className="rounded-full border border-line px-3.5 py-2 text-[13px] font-semibold hover:border-muted transition">Back</button>`}
        <div className="flex-1"></div>
        ${last
          ? html`<button onClick=${onFinish} className="rounded-full border border-line px-3.5 py-2 text-[13px] font-semibold text-muted hover:text-ink hover:border-muted transition">Keep exploring</button>
             <button onClick=${onFinal} className="inline-flex items-center gap-1.5 rounded-full bg-ink text-paper px-4 py-2 text-[13px] font-semibold hover:bg-ink/90 transition active:scale-95">
               <${Icon} name="sparkle" size=${14}/> Make your own</button>`
          : html`<button onClick=${next} className="inline-flex items-center gap-1 rounded-full bg-ink text-paper px-4 py-2 text-[13px] font-semibold hover:bg-ink/90 transition active:scale-95">
               Next <${Icon} name="right" size=${14} sw=${2.4}/></button>`}
      </div>
    </div>
  </div>`;
}

const CAT_BAR = {
  food: '#EE5458', travel: '#4283F2', stay: '#3FCE6E', misc: '#E95EC0',
};

const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c * (1 + k))));
  return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1);
};

function SpendChart({ group }) {
  const [view, setView] = useState('graph');
  const [hot, setHot] = useState(null);
  const [hoverCat, setHoverCat] = useState(null);
  const H = 150;

  const data = useMemo(() => {
    const exps = group.expenses || [];
    const total = exps.reduce((s, e) => s + (+e.amount || 0), 0);
    const n = exps.length;
    if (!n) return { list: [], total, n, first: null, unit: 'day' };
    const t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const today = t0.getTime();
    const day0 = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
    const firstD = day0(Math.min(...exps.map(e => e.date)));
    let unit = 'day', span = Math.round((today - firstD) / 864e5) + 1, start, size;
    if (span > 45) { unit = 'week'; size = 7 * 864e5; start = firstD; span = Math.floor((today - firstD) / size) + 1; }
    else { size = 864e5; span = Math.max(12, span); start = today - (span - 1) * size; }
    const arr = [];
    for (let i = 0; i < span; i++) arr.push({ start: start + i * size, total: 0, byCat: {} });
    for (const e of exps) {
      const ci = Math.min(span - 1, Math.max(0, Math.floor((e.date - start) / size)));
      const amt = +e.amount || 0;
      arr[ci].total += amt;
      const c = e.category || 'misc';
      arr[ci].byCat[c] = (arr[ci].byCat[c] || 0) + amt;
    }
    return { list: arr, total, n, first: firstD, unit };
  }, [group.expenses]);

  const list = data.list;
  const max = Math.max(1, ...list.map(d => d.total));
  const totalAnim = useCountUp(data.total);
  const fmtDay = ts => new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
  const axis = list.length ? [list[0].start, list[Math.floor((list.length - 1) / 2)].start, list[list.length - 1].start] : [];
  const cats = Object.keys(CAT_BAR)
    .map(c => ({ cat: c, value: (group.expenses || []).reduce((s, e) => s + ((e.category || 'misc') === c ? +e.amount || 0 : 0), 0) }))
    .filter(d => d.value > 0);
  const tipLabel = d => data.unit === 'day' ? dayLabel(d.start) : 'Week of ' + fmtDay(d.start);

  return html`<div>
    <div className="flex items-start justify-between gap-3 px-4 sm:px-5 pt-4">
      <div className="min-w-0">
        <div className="text-[11px] font-bold tracking-[.16em] uppercase text-muted">Total spend</div>
        <div className="text-[12.5px] text-muted mt-0.5 truncate">${group.name} · ${data.n ? 'since ' + fmtDay(data.first) : 'no expenses yet'}</div>
      </div>
      <div className="flex bg-paper border border-line rounded-full p-0.5 text-[12px] font-semibold shrink-0">
        ${[['graph', 'Graph'], ['donut', '3D']].map(([k, l]) => html`<button key=${k} onClick=${() => { setView(k); setHot(null); setHoverCat(null); }}
          className=${'px-3.5 py-1.5 rounded-full transition ' + (view === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
      </div>
    </div>

    <div className="px-4 sm:px-5 pt-3">
      <div className="font-display text-[36px] sm:text-[42px] font-semibold numtab leading-none tracking-tight">${fmt(Math.round(totalAnim))}</div>
      <div className="text-[12.5px] text-muted mt-2 numtab">
        ${data.n === 0 ? 'add your first expense to see it here' : `${data.n} expense${data.n === 1 ? '' : 's'} on this trip`}
      </div>
    </div>

    ${data.n === 0
      ? html`<div className="h-[148px] mx-1 flex flex-col items-center justify-center gap-1.5 text-center">
          <span className="w-9 h-9 rounded-full bg-paper border border-line flex items-center justify-center text-muted"><${Icon} name="wallet" size=${16}/></span>
          <span className="text-[13px] font-semibold text-muted">Nothing spent yet</span>
          <span className="text-[12px] text-muted/75">Log an expense to see the bars light up.</span>
        </div>`
      : view === 'graph'
        ? html`<div className="px-2 sm:px-3 pt-4">
            <div className="relative flex items-end" style=${{ height: H }}>
              ${list.map((d, i) => {
                const hPct = d.total > 0 ? Math.max(7, d.total / max * 100) : 0;
                const active = hot === i;
                return html`<div key=${i}
                  className=${'relative flex-1 h-full flex items-end justify-center ' + (d.total > 0 ? 'cursor-pointer' : 'cursor-default')}
                  onMouseEnter=${() => { if (d.total > 0) setHot(i); }}
                  onMouseLeave=${() => { if (active) setHot(null); }}
                  onClick=${() => { if (d.total > 0) setHot(active ? null : i); }}>
                  ${d.total > 0
                    ? html`<div key=${'b' + i} className="bar-up overflow-hidden rounded-full flex flex-col-reverse"
                        style=${{ height: hPct + '%', width: 'min(58%, 24px)', animationDelay: (i * 26) + 'ms' }}>
                        ${Object.entries(d.byCat).map(([c, v]) => html`<div key=${c}
                          style=${{ flexGrow: v, flexBasis: 0, minHeight: 3, background: CAT_BAR[c] || CAT_BAR.misc }}/>`)}
                      </div>`
                    : html`<div className="rounded-full" style=${{ height: 5, width: 'min(58%, 24px)', background: '#ECE2CE' }}/>`}
                  ${active && d.total > 0 && html`<div
                    className=${'absolute z-10 pointer-events-none backdrop-in ' +
                      (i < list.length * 0.18 ? 'left-0' : i > list.length * 0.82 ? 'right-0' : 'left-1/2 -translate-x-1/2')}
                    style=${{ bottom: `calc(${Math.min(hPct, 92)}% + 12px)` }}>
                    <div className="bg-ink text-paper rounded-2xl shadow-pop px-3 py-2.5 w-max max-w-[190px]">
                      <div className="flex items-baseline gap-2">
                        <span className="text-[10.5px] font-bold tracking-[.12em] uppercase text-paper/55">${tipLabel(d)}</span>
                        <span className="text-[13px] font-semibold numtab">${fmt(d.total)}</span>
                      </div>
                      <div className="mt-1.5 space-y-1 min-w-[122px]">
                        ${Object.entries(d.byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => html`<div key=${c} className="flex items-center gap-1.5 text-[11.5px]">
                          <span className="w-2 h-2 rounded-full shrink-0" style=${{ background: CAT_BAR[c] || CAT_BAR.misc }}/>
                          <span className="text-paper/75 truncate">${(CATS[c] || CATS.misc).label}</span>
                          <span className="ml-auto pl-3 font-semibold numtab">${fmt(v)}</span>
                        </div>`)}
                      </div>
                    </div>
                  </div>`}
                </div>`;
              })}
            </div>
            <div className="mt-2 border-t border-line pt-1.5 flex items-center justify-between text-[10.5px] font-semibold text-muted numtab">
              ${axis.map((ts, i) => html`<span key=${i}>${isToday(ts) && i === 2 ? 'Today' : fmtDay(ts)}</span>`)}
            </div>
          </div>`
        : html`<div className="flex flex-col items-center pt-3">
            <div className="relative donut-in">
              <svg viewBox="0 0 220 128" width="220" height="128" role="img" aria-label="Spend by category">
                <g transform="translate(110,58) scale(1,0.58)">
                  <g transform="rotate(-90)">
                    ${cats.map(s => {
                      const len = s.value / data.total * 100;
                      return html`<circle key=${'b' + s.cat} r="54" pathLength="100" fill="none"
                        stroke=${shade(CAT_BAR[s.cat] || CAT_BAR.misc, -0.3)} strokeWidth="30"
                        strokeDasharray=${(len - 0.8) + ' ' + (100 - len + 0.8)} strokeDashoffset=${-cats.slice(0, cats.indexOf(s)).reduce((a, x) => a + x.value / data.total * 100, 0)}
                        style=${{ opacity: hoverCat && hoverCat !== s.cat ? 0.35 : 1, transition: 'opacity .2s ease' }}/>`;
                    })}
                  </g>
                  <g transform="translate(0,-16) rotate(-90)">
                    ${cats.map(s => {
                      const len = s.value / data.total * 100;
                      return html`<circle key=${'t' + s.cat} r="54" pathLength="100" fill="none"
                        stroke=${CAT_BAR[s.cat] || CAT_BAR.misc} strokeWidth="30"
                        strokeDasharray=${(len - 0.8) + ' ' + (100 - len + 0.8)} strokeDashoffset=${-cats.slice(0, cats.indexOf(s)).reduce((a, x) => a + x.value / data.total * 100, 0)}
                        style=${{ opacity: hoverCat && hoverCat !== s.cat ? 0.45 : 1, transition: 'opacity .2s ease' }}/>`;
                    })}
                  </g>
                </g>
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none" style=${{ paddingBottom: 12 }}>
                <span className="text-[7.5px] font-bold tracking-[.2em] uppercase text-muted">Total</span>
                <span className="font-display text-[12.5px] font-semibold numtab leading-tight">${fmt(Math.round(data.total))}</span>
              </div>
            </div>
            <div className="w-full max-w-[300px] mt-2 space-y-0.5 px-2">
              ${cats.sort((a, b) => b.value - a.value).map((s, i) => html`<div key=${s.cat}
                className="rise flex items-center gap-2.5 rounded-xl px-2 py-1.5 cursor-default transition hover:bg-paper/70"
                style=${{ animationDelay: (i * 55) + 'ms' }}
                onMouseEnter=${() => setHoverCat(s.cat)} onMouseLeave=${() => setHoverCat(null)}>
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style=${{ background: CAT_BAR[s.cat] || CAT_BAR.misc }}/>
                <span className="text-[13px] font-semibold">${(CATS[s.cat] || CATS.misc).label}</span>
                <span className="ml-auto text-[12px] text-muted numtab">${Math.round(s.value / data.total * 100)}%</span>
                <span className="text-[13px] font-semibold numtab w-[76px] text-right">${fmt(s.value)}</span>
              </div>`)}
            </div>
          </div>`}
  </div>`;
}

function MemberPanel({ group, memberId, edges, net, byId, onClose, onSettle }) {
  const m = byId[memberId]; if (!m) return null;
  const { paid, share } = memberStat(group, memberId);
  const nv = net[memberId] || 0;
  const owes = edges.filter(e => e.from === memberId);
  const gets = edges.filter(e => e.to === memberId);
  const netTxt = nv > 0.005 ? ('is owed ' + fmt(nv)) : nv < -0.005 ? ('owes ' + fmt(-nv)) : 'all settled';
  const netCls = nv > 0.005 ? 'text-sage-deep' : nv < -0.005 ? 'text-rust-deep' : 'text-muted';
  return html`<div className="rise mt-3 bg-card border border-line rounded-3xl p-4 sm:p-5 shadow-soft">
    <div className="flex items-center gap-3">
      <${Avatar} m=${m} size=${44}/>
      <div className="flex-1 min-w-0">
        <div className="font-display text-[19px] font-semibold leading-tight">${m.name}</div>
        <div className=${'text-[12.5px] font-semibold numtab mt-0.5 ' + netCls}>${netTxt}</div>
      </div>
      <button onClick=${onClose} aria-label="Close panel" className="p-1.5 rounded-full text-muted hover:bg-paper hover:text-ink transition"><${Icon} name="x" size=${16}/></button>
    </div>
    <div className="mt-3.5 flex divide-x divide-line rounded-2xl border border-line bg-paper overflow-hidden">
      <div className="flex-1 px-4 py-2.5">
        <div className="text-[10px] font-bold tracking-[.13em] uppercase text-muted">Paid</div>
        <div className="font-display text-[17px] font-semibold numtab mt-0.5">${fmt(paid)}</div>
      </div>
      <div className="flex-1 px-4 py-2.5">
        <div className="text-[10px] font-bold tracking-[.13em] uppercase text-muted">Share</div>
        <div className="font-display text-[17px] font-semibold numtab mt-0.5">${fmt(share)}</div>
      </div>
      <div className="flex-1 px-4 py-2.5">
        <div className="text-[10px] font-bold tracking-[.13em] uppercase text-muted">Net</div>
        <div className=${'font-display text-[17px] font-semibold numtab mt-0.5 ' + netCls}>${nv > 0.005 ? '+' + fmt(nv) : nv < -0.005 ? '−' + fmt(-nv) : '₹0'}</div>
      </div>
    </div>
    ${(owes.length > 0 || gets.length > 0) && html`<div className="mt-3.5 space-y-1">
      ${owes.map(e => html`<div key=${'o' + e.to} className="flex items-center gap-2.5 py-1">
        <${Avatar} m=${byId[e.to]} size=${24}/>
        <span className="flex-1 text-[13.5px]">owes <span className="font-semibold">${byId[e.to].name}</span></span>
        <span className="numtab text-[13.5px] font-semibold text-rust-deep">${fmt(e.amount)}</span>
        <button onClick=${() => onSettle({ from: e.from, to: e.to, amount: e.amount })} className="text-[12px] font-bold rounded-full border border-line px-2.5 py-1 hover:border-ink transition">Settle</button>
      </div>`)}
      ${gets.map(e => html`<div key=${'g' + e.from} className="flex items-center gap-2.5 py-1">
        <${Avatar} m=${byId[e.from]} size=${24}/>
        <span className="flex-1 text-[13.5px]">is owed by <span className="font-semibold">${byId[e.from].name}</span></span>
        <span className="numtab text-[13.5px] font-semibold text-sage-deep">${fmt(e.amount)}</span>
        <button onClick=${() => onSettle({ from: e.from, to: e.to, amount: e.amount })} className="text-[12px] font-bold rounded-full border border-line px-2.5 py-1 hover:border-ink transition">Record</button>
      </div>`)}
    </div>`}
  </div>`;
}

        ${!isLast && html`<span className="w-px flex-1 bg-line my-1.5"></span>`}
      </div>
      <div className="flex-1 min-w-0 pb-6">

          <div className="flex-1 min-w-0">

    <div className="flex flex-col items-center">
      <span className="w-9 h-9 rounded-full flex items-center justify-center shrink-0" style=${{ background: cat.tint, color: cat.fg }}><${Icon} name=${cat.icon} size=${16}/></span>
      ${!isLast && html`<span className="w-px flex-1 bg-line my-1.5"></span>`}
    </div>
    <div className="flex-1 min-w-0 pb-6">
      <div className="cursor-pointer" onClick=${() => { setOpen(!open); setConfirm(false); }}>

          <span className="font-display text-[17px] font-semibold numtab shrink-0">${fmt(e.amount)}</span>
        </div>
        <div className="text-[12.5px] text-muted mt-0.5 flex items-center gap-1.5 flex-wrap">
          <span><span className="font-semibold text-ink/70">${(payer || {}).name || '?'}</span> paid</span>
          <span>· ${splitTxt}</span>

        </div>
      </div>
      ${open && html`<div className="rise mt-2.5">
        <div className="flex flex-wrap gap-1.5">
          ${parts.map(([pid, v]) => html`<span key=${pid} className="inline-flex items-center gap-1.5 bg-paper border border-line rounded-full pl-1 pr-2.5 py-0.5">
            ${byId[pid] && html`<${Avatar} m=${byId[pid]} size=${20}/>`}
            <span className="text-[12px] font-medium">${firstName(byId[pid] && byId[pid].name)}</span>
            <span className="text-[12px] font-semibold numtab">${fmt(v)}</span>

        </div>
        <div className="mt-2.5 flex items-center gap-2 flex-wrap">
          <button onClick=${() => onEdit(e)}
            className="inline-flex items-center gap-1.5 text-[12.5px] font-semibold rounded-full px-3 py-1.5 border border-line text-ink hover:border-ink transition">
            <${Icon} name="pencil" size=${13}/> Edit
          </button>
          <button onClick=${() => { if (confirm) onDelete(e.id); else setConfirm(true); }}

function ActivityTab({ group, byId, onDelete, onEdit, onDeleteSettlement }) {
  const entries = useMemo(() => [
    ...group.expenses.map(e => ({ k: 'e', ts: e.date, e })),
    ...group.settlements.map(s => ({ k: 's', ts: s.date, s })),
  ].sort((a, b) => b.ts - a.ts), [group]);

  if (entries.length === 0) return html`<div className="max-w-3xl mx-auto px-4 sm:px-6 pt-16 pb-16 text-center">
    <span className="inline-flex w-14 h-14 rounded-full bg-card border border-line items-center justify-center text-muted"><${Icon} name="wallet" size=${22}/></span>
    <p className="mt-3 font-display text-lg font-semibold">Nothing yet</p>
    <p className="text-[13.5px] text-muted mt-1">Expenses and settlements will appear here as a story feed.</p>
  </div>`;

  const days = [];
  for (const it of entries) {
    const lab = dayLabel(it.ts);
    let d = days.find(x => x.label === lab);
    if (!d) { d = { label: lab, items: [] }; days.push(d); }
    d.items.push(it);
  }
  const lastId = (entries[entries.length - 1].e || entries[entries.length - 1].s).id;

  return html`<div className="max-w-3xl mx-auto px-4 sm:px-6 pt-5 pb-10">
    ${days.map(day => html`<div key=${day.label} className="mb-7">
      <div className="flex items-center gap-3 mb-3.5">
        <span className="text-[11px] font-bold tracking-[.18em] uppercase text-muted">${day.label}</span>
        <span className="h-px flex-1 bg-line"></span>
      </div>
      ${day.items.map(it => html`<${TimelineEntry} key=${(it.e || it.s).id} item=${it} byId=${byId}
        isLast=${(it.e || it.s).id === lastId}
        onDelete=${onDelete} onEdit=${onEdit} onDeleteSettlement=${onDeleteSettlement}/>`)}
    </div>`)}
  </div>`;
}

const QUICK = [['Dinner','food'],['Groceries','food'],['Cab','travel'],['Hotel','stay'],['Snacks','food'],['Tickets','misc']];

function AddExpenseSheet({ group, onClose, onSave, initial }) {
  const members = group.members;
  const init = initial || null;
  const [amount, setAmount] = useState(init ? String(init.amount) : '');
  const [desc, setDesc] = useState(init ? init.desc : '');
  const [cat, setCat] = useState(init ? init.category : 'food');
  const [payer, setPayer] = useState(init ? init.payerId : (members[0] ? members[0].id : null));
  const [mode, setMode] = useState(init ? init.splitType : 'equal');
  const [incl, setIncl] = useState(() => {
    const o = {};
    members.forEach(m => { o[m.id] = init ? Number(init.splits[m.id] || 0) > 0.005 : true; });
    return o;
  });
  const [cvals, setCvals] = useState(() => {
    const o = {};
    members.forEach(m => { o[m.id] = init ? String(round2(init.splits[m.id] || 0)) : ''; });
    return o;
  });
  const [pvals, setPvals] = useState(() => {
    const o = {};
    if (init) {
      const ids = members.map(m => m.id);
      let acc = 0;
      ids.forEach((id, idx) => {
        if (idx < ids.length - 1) {
          const v = Math.round(((init.splits[id] || 0) / init.amount * 100) * 100) / 100;
          o[id] = String(v); acc += v;
        }
      });
      o[ids[ids.length - 1]] = String(Math.round((100 - acc) * 100) / 100);
    } else members.forEach(m => { o[m.id] = ''; });
    return o;
  });

  const amt = Math.max(0, parseFloat(amount) || 0);
  const amtP = Math.round(amt * 100);
  const inclIds = members.filter(m => incl[m.id]).map(m => m.id);
  const eqShares = equalShares(amt, inclIds);
  const each = inclIds.length ? amt / inclIds.length : 0;

  const cP = Object.fromEntries(members.map(m => [m.id, Math.round((parseFloat(cvals[m.id]) || 0) * 100)]));
  const cSum = members.reduce((s, m) => s + cP[m.id], 0);
  const cRem = amtP - cSum;

  const pN = Object.fromEntries(members.map(m => [m.id, parseFloat(pvals[m.id]) || 0]));
  const pSum = members.reduce((s, m) => s + pN[m.id], 0);
  const pOk = Math.abs(pSum - 100) < 0.011;
  const pPaise = (() => {
    const o = {}; let acc = 0;
    members.forEach(m => { const v = Math.round(amtP * pN[m.id] / 100); o[m.id] = v; acc += v; });
    const diff = amtP - acc;
    if (diff !== 0) { const f = members.find(m => pN[m.id] > 0) || members[0]; if (f) o[f.id] += diff; }
    return o;
  })();

  const valid = amtP > 0 && (mode === 'equal' ? inclIds.length >= 1 : mode === 'custom' ? cRem === 0 : pOk);

  const evenPct = () => {
    const n = members.length, o = {}; let acc = 0;
    members.forEach((m, i) => {
      if (i < n - 1) { const v = Math.round((100 / n) * 10) / 10; o[m.id] = String(v); acc += v; }
    });
    o[members[n - 1].id] = String(Math.round((100 - acc) * 10) / 10);
    setPvals(o);
  };

  const save = () => {
    if (!valid) return;
    let splits;
    if (mode === 'equal') splits = Object.fromEntries(members.map(m => [m.id, eqShares[m.id] || 0]));
    else if (mode === 'custom') splits = Object.fromEntries(members.map(m => [m.id, cP[m.id] / 100]));
    else splits = Object.fromEntries(members.map(m => [m.id, pPaise[m.id] / 100]));
    onSave({
      id: init ? init.id : uid(),
      desc: desc.trim() || (CATS[cat] ? CATS[cat].label : 'Expense'),
      amount: round2(amt),
      payerId: payer,
      category: cat,
      splitType: mode,
      date: init ? init.date : Date.now(),
      splits,
    });
  };

  return html`<${Sheet} title=${init ? 'Edit expense' : 'Add expense'} onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex items-center gap-2 bg-card">
      <button onClick=${onClose} className="rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <div className="flex-1"></div>
      <button onClick=${save} disabled=${!valid}
        className=${'rounded-full px-5 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' +
          (valid ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        ${init ? 'Save changes' : 'Add expense'}
      </button>
    </div>`}>
    <div className="space-y-5">
      <div>
        <label className="lbl">Amount</label>
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 font-display text-[20px] font-semibold text-muted">₹</span>
          <input inputMode="decimal" className="inp !pl-9 font-display text-[22px] font-semibold numtab" placeholder="0"
            value=${amount} onChange=${e => setAmount(e.target.value.replace(/[^\d.]/g, ''))}/>
        </div>
      </div>

      <div>
        <label className="lbl">Description</label>
        <input className="inp" placeholder="What was it for?" maxLength=${60} value=${desc} onChange=${e => setDesc(e.target.value)}/>
        <div className="mt-2 flex flex-wrap gap-1.5">
          ${QUICK.map(([q, c]) => html`<button key=${q} onClick=${() => { setDesc(q); setCat(c); }}
            className=${'text-[12px] font-semibold rounded-full px-2.5 py-1 border transition ' +
              (desc === q ? 'bg-ink text-paper border-ink' : 'border-line text-muted hover:text-ink hover:border-muted')}>${q}</button>`)}
        </div>
      </div>

      <div>
        <label className="lbl">Category</label>
        <div className="flex gap-2">
          ${Object.entries(CATS).map(([k, c]) => html`<button key=${k} onClick=${() => setCat(k)}
            className=${'flex-1 flex flex-col items-center gap-1 rounded-2xl border px-2 py-2.5 transition ' + (cat === k ? 'border-ink' : 'border-line hover:border-muted')}
            style=${cat === k ? { background: c.tint } : null}>
            <span className="w-8 h-8 rounded-full flex items-center justify-center border-2 border-card" style=${{ background: c.tint, color: c.fg }}><${Icon} name=${c.icon} size=${16}/></span>
            <span className="text-[11.5px] font-semibold" style=${{ color: c.fg }}>${c.label}</span>
          </button>`)}
        </div>
      </div>

      <div>
        <label className="lbl">Paid by</label>
        <${PeoplePill} members=${members} selected=${[payer]} single emptyLabel="Who paid?"
          onToggle=${id => setPayer(id)}/>
      </div>

      <div>
        <div className="flex items-center justify-between mb-2">
          <label className="lbl" style=${{ marginBottom: 0 }}>Split</label>
          <div className="flex bg-paper border border-line rounded-full p-0.5 text-[11.5px] font-semibold">
            ${[['equal','Equal'],['custom','Sliders'],['pct','%']].map(([k, l]) => html`<button key=${k} onClick=${() => setMode(k)}
              className=${'px-2.5 py-1 rounded-full transition ' + (mode === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
          </div>
        </div>

        ${mode === 'equal' && html`<div className="space-y-2.5">
          <${PeoplePill} members=${members} selected=${inclIds} emptyLabel="Nobody yet"
            onToggle=${id => setIncl(o => ({ ...o, [id]: !o[id] }))}
            sub=${m => incl[m.id] ? fmt(eqShares[m.id] || 0) : 'not included'}/>
          <p className="text-[12px] text-muted pt-0.5">Each selected person pays <span className="font-semibold text-ink">${fmt(each)}</span>.</p>
        </div>`}

        ${mode === 'custom' && html`<div className="space-y-3">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-3">
            <${Avatar} m=${m} size=${28}/>
            <input type="range" min="0" max=${Math.max(amtP, 1)} step="1" value=${Math.min(cP[m.id], Math.max(amtP, 0))} disabled=${amtP <= 0}
              onChange=${e => {
                const remaining = amtP - (cSum - cP[m.id]);
                const v = Math.max(0, Math.min(remaining, Number(e.target.value)));
                setCvals(o => ({ ...o, [m.id]: String(v / 100) }));
              }} className="flex-1"/>
            <span className="numtab text-[13px] font-semibold w-16 text-right">${fmt(cP[m.id] / 100)}</span>
          </div>`)}
          <div className=${'text-[12.5px] font-semibold numtab ' + (cRem === 0 ? 'text-sage-deep' : 'text-rust-deep')}>
            ${cRem === 0 ? '✓ Fully assigned' : fmt(Math.abs(cRem) / 100) + (cRem > 0 ? ' left to assign' : ' over — reduce someone')}
          </div>
        </div>`}

        ${mode === 'pct' && html`<div className="space-y-2">
          ${members.map(m => html`<div key=${m.id} className="flex items-center gap-3">
            <${Avatar} m=${m} size=${28}/>
            <input inputMode="decimal" className="inp !py-1.5 text-[13.5px] numtab" placeholder="0" value=${pvals[m.id]}
              onChange=${e => setPvals(o => ({ ...o, [m.id]: e.target.value.replace(/[^\d.]/g, '') }))}/>
            <span className="text-[13px] text-muted font-semibold w-4">%</span>
            <span className="numtab text-[13px] font-semibold w-20 text-right">${fmt(pPaise[m.id] / 100)}</span>
          </div>`)}
          <div className="flex items-center justify-between pt-1">
            <div className=${'text-[12.5px] font-semibold numtab ' + (pOk ? 'text-sage-deep' : 'text-rust-deep')}>${Math.round(pSum * 100) / 100}% assigned</div>
            <button onClick=${evenPct} className="text-[12px] font-bold rounded-full border border-line px-3 py-1.5 hover:border-ink transition">Split evenly</button>
          </div>
        </div>`}
      </div>
    </div>
  <//>`;
}

function SettleSheet({ group, preset, onClose, onSave }) {
  const members = group.members;
  const [fromId, setFromId] = useState(preset ? preset.from : members[0].id);
  const [toId, setToId] = useState(preset ? preset.to : (members[1] || members[0]).id);
  const [amount, setAmount] = useState(preset ? String(preset.amount) : '');
  const amt = Math.max(0, parseFloat(amount) || 0);
  const valid = amt > 0 && fromId !== toId;
  const full = preset ? Math.abs(amt - preset.amount) < 0.005 : false;
  const byId = Object.fromEntries(members.map(m => [m.id, m]));

  const setFrom = id => { setFromId(id); if (id === toId && members.length > 1) setToId(members.find(m => m.id !== id).id); };
  const setTo = id => { setToId(id); if (id === fromId && members.length > 1) setFromId(members.find(m => m.id !== id).id); };

  const save = () => {
    if (!valid) return;
    onSave({ id: uid(), fromId, toId, amount: round2(amt), date: Date.now(), full });
  };

  const Row = ({ label, val, set }) => html`<div className="mb-2.5">
    <div className="text-[11px] font-bold uppercase tracking-[.13em] text-muted mb-1.5">${label}</div>
    <div className="flex flex-wrap gap-2">
      ${members.map(m => html`<button key=${m.id} onClick=${() => set(m.id)}
        className=${'flex items-center gap-2 rounded-full border pl-1 pr-3 py-1 transition ' + (val === m.id ? 'border-ink bg-paper' : 'border-line hover:border-muted')}>
        <${Avatar} m=${m} size=${24}/>
        <span className="text-[13px] font-semibold">${firstName(m.name)}</span>
      </button>`)}
    </div>
  </div>`;

  return html`<${Sheet} title="Settle up" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex items-center gap-2 bg-card">
      <button onClick=${onClose} className="rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <div className="flex-1"></div>
      <button onClick=${save} disabled=${!valid}
        className=${'rounded-full px-5 py-2.5 text-[13.5px] font-semibold transition active:scale-95 ' +
          (valid ? 'bg-sage text-paper hover:bg-sage-deep' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        Record payment
      </button>
    </div>`}>
    <div className="space-y-5">
      ${preset && html`<div className="flex items-center gap-2.5 bg-paper border border-line rounded-2xl px-3.5 py-2.5">
        <${Avatar} m=${byId[preset.from]} size=${26}/>
        <span className="text-[13px] flex-1">owes <span className="font-semibold">${(byId[preset.to] || {}).name || '?'}</span></span>
        <span className="numtab text-[13.5px] font-semibold">${fmt(preset.amount)}</span>
      </div>`}

      <div>
        <label className="lbl">Direction</label>
        <${Row} label="From (who paid)" val=${fromId} set=${setFrom}/>
        <${Row} label="To (who received)" val=${toId} set=${setTo}/>
      </div>

      <div>
        <label className="lbl">Amount</label>
        <div className="relative">
          <span className="absolute left-4 top-1/2 -translate-y-1/2 font-display text-[20px] font-semibold text-muted">₹</span>
          <input inputMode="decimal" className="inp !pl-9 font-display text-[22px] font-semibold numtab" placeholder="0"
            value=${amount} onChange=${e => setAmount(e.target.value.replace(/[^\d.]/g, ''))}/>
        </div>
        ${preset && html`<div className="mt-2 flex flex-wrap gap-1.5">
          <button onClick=${() => setAmount(String(round2(preset.amount / 2)))}
            className="text-[12px] font-semibold rounded-full border border-line px-2.5 py-1 text-muted hover:text-ink hover:border-muted transition">Half · ${fmt(round2(preset.amount / 2))}</button>
          <button onClick=${() => setAmount(String(preset.amount))}
            className="text-[12px] font-semibold rounded-full border border-line px-2.5 py-1 text-muted hover:text-ink hover:border-muted transition">Full · ${fmt(preset.amount)}</button>
        </div>`}
        ${preset && html`<p className="text-[12px] text-muted mt-2">${full ? 'This clears the debt completely.' : 'Recorded as a partial payment.'}</p>`}
      </div>
    </div>
  <//>`;
}

function GroupSheet({ group, onClose, onSaveGroup, onReset, onReplayTour, isDemo, isCreate, onSheet, onShare, onStopShare, onJoinOpen, onRestore, backupName }) {
  const [name, setName] = useState(isCreate ? 'My trip' : group.name);
  const [members, setMembers] = useState(isCreate ? [{ id: uid(), name: 'You', color: AV[0] }] : group.members);
  const [newName, setNewName] = useState('');
  const [sharing, setSharing] = useState(false);
  const [shareErr, setShareErr] = useState(false);
  const [copied, setCopied] = useState(false);

  const share = async () => {
    setSharing(true); setShareErr(false);
    try { await onShare(); } catch (e) { setShareErr(true); }
    setSharing(false);
  };
  const copyCode = () => {
    const c = group.shareCode && group.shareCode.code; if (!c) return;
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(c).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = c; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
  };

  const addMember = () => {
    const n = newName.trim(); if (!n) return;
    setMembers(ms => [...ms, { id: uid(), name: n, color: AV[ms.length % AV.length] }]);
    setNewName('');
  };
  const removeMember = id => { if (members.length > 2) setMembers(ms => ms.filter(m => m.id !== id)); };
  const save = () => onSaveGroup({ name: name.trim() || (isCreate ? 'My trip' : group.name), members });

  return html`<${Sheet} title=${isCreate ? 'Make your own trip' : 'Group settings'} onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Cancel</button>
      <button onClick=${save} className="flex-1 rounded-full bg-ink text-paper px-4 py-2.5 text-[13.5px] font-semibold hover:bg-ink/90 active:scale-95 transition">${isCreate ? 'Create trip' : 'Save changes'}</button>
    </div>`}>
    <div className="space-y-5">
      ${isCreate && html`<p className="text-[12px] text-muted leading-relaxed bg-paper border border-line rounded-xl px-3.5 py-2.5">Your current group and expenses stay untouched until you tap <span className="font-semibold text-ink">Create trip</span>.</p>`}
      <div>
        <label className="lbl">Group name</label>
        <input className="inp" value=${name} maxLength=${40} onChange=${e => setName(e.target.value)}/>

      <div>

function JoinSheet({ onClose, onJoin }) {
  const [code, setCode] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);
  const submit = async () => {
    if (!code.trim() || busy) return;
    setBusy(true); setErr(null);
    try { await onJoin(code); }
    catch (e) { setErr('No trip found for that code — double-check it and try again.'); setBusy(false); }
  };
  return html`<${Sheet} title="Join a shared trip" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">

    <div className="space-y-4">
      <p className="text-[12.5px] text-muted leading-relaxed">Ask the trip owner for their share code, paste it below, and this device joins the same record — expenses and settlements flow live, both ways.</p>
      <div>
        <label className="lbl">Trip code</label>
        <input className="inp font-mono tracking-[.18em] uppercase" placeholder="XXXX-XXXX" value=${code} maxLength=${16} spellCheck=${false}
          onChange=${e => setCode(e.target.value.toUpperCase())}

/* ---------------- splid chat ui ---------------- */

function ChatIdCopy({ id, big }) {
  const [copied, setCopied] = useState(false);
  const copy = () => {
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 1600); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(id).then(done, done);
    else {
      const ta = document.createElement('textarea');
      ta.value = id; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      ta.remove(); done();
    }
  };
  return html`<button onClick=${copy} aria-label="Copy Splid ID" title="Copy your ID"
    className="shrink-0 inline-flex items-center gap-2 bg-paper border border-line rounded-full pl-3.5 pr-1.5 py-1.5 hover:border-muted transition active:scale-95">
    <code className=${'font-mono font-bold tracking-[.12em] numtab ' + (big ? 'text-[15px]' : 'text-[12.5px]')}>${chunkCode(id)}</code>
    <span className=${'w-6 h-6 rounded-full flex items-center justify-center shrink-0 transition ' + (copied ? 'bg-sage text-paper' : 'bg-ink text-paper')}>
      <${Icon} name=${copied ? 'check' : 'copy'} size=${12} sw=${2.4}/>
    </span>
  </button>`;
}

function ChatOnboard({ onCreate }) {
  const [name, setName] = useState('');
  const [mode, setMode] = useState('auto');
  const [auto, setAuto] = useState(newChatId());
  const [custom, setCustom] = useState('');
  const [color, setColor] = useState(AV[Math.floor(Math.random() * AV.length)]);
  const [chk, setChk] = useState('idle');
  const [busy, setBusy] = useState(false);

  const idv = mode === 'auto' ? auto : normId(custom);
  const idOk = idv.length >= 3 && idv.length <= 14;

  useEffect(() => {
    if (!idOk) { setChk('idle'); return; }
    let live = true;
    setChk('checking');
    const t = setTimeout(async () => {
      const p = await fetchChatProfile(idv);
      if (live) setChk(p ? 'taken' : 'free');
    }, 650);
    return () => { live = false; clearTimeout(t); };
  }, [idv]);

  const canCreate = name.trim().length >= 1 && idOk && chk !== 'checking' && chk !== 'taken' && !busy;

  const create = async () => {
    if (!canCreate) return;
    setBusy(true);
    const res = await onCreate({ name, id: idv, color });
    if (res && res.taken) setChk('taken');
    setBusy(false);
  };

  return html`<div className="flex-1 overflow-y-auto flex items-start sm:items-center justify-center p-4">
    <div className="sheet-in w-full max-w-md bg-card border border-line rounded-3xl shadow-pop p-5 sm:p-6 my-4">
      <div className="flex flex-col items-center text-center">
        <span className="w-12 h-12 rounded-2xl bg-ink text-paper flex items-center justify-center shadow-soft">
          <${Icon} name="chat" size=${22}/>
        </span>
        <h2 className="font-display text-[22px] font-semibold mt-3 leading-tight">Make your Splid ID</h2>
        <p className="text-[13px] text-muted mt-1.5 leading-relaxed max-w-[300px]">One ID, all your chats. Add friends with their ID, they accept, and you talk — no phone number needed.</p>
      </div>

      <div className="mt-5">
        <label className="lbl">Your name</label>
        <input className="inp" placeholder="What should friends call you?" maxLength=${24} value=${name}
          onChange=${e => setName(e.target.value)}/>
      </div>

      <div className="mt-4">
        <div className="flex items-center justify-between mb-2">
          <label className="lbl" style=${{ marginBottom: 0 }}>Your ID</label>
          <div className="flex bg-paper border border-line rounded-full p-0.5 text-[11.5px] font-semibold">
            ${[['auto','Auto'],['custom','Pick my own']].map(([k, l]) => html`<button key=${k} onClick=${() => setMode(k)}
              className=${'px-2.5 py-1 rounded-full transition ' + (mode === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
          </div>
        </div>
        ${mode === 'auto' ? html`<div className="flex gap-2">
          <div className="inp flex items-center font-mono font-bold tracking-[.14em] text-[16px] numtab select-all">${chunkCode(auto)}</div>
          <button onClick=${() => setAuto(newChatId())} title="New random ID" aria-label="Shuffle ID"
            className="shrink-0 w-11 rounded-xl bg-paper border border-line text-muted hover:text-ink hover:border-muted flex items-center justify-center transition active:scale-95">
            <${Icon} name="replay" size=${16}/>
          </button>
        </div>`
        : html`<input className="inp font-mono font-bold tracking-[.14em] uppercase text-[16px]" placeholder="PICK-ANY-NAME" spellCheck=${false}
            maxLength=${14} value=${custom} onChange=${e => setCustom(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''))}/>`}
        <div className="mt-2 text-[12px] font-semibold flex items-center gap-1.5 min-h-[18px]">
          ${chk === 'checking' && html`<span className="w-1.5 h-1.5 rounded-full bg-sage live-dot"></span><span className="text-muted">Checking if it’s free…</span>`}
          ${chk === 'free' && idOk && html`<span className="w-1.5 h-1.5 rounded-full bg-sage"></span><span className="text-sage-deep">${chunkCode(idv)} is free — grab it!</span>`}
          ${chk === 'taken' && html`<span className="w-1.5 h-1.5 rounded-full bg-rust"></span><span className="text-rust-deep">Already taken — try another</span>`}
          ${chk === 'idle' && html`<span className="text-muted">${mode === 'custom' ? '3–14 letters & numbers' : 'Tap shuffle for a different ID'}</span>`}
        </div>
      </div>

      <div className="mt-4">
        <label className="lbl">Your color</label>
        <div className="flex flex-wrap gap-2">
          ${AV.map(c => html`<button key=${c} onClick=${() => setColor(c)} aria-label=${'Color ' + c}
            className=${'w-8 h-8 rounded-full transition active:scale-90 ' + (color === c ? 'ring-2 ring-offset-2 ring-ink ring-offset-card' : 'hover:scale-110')}
            style=${{ background: c }}></button>`)}
        </div>
      </div>

      <button onClick=${create} disabled=${!canCreate}
        className=${'mt-6 w-full rounded-full py-3 text-[14px] font-semibold transition active:scale-[.98] ' +
          (canCreate ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-ink/20 text-paper cursor-not-allowed')}>
        ${busy ? 'Creating your ID…' : 'Create my ID'}
      </button>
      <p className="text-[11px] text-muted mt-3 text-center leading-relaxed">Your ID is public so friends can find you — pick a name you’re happy to share. Chats stay stored only on this device.</p>
    </div>
  </div>`;
}

function ChatHome({ chat, api, onOpenThread, onAddFriend }) {
  const me = chat.me;
  const friends = Object.values(chat.friends || {});
  const reqsIn = Object.values(chat.reqsIn || {}).sort((a, b) => b.ts - a.ts);
  const reqsOut = Object.values(chat.reqsOut || {}).sort((a, b) => b.ts - a.ts);
  const lastOf = fid => { const a = (chat.threads || {})[fid] || []; return a[a.length - 1] || null; };
  const rows = friends.map(f => ({ f, last: lastOf(f.id), unread: (chat.unread || {})[f.id] || 0 }))
    .sort((a, b) => (b.last ? b.last.ts : (b.f.since || 0)) - (a.last ? a.last.ts : (a.f.since || 0)));
  const when = ts => new Date(ts).toDateString() === new Date().toDateString() ? timeLabel(ts) : dayLabel(ts);

  return html`<div className="flex-1 overflow-y-auto">
    <div className="max-w-3xl mx-auto px-4 sm:px-6 pt-5 pb-24">

      <div className="bg-card border border-line rounded-3xl shadow-soft p-4 sm:p-5 flex items-center gap-3.5">
        <${Avatar} m=${me} size=${48}/>
        <div className="flex-1 min-w-0">
          <div className="font-display text-[18px] font-semibold leading-tight truncate">${me.name}</div>
          <div className="text-[11px] font-bold tracking-[.14em] uppercase text-muted mt-0.5">My Splid ID</div>
        </div>
        <${ChatIdCopy} id=${me.id}/>
      </div>

      <button onClick=${onAddFriend} className="group w-full mt-4 flex items-center gap-3.5 rounded-3xl bg-ink text-paper px-4 sm:px-5 py-4 text-left shadow-pop transition hover:bg-[#1d1913] active:scale-[.99]">
        <span className="w-10 h-10 rounded-2xl bg-[#3DDC5C]/15 border border-[#3DDC5C]/30 text-[#3DDC5C] flex items-center justify-center shrink-0 transition-transform duration-300 group-hover:rotate-12">
          <${Icon} name="userPlus" size=${18}/>
        </span>
        <span className="flex-1 min-w-0">
          <span className="block font-display font-bold tracking-[.15em] text-[13.5px] uppercase leading-tight">Add a friend<span className="text-[#3DDC5C]">.</span></span>
          <span className="block text-[12px] text-paper/55 mt-1 leading-snug">Enter their Splid ID — they accept, and you can chat.</span>
        </span>
        <${Icon} name="arrR" size=${16} className="text-paper/45 shrink-0 transition-transform duration-200 group-hover:translate-x-0.5"/>
      </button>

      ${reqsIn.length > 0 && html`<div className="mt-6">
        <div className="flex items-center gap-3 mb-2.5">
          <span className="text-[11px] font-bold tracking-[.18em] uppercase text-muted">Requests · ${reqsIn.length}</span>
          <span className="h-px flex-1 bg-line"></span>
        </div>
        <div className="space-y-2">
          ${reqsIn.map((r, i) => html`<div key=${r.reqId} className="rise bg-card border border-line rounded-2xl px-3.5 py-3 flex items-center gap-3" style=${{ animationDelay: (i * 60) + 'ms' }}>
            <${Avatar} m=${{ name: r.from.name || '?', color: r.from.color || '#4283F2' }} size=${38}/>
            <div className="flex-1 min-w-0">
              <div className="text-[14px] font-semibold truncate">${r.from.name || 'Someone'}</div>
              <div className="text-[12px] text-muted numtab truncate">${chunkCode(r.from.id)} · wants to chat with you</div>
            </div>
            <button onClick=${() => api.acceptReq(r.reqId)} className="shrink-0 rounded-full bg-sage text-paper text-[12.5px] font-semibold px-3.5 py-2 hover:bg-sage-deep active:scale-95 transition">Accept</button>
            <button onClick=${() => api.declineReq(r.reqId)} aria-label="Decline request" className="shrink-0 rounded-full border border-line text-muted hover:text-rust hover:border-rust/40 text-[12.5px] font-semibold px-3 py-2 transition">Decline</button>
          </div>`)}
        </div>
      </div>`}

      ${reqsOut.length > 0 && html`<div className="mt-5">
        <div className="flex items-center gap-3 mb-2.5">
          <span className="text-[11px] font-bold tracking-[.18em] uppercase text-muted">Sent · waiting</span>
          <span className="h-px flex-1 bg-line"></span>
        </div>
        <div className="space-y-1.5">
          ${reqsOut.map(r => html`<div key=${r.reqId} className="bg-card border border-line rounded-2xl px-3.5 py-2.5 flex items-center gap-3">
            <${Avatar} m=${{ name: r.to.name || '?', color: r.to.color || '#4283F2' }} size=${30}/>
            <div className="flex-1 min-w-0 text-[13.5px] truncate">
              <span className="font-semibold">${r.to.name || r.to.id}</span>
              <span className="text-muted numtab text-[12px] ml-1.5">${chunkCode(r.to.id)}</span>
            </div>
            <span className="inline-flex items-center gap-1.5 text-[10.5px] font-bold tracking-[.12em] uppercase text-muted border border-line rounded-full px-2 py-1 shrink-0"><span className="w-1.5 h-1.5 rounded-full bg-muted live-dot"></span>Pending</span>
            <button onClick=${() => api.cancelReq(r.reqId)} aria-label="Cancel request" className="p-1.5 rounded-full text-muted hover:text-rust hover:bg-rust-tint transition shrink-0"><${Icon} name="x" size=${14}/></button>

        : html`<div className="bg-card border border-line rounded-3xl shadow-soft overflow-hidden divide-y divide-line">
          ${rows.map(({ f, last, unread }) => html`<button key=${f.id} onClick=${() => onOpenThread(f.id)}
            className="w-full flex items-center gap-3 px-4 py-3 hover:bg-paper/70 transition text-left">
            <span className="relative shrink-0">
              <${Avatar} m=${f} size=${40}/>
              <span className=${'absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-card ' + (api.presence[f.id] ? 'bg-sage' : 'bg-muted/40')}></span>
            </span>
            <span className="flex-1 min-w-0">
              <span className="block text-[14px] font-semibold truncate">${f.name}</span>
              <span className=${'block text-[12.5px] truncate ' + (unread > 0 ? 'text-ink font-semibold' : 'text-muted')}>
                ${(api.typing[f.id] || 0) > Date.now() ? 'typing…' : last ? (last.mine ? 'You: ' : '') + last.text : 'Say hi — no messages yet'}

              <span className="text-[11px] text-muted numtab">${last ? when(last.ts) : ''}</span>
              ${unread > 0 && html`<span className="min-w-[18px] h-[18px] px-1.5 rounded-full bg-rust text-paper text-[10px] font-bold flex items-center justify-center numtab">${unread > 9 ? '9+' : unread}</span>`}
            </span>
          </button>`)}
        </div>`}
      </div>

    </div>
  </div>`;
}

const ADDFRIEND_ERRS = {
  self: 'That’s your own ID — share it with a friend instead!',
  already: 'You two are already friends — start chatting!',
  pending: 'Request already sent — waiting for them to accept.',
  incoming: 'They already sent you a request — accept it from your requests list.',
  notfound: 'No Splid ID found for that code — double-check it, or ask them to open Splid Chat once.',
  offline: 'Couldn’t reach the chat network — check your internet and try again.',
  bad: 'Enter an ID of 3–14 letters or numbers.',
};

function AddFriendSheet({ onClose, onSend }) {
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  const clean = normId(val);
  const submit = async () => {
    if (busy) return;
    if (!clean) { setMsg({ kind: 'err', text: ADDFRIEND_ERRS.bad }); return; }
    setBusy(true); setMsg(null);
    try {
      const p = await onSend(clean);
      setMsg({ kind: 'ok', text: 'Request sent to ' + (p && p.name ? p.name : chunkCode(clean)) + ' — you’ll see them here once they accept.' });
      setVal('');
    } catch (e) { setMsg({ kind: 'err', text: ADDFRIEND_ERRS[e] || ADDFRIEND_ERRS.offline }); }
    setBusy(false);
  };
  return html`<${Sheet} title="Add a friend" onClose=${onClose}
    footer=${html`<div className="shrink-0 border-t border-line px-5 py-3.5 flex gap-2 bg-card">
      <button onClick=${onClose} className="flex-1 rounded-full border border-line px-4 py-2.5 text-[13.5px] font-semibold hover:border-muted transition">Close</button>

    </div>`}>

    </div>
  <//>`;
}

function ChatThread({ peer, chat, api, onBack }) {
  const msgs = (chat.threads || {})[peer.id] || [];
  const seen = (chat.seenUpto || {})[peer.id] || 0;
  const typingNow = (api.typing[peer.id] || 0) > Date.now();
  const [text, setText] = useState('');
  const [confirmDel, setConfirmDel] = useState(false);
  const scRef = useRef(null);
  const inputRef = useRef(null);

  useEffect(() => { const el = scRef.current; if (el) el.scrollTop = el.scrollHeight; }, [msgs.length, typingNow]);
  useEffect(() => { api.markRead(peer.id); if (inputRef.current && window.innerWidth > 640) inputRef.current.focus(); }, [peer.id]);
  useEffect(() => {
    if (!confirmDel) return;
    const t = setTimeout(() => setConfirmDel(false), 2600);
    return () => clearTimeout(t);
  }, [confirmDel]);

  const send = () => {
    const t = text.trim(); if (!t) return;
    setText('');
    api.sendMsg(peer.id, t);
    if (inputRef.current) inputRef.current.focus();
  };

  const groups = [];
  msgs.forEach(m => {
    const lab = dayLabel(m.ts);
    let g = groups[groups.length - 1];
    if (!g || g.label !== lab) { g = { label: lab, items: [] }; groups.push(g); }
    g.items.push(m);
  });

  return html`<div className="flex-1 flex flex-col min-h-0">
    <div className="shrink-0 border-b border-line bg-paper/90 backdrop-blur-md">
      <div className="max-w-3xl mx-auto px-3 sm:px-6 h-[60px] flex items-center gap-2.5">
        <button onClick=${onBack} aria-label="Back to chats" className="p-2 -ml-1 rounded-full text-muted hover:bg-card hover:text-ink transition"><${Icon} name="left" size=${18}/></button>
        <span className="relative shrink-0">
          <${Avatar} m=${peer} size=${34}/>
          <span className=${'absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full border-2 border-paper ' + (api.presence[peer.id] ? 'bg-sage' : 'bg-muted/40')}></span>
        </span>
        <div className="flex-1 min-w-0">
          <div className="text-[14.5px] font-semibold truncate leading-tight">${peer.name}</div>
          <div className=${'text-[11.5px] font-semibold truncate numtab ' + (typingNow || api.presence[peer.id] ? 'text-sage-deep' : 'text-muted')}>
            ${typingNow ? 'typing…' : api.presence[peer.id] ? 'online' : chunkCode(peer.id)}
          </div>
        </div>
        <button onClick=${() => { if (confirmDel) { api.unfriend(peer.id); onBack(); } else setConfirmDel(true); }} aria-label="Remove friend"
          title=${confirmDel ? 'Tap again to remove' : 'Remove friend'}
          className=${'p-2 rounded-full transition shrink-0 ' + (confirmDel ? 'bg-rust text-paper' : 'text-muted hover:text-rust hover:bg-rust-tint')}>
          <${Icon} name="trash" size=${15}/>
        </button>
      </div>
    </div>

    <div ref=${scRef} className="flex-1 overflow-y-auto px-3 sm:px-6 py-4">
      <div className="max-w-3xl mx-auto">
        ${msgs.length === 0 && html`<div className="flex flex-col items-center justify-center text-center gap-2 pt-16">
          <span className="w-11 h-11 rounded-full bg-card border border-line flex items-center justify-center text-muted"><${Icon} name="sparkle" size=${19}/></span>
          <div className="text-[14px] font-semibold">You two are friends now</div>
          <div className="text-[12.5px] text-muted">Send the first message — say hi!</div>
        </div>`}
        ${groups.map(g => html`<div key=${g.label}>
          <div className="flex justify-center my-3.5"><span className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted bg-card border border-line rounded-full px-3 py-1">${g.label}</span></div>
          ${g.items.map(m => html`<div key=${m.id} className="msg-in flex mb-1.5 ${m.mine ? 'justify-end' : 'justify-start'}">
            <div className=${'max-w-[80%] sm:max-w-[68%] px-3.5 py-2 ' + (m.mine ? 'bg-ink text-paper rounded-2xl rounded-br-md' : 'bg-card border border-line text-ink rounded-2xl rounded-bl-md')}>
              <div className="text-[14px] leading-snug break-words whitespace-pre-wrap">${m.text}</div>
              <div className=${'mt-0.5 flex items-center justify-end gap-1 text-[10px] numtab ' + (m.mine ? 'text-paper/45' : 'text-muted')}>
                <span>${timeLabel(m.ts)}</span>
                ${m.mine && html`<span className="ml-0.5 inline-flex">${seen >= m.ts
                  ? html`<${Icon} name="checkCheck" size=${13} sw=${2.4} className="text-[#3DDC5C]"/>`
                  : html`<${Icon} name="check" size=${11} sw=${2.8} className="opacity-70"/>`}</span>`}
              </div>
            </div>
          </div>`)}
        </div>`)}
        ${typingNow && html`<div className="msg-in flex mb-1.5 justify-start">
          <div className="bg-card border border-line rounded-2xl rounded-bl-md px-3.5 py-2.5 flex items-center gap-1 text-muted">
            <span className="typ-dot"></span><span className="typ-dot"></span><span className="typ-dot"></span>
          </div>
        </div>`}
      </div>
    </div>

    <div className="shrink-0 border-t border-line bg-card/95 backdrop-blur-md">
      <div className="max-w-3xl mx-auto px-3 sm:px-6 py-3 flex items-center gap-2">
        <input ref=${inputRef} className="inp !rounded-full flex-1" placeholder="Message…" maxLength=${1000} value=${text}
          onChange=${e => { setText(e.target.value); api.pingTyping(peer.id); }}
          onKeyDown=${e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }}/>
        <button onClick=${send} disabled=${!text.trim()} aria-label="Send message"
          className=${'shrink-0 w-10 h-10 rounded-full flex items-center justify-center transition active:scale-90 ' + (text.trim() ? 'bg-ink text-paper hover:bg-ink/90' : 'bg-paper border border-line text-muted')}>
          <${Icon} name="send" size=${16} sw=${2.2}/>
        </button>
      </div>
    </div>
  </div>`;
}

  const peer = view !== 'home' ? ((chat.friends || {})[view] || null) : null;

              className="p-2 -ml-1.5 rounded-full text-muted hover:bg-card hover:text-ink transition"><${Icon} name=${view === 'home' ? 'x' : 'left'} size=${18}/></button>`

        <span className="inline-flex items-baseline rounded-lg bg-ink pl-2.5 pr-2 py-[7px] shrink-0 shadow-soft" aria-label="Splid Chat">
          <span className="font-display font-bold tracking-[.14em] text-[12.5px] leading-none text-paper uppercase">CHAT</span>
          <span className="ml-[2.5px] font-display font-bold text-[15px] leading-none text-[#3DDC5C]">.</span>

        <span className=${'inline-flex items-center gap-1.5 text-[9.5px] font-bold tracking-[.14em] uppercase rounded-full px-2 py-1 shrink-0 ' + (on ? 'bg-sage-tint text-sage-deep' : 'bg-card border border-line text-muted')}>
          <span className=${'w-1.5 h-1.5 rounded-full ' + (on ? 'bg-sage live-dot' : 'bg-muted')}></span>${on ? 'Live' : 'Offline'}

      ? html`<${ChatOnboard} onCreate=${api.createIdentity}/>`
      : peer
        ? html`<${ChatThread} key=${peer.id} peer=${peer} chat=${chat} api=${api} onBack=${() => setView('home')}/>`
        : html`<${ChatHome} chat=${chat} api=${api} onOpenThread=${id => setView(id)} onAddFriend=${() => setAddOpen(true)}/>`}

    ${addOpen && me && html`<${AddFriendSheet} onClose=${() => setAddOpen(false)} onSend=${api.sendFriendReq}/>`}
  </div>`;
}
