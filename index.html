<style>
  *{-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  html{color-scheme:light}
  :root{--c-paper:246 241 232;--c-card:252 249 243;--c-ink:38 34 27;--c-muted:125 116 99;--c-line:230 220 198;--c-rust:225 75 79;--c-rust-deep:185 53 57;--c-rust-tint:253 233 233;--c-sage:43 182 94;--c-sage-deep:29 138 72;--c-sage-tint:223 246 230}
  html.dark{--c-paper:24 21 17;--c-card:34 30 25;--c-ink:243 239 230;--c-muted:154 144 126;--c-line:61 54 44;--c-rust:238 96 100;--c-rust-deep:246 126 130;--c-rust-tint:66 30 33;--c-sage:58 199 112;--c-sage-deep:110 220 158;--c-sage-tint:23 56 35;color-scheme:dark}
  html.dark .dotbg{background-image:radial-gradient(rgba(243,239,230,.12) 1.2px,transparent 1.2px)}
  html.dark .bg-ink\/40{background-color:rgba(10,8,6,.55)!important}
  ::selection{background:rgb(var(--c-ink));color:rgb(var(--c-paper))}
  .dotbg{
    background-color:rgb(var(--c-paper));
    background-image:radial-gradient(rgba(38,34,27,.12) 1.2px,transparent 1.2px);
    background-size:22px 22px;
  }
  @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .live-dot{animation:livePulse 1.6s ease-in-out infinite}
  .numtab{font-variant-numeric:tabular-nums lining-nums}
  .font-display{font-optical-sizing:auto}
  .theme-seg{display:flex;gap:4px;background:rgb(var(--c-paper));border:1px solid rgb(var(--c-line));border-radius:14px;padding:4px}
  .theme-seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;color:rgb(var(--c-muted));transition:all .18s}
  .theme-seg button.on{background:rgb(var(--c-ink));color:rgb(var(--c-paper));box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--c-muted));margin-bottom:8px}
  .inp{width:100%;background:rgb(var(--c-paper));border:1px solid rgb(var(--c-line));border-radius:12px;padding:10px 14px;font-size:15px;font-weight:500;outline:none;transition:border-color .2s}
  .inp:focus{border-color:rgb(var(--c-ink))}
  .inp::placeholder{color:rgb(var(--c-muted));opacity:.75}

  @keyframes sheetUp{from{transform:translateY(48px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .sheet-in{animation:sheetUp .36s cubic-bezier(.32,.72,.24,1) both}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .backdrop-in{animation:fadeIn .22s ease both}
  @keyframes barUp{from{transform:scaleY(.03)}to{transform:scaleY(1)}}
  .bar-up{transform-origin:bottom;animation:barUp .65s cubic-bezier(.22,.9,.3,1) both}
  @keyframes donutIn{from{transform:scale(.82) rotate(-10deg);opacity:0}60%{transform:scale(1.03) rotate(2deg);opacity:1}to{transform:scale(1) rotate(0)}}
  .donut-in{animation:donutIn .5s cubic-bezier(.34,1.3,.5,1) both}
  @keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
  .rise{animation:rise .45s cubic-bezier(.22,.9,.3,1) both}

  @keyframes ppDrop{0%{transform:translateY(-12px) scale(.3) rotate(-24deg);opacity:0}62%{transform:translateY(2px) scale(1.1) rotate(3deg);opacity:1}100%{transform:translateY(0) scale(1) rotate(0)}}
  .pp-face{animation:ppDrop .5s cubic-bezier(.34,1.56,.64,1) both;transition:left .32s cubic-bezier(.22,.9,.3,1)}
  .pp-rail{transition:width .32s cubic-bezier(.22,.9,.3,1)}
  @keyframes ppCardIn{0%{transform:scale(.88,.72);opacity:0}62%{transform:scale(1.015,1.008);opacity:1}100%{transform:scale(1,1)}}
  .pp-card{transform-origin:top left;animation:ppCardIn .4s cubic-bezier(.34,1.3,.5,1) both}
  @keyframes ppRowIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
  .pp-row-in{animation:ppRowIn .38s cubic-bezier(.22,.9,.3,1) both}
  @keyframes ppTickIn{0%{transform:scale(.3);opacity:0}68%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
  .pp-tick{display:inline-flex;animation:ppTickIn .34s cubic-bezier(.34,1.56,.64,1) both}
  @keyframes toastIn{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
  .toast-in{animation:toastIn .32s cubic-bezier(.2,1.1,.4,1) both}
  @keyframes typDot{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-3px);opacity:1}}
  .typ-dot{width:5px;height:5px;border-radius:50%;background:currentColor;animation:typDot 1.15s ease-in-out infinite}
  .typ-dot:nth-child(2){animation-delay:.15s}
  .typ-dot:nth-child(3){animation-delay:.3s}

  input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:20px;cursor:pointer;width:100%}
  input[type=range]:disabled{opacity:.35;cursor:default}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:99px;background:rgb(var(--c-line))}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:rgb(var(--c-ink));border:2.5px solid rgb(var(--c-card));box-shadow:0 1px 3px rgba(0,0,0,.35);margin-top:-6.5px}
  input[type=range]::-moz-range-track{height:3px;border-radius:99px;background:rgb(var(--c-line))}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:rgb(var(--c-ink));border:2.5px solid rgb(var(--c-card));box-shadow:0 1px 3px rgba(0,0,0,.35)}

  /* ---- bill preview · receipt printed out of a billing machine ---- */

function Icon({ name, size=18, sw=2, className='' }) {
  if (!ICONS[name]) return null;
  return html`<svg width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
    strokeWidth=${sw} strokeLinecap="round" strokeLinejoin="round" className=${className} aria-hidden="true">
    ${ICONS[name].map((s, i) => s.t === 'p'
      ? html`<path key=${i} d=${s.d}/>`
      : html`<circle key=${i} cx=${s.cx} cy=${s.cy} r=${s.r}/>`)}
  </svg>`;
}

function fmt(n) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return new Intl.NumberFormat('en-IN', {
    style:'currency', currency:'INR',
    minimumFractionDigits: Number.isInteger(v) ? 0 : 2,
    maximumFractionDigits: 2,
  }).format(v);
}
const round2 = n => Math.round(n * 100) / 100;
const firstName = n => (n || '?').trim().split(/\s+/)[0];

function equalShares(amount, ids) {
  const p = Math.round(amount * 100), n = ids.length || 1;
  const base = Math.floor(p / n), rem = p - base * n;
  const o = {};
  ids.forEach((id, i) => { o[id] = (base + (i < rem ? 1 : 0)) / 100; });
  return o;
}

function dayLabel(ts) {
  const d = new Date(ts), t = new Date();
  const same = (a, b) => a.toDateString() === b.toDateString();
  if (same(d, t)) return 'Today';
  if (same(d, new Date(t.getTime() - 864e5))) return 'Yesterday';
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short' })
    + (d.getFullYear() !== t.getFullYear() ? ' ' + d.getFullYear() : '');
}
const timeLabel = ts => new Date(ts).toLocaleTimeString('en-IN', { hour:'numeric', minute:'2-digit' });

/* ---------------- money math ---------------- */

function computePairwise(group) {
  const ids = group.members.map(m => m.id);
  const Pm = {};
  ids.forEach(a => { Pm[a] = {}; ids.forEach(b => { if (a !== b) Pm[a][b] = 0; }); });
  for (const e of group.expenses || []) {
    if (!Pm[e.payerId]) continue;
    for (const [uidv, sh] of Object.entries(e.splits || {})) {
      if (uidv !== e.payerId && Pm[uidv] && Pm[uidv][e.payerId] != null) {
        Pm[uidv][e.payerId] += Number(sh) || 0;
      }
    }
  }
  for (const s of group.settlements || []) {
    if (Pm[s.fromId] && Pm[s.fromId][s.toId] != null) Pm[s.fromId][s.toId] -= s.amount;
  }
  const edges = [];
  ids.forEach(a => ids.forEach(b => {
    if (a >= b) return;
    const v = Pm[a][b] - Pm[b][a];
    if (v > 0.005) edges.push({ from:a, to:b, amount: round2(v) });
    else if (v < -0.005) edges.push({ from:b, to:a, amount: round2(-v) });
  }));
  const net = {};
  ids.forEach(a => {
    let s = 0;
    ids.forEach(b => { if (a !== b) s += (Pm[b][a] || 0) - (Pm[a][b] || 0); });
    net[a] = round2(s);
  });
  return { edges, net };
}

/* Minimum-cash-flow greedy: repeatedly settle the biggest debtor against the biggest creditor */
function simplify(net) {
  const ds = [], cs = [];
  for (const id in net) {
    const v = Math.round(net[id] * 100);
    if (v > 0) cs.push({ id, amt: v });
    else if (v < 0) ds.push({ id, amt: -v });
  }
  ds.sort((a, b) => b.amt - a.amt);
  cs.sort((a, b) => b.amt - a.amt);
  const out = [];
  let i = 0, j = 0;
  while (i < ds.length && j < cs.length) {
    const amt = Math.min(ds[i].amt, cs[j].amt);
    out.push({ from: ds[i].id, to: cs[j].id, amount: amt / 100 });
    ds[i].amt -= amt; cs[j].amt -= amt;
    if (!ds[i].amt) i++;
    if (!cs[j].amt) j++;
  }
  return out;
}

function memberStat(group, id) {
  let paid = 0, share = 0;
  for (const e of group.expenses) {
    if (e.payerId === id) paid += e.amount;
    share += Number(e.splits && e.splits[id]) || 0;
  }
  return { paid, share };
}
function groupStats(g) {
  const total = g.expenses.reduce((s, e) => s + (+e.amount || 0), 0);
  const { edges } = computePairwise(g);
  return { total, debts: edges.length };
}

/* ---------------- trip sheet (excel export) ---------------- */

const sheetDate = ts => new Date(ts).toLocaleDateString('en-IN', { day:'2-digit', month:'short', year:'numeric' });

function buildTripAoas(group) {
  const { edges, net } = computePairwise(group);
  const byId = Object.fromEntries(group.members.map(m => [m.id, m]));
  const nm = id => (byId[id] && byId[id].name) || '?';
  const exps = [...group.expenses].sort((a, b) => b.date - a.date);
  const sets = [...(group.settlements || [])].sort((a, b) => b.date - a.date);
  const total = exps.reduce((s, e) => s + (+e.amount || 0), 0);
  const SPLIT_LBL = { equal:'Equal', custom:'Custom', pct:'Percentage' };

  /* sheet 1 — summary */
  const summary = [], numCells = [];
  const add = (arr, nums) => { const ri = summary.length; (nums || []).forEach(c => numCells.push([ri, c])); summary.push(arr); };
  add([(group.name || 'Trip').toUpperCase() + ' — TRIP SHEET']);
  add(['Full history record · auto-built from live trip data · made with Splid']);
  add(['Generated ' + sheetDate(Date.now()) + ' · ' + group.members.length + ' members · ' + exps.length + ' expenses · ' + sets.length + ' settlements']);
  add([]);
  add(['TOTAL SPEND', round2(total)], [1]);
  add(['OPEN DEBTS (PAIRWISE)', edges.length], [1]);
  add([]);
  add(['MEMBER', 'PAID (INR)', 'OWN SHARE (INR)', 'NET BALANCE (INR)', 'STATUS']);
  for (const m of group.members) {
    const st = memberStat(group, m.id);
    const n = round2(net[m.id] || 0);
    add([m.name, round2(st.paid), round2(st.share), n, n > 0.005 ? 'gets back' : n < -0.005 ? 'owes' : 'settled'], [1, 2, 3]);
  }
  add([]);
  add(['WHO OWES WHOM — SETTLE-UP PLAN']);
  const plan = simplify(net);
  if (plan.length) {
    add(['FROM', 'TO', 'AMOUNT (INR)']);
    for (const t of plan) add([nm(t.from), nm(t.to), round2(t.amount)], [2]);
  } else add(['Everyone is settled up.']);

  /* sheet 2 — expenses */
  const expenseRows = [['DATE', 'EXPENSE', 'CATEGORY', 'PAID BY', 'AMOUNT (INR)', 'SPLIT', 'SHARES DETAIL']];
  for (const e of exps) {
    const shares = Object.entries(e.splits || {})
      .filter(([, v]) => (+v || 0) > 0.004)
      .map(([id, v]) => firstName(byId[id] ? byId[id].name : '?') + ' ' + fmt(+v))
      .join(' · ');
    expenseRows.push([sheetDate(e.date), e.desc || 'Expense', (CATS[e.category] && CATS[e.category].label) || 'Misc',
      nm(e.payerId), round2(+e.amount || 0), SPLIT_LBL[e.splitType] || 'Custom', shares]);
  }
  expenseRows.push([]);
  expenseRows.push(['TOTAL', '', '', '', round2(total)]);

  /* sheet 3 — settlements */
  const settleRows = [['DATE', 'FROM (PAID)', 'TO (RECEIVED)', 'AMOUNT (INR)', 'TYPE']];
  if (!sets.length) settleRows.push(['No settlements recorded yet.']);
  for (const s of sets) settleRows.push([sheetDate(s.date), nm(s.fromId), nm(s.toId), round2(+s.amount || 0), s.full ? 'Full' : 'Part']);

  return { summary, numCells, expenseRows, settleRows };
}

function aoasToWorkbook(a) {
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.aoa_to_sheet(a.summary);
  ws1['!cols'] = [{ wch:30 }, { wch:15 }, { wch:17 }, { wch:19 }, { wch:12 }];
  ws1['!merges'] = [0, 1, 2].map(r => ({ s:{ r, c:0 }, e:{ r, c:4 } }));
  for (const [r, c] of a.numCells) {

  ws2['!cols'] = [{ wch:13 }, { wch:26 }, { wch:11 }, { wch:13 }, { wch:14 }, { wch:12 }, { wch:52 }];
  for (let r = 1; r < a.expenseRows.length; r++) {

  XLSX.utils.book_append_sheet(wb, ws3, 'Settlements');

}

function tripFileName(group, ext) {
  const safe = (group.name || 'trip').trim().replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'trip';
  return safe + '-sheet-' + new Date().toISOString().slice(0, 10) + '.' + ext;
}

async function downloadTripSheet(group, notify) {
  const a = buildTripAoas(group);
  const n = group.expenses.length;
  const okMsg = () => notify('Trip sheet downloaded · ' + (n === 1 ? '1 expense' : n + ' expenses'));
  try {
    /* 1 — styled xlsx via ExcelJS (colors + fonts) */
    if (typeof ExcelJS === 'undefined') throw new Error('exceljs-missing');
    const buf = await styledTripWorkbook(a).xlsx.writeBuffer();
    const el = document.createElement('a');
    el.href = URL.createObjectURL(new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
    el.download = tripFileName(group, 'xlsx');
    document.body.appendChild(el); el.click(); el.remove();
    okMsg();
  } catch (err) {
    try {
      /* 2 — plain xlsx via SheetJS if ExcelJS didn't load */
      if (typeof XLSX === 'undefined') throw new Error('xlsx-missing');
      XLSX.writeFile(aoasToWorkbook(a), tripFileName(group, 'xlsx'));
      okMsg();
    } catch (err2) {
      try {
        /* 3 — CSV last resort */
        const esc = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
        const lines = ['SUMMARY'];
        a.summary.forEach(r => lines.push(r.map(esc).join(',')));
        lines.push('', 'EXPENSES');
        a.expenseRows.forEach(r => lines.push(r.map(esc).join(',')));
        lines.push('', 'SETTLEMENTS');
        a.settleRows.forEach(r => lines.push(r.map(esc).join(',')));
        const el = document.createElement('a');
        el.href = URL.createObjectURL(new Blob(['\uFEFF' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' }));
        el.download = tripFileName(group, 'csv');
        document.body.appendChild(el); el.click(); el.remove();
        notify('Saved as CSV — Excel export needs internet once');
      } catch (err3) { notify('Could not build the sheet'); }
    }
  }
}

/* primary broker is the currently-healthier public one; identity lookups try both, in this order */
const MQTT_URL = 'wss://broker.hivemq.com:8884/mqtt';
const TOPIC_ROOT = 'splid/v1/';
const CODE_ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const chunkCode = c => String(c || '').replace(/(.{4})(?=.)/g, '$1-');
const newShareCode = () => Array.from({ length: 8 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join('');
const cleanCode = c => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const hashStr = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return h; };

/* one-shot connection to fetch the retained trip state for a code */
function fetchRetainedGroup(topic) {
  return new Promise((resolve, reject) => {
    let c;
    try { c = mqtt.connect(MQTT_URL, { clientId: 'splid-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 7000 }); }
    catch (e) { return reject(e); }
    let done = false;
    const finish = (fn, arg) => { if (done) return; done = true; clearTimeout(to); try { c.end(true); } catch (e) {} fn(arg); };
    const to = setTimeout(() => finish(reject, new Error('not-found')), 9000);
    c.on('connect', () => { c.subscribe(topic, { qos: 0 }); });
    c.on('message', (t, payload) => {
      try {
        const d = JSON.parse(payload.toString());
        if (d && d.app === 'splid' && !d.ended && d.group && Array.isArray(d.group.members)) finish(resolve, d.group);
        else finish(reject, new Error('bad-data'));
      } catch (e) { finish(reject, e); }
    });
    c.on('error', e => finish(reject, e));
  });
}

/* ---------------- splid chat · ids, friends & 1:1 messages ---------------- */

const CHAT_ROOT = 'splidchat/v1/';
const cTopic = (...p) => CHAT_ROOT + p.join('/');
const normId = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const tripInboxTopic = id => TOPIC_ROOT + 'in/' + normId(id).toLowerCase();   /* per-ID trip invites (add member by Splid ID) */
const EMAIL_TOPIC = id => TOPIC_ROOT + 'emails/' + normId(id).toLowerCase();   /* per-ID email handle — App Settings delivers here, owner devices read */
const EMAIL_WILD = TOPIC_ROOT + 'emails/+';   /* owner live feed: every email handle as it lands */
const EMAIL_SWEEP = TOPIC_ROOT + 'emails/#';  /* owner sweep: every retained handle, offline devices included */
const EMAILREG_KEY = 'hisaab.emailreg';       /* owner-side cache of collected email handles */
const EMAIL_PENDING_KEY = 'hisaab.email.pending';   /* set when a handle couldn't reach the network yet */
const JREQ_TOPIC = (id, reqId) => TOPIC_ROOT + 'jreq/' + normId(id).toLowerCase() + '/' + String(reqId || 'x').toLowerCase().replace(/[^a-z0-9]/g, '');   /* per-ID+request trip join request — the sender publishes here, the invited ID answers from App settings */
const JREQ_WILD = id => TOPIC_ROOT + 'jreq/' + normId(id).toLowerCase() + '/+';   /* every join request addressed to this ID */
const newChatId = () => Array.from({ length: 8 }, () => CODE_ABC[Math.floor(Math.random() * CODE_ABC.length)]).join('');

/* any ID from 3 to 14 letters/numbers works — shorter or longer than 8, it registers as-is and
   friends can find & request it. What you type is exactly what you get: no padding, no forced length. */
/* dice: a random ID grown from the chosen name — "Meera" → MEE482, ITSME7739, MECHAT42 … */
const idFromName = nm => {
  const base = normId(nm);
  if (base.length < 2) return newChatId();
  const digs = n => Array.from({ length: n }, () => String(Math.floor(Math.random() * 10))).join('');
  const pats = [
    () => base.slice(0, 3 + Math.floor(Math.random() * 3)) + digs(2 + Math.floor(Math.random() * 3)),          /* MEE + a few digits */
    () => 'ITS' + base.slice(0, 2 + Math.floor(Math.random() * 2)) + digs(2 + Math.floor(Math.random() * 3)),  /* ITSME + digits */
    () => base.slice(0, 2) + 'CHAT' + digs(1 + Math.floor(Math.random() * 3)),                                 /* MECHAT + digits */
  ];
  return pats[Math.floor(Math.random() * pats.length)]();
};
const freshChat = () => ({ me: null, friends: {}, reqsIn: {}, reqsOut: {}, threads: {}, unread: {}, seenUpto: {}, tripReqs: {}, tripReqDec: {} });

/* ---------------- splid vault — the device keyring that makes sign-in instant & offline-proof ----------------
   Every ID this device has ever created or signed into keeps its password proof (salt + hash) and a full
   local archive (friends, requests, chats) here — so signing in again NEVER depends on the network. */
const VAULT_KEY = 'hisaab.chat.vault';
const vaultAll = () => { try { const v = JSON.parse(localStorage.getItem(VAULT_KEY)); return v && typeof v === 'object' && !Array.isArray(v) ? v : {}; } catch (e) { return {}; } };
const vaultGet = id => vaultAll()[normId(id)] || null;
const vaultPut = (id, entry) => {
  try {
    const k = normId(id); if (!k) return;
    const all = vaultAll();
    all[k] = { ...(all[k] || {}), ...entry, id: k, savedAt: Date.now() };
    localStorage.setItem(VAULT_KEY, JSON.stringify(all));
  } catch (e) {}
};
const vaultDrop = id => { try { const all = vaultAll(); delete all[normId(id)]; localStorage.setItem(VAULT_KEY, JSON.stringify(all)); } catch (e) {} };
/* snapshot a chat state for the vault — threads capped so the keyring stays small */
const vaultPickState = c => {
  const cap = n => { const th = {}; Object.keys(c.threads || {}).forEach(k => { th[k] = (c.threads[k] || []).slice(-n); }); return th; };
  const base = { me: c.me, friends: c.friends || {}, reqsIn: c.reqsIn || {}, reqsOut: c.reqsOut || {}, threads: cap(60), unread: c.unread || {}, seenUpto: c.seenUpto || {}, updatedAt: Date.now() };
  try { if (JSON.stringify(base).length > 700000) base.threads = cap(25); } catch (e) {}
  try { if (JSON.stringify(base).length > 700000) base.threads = {}; } catch (e) {}
  return base;
};
const vaultArchive = (id, chatState) => { if (id && chatState && chatState.me) vaultPut(id, { archive: { at: Date.now(), state: vaultPickState(chatState) } }); };

/* ---------------- file attachments — any type, up to 200 MB, sent peer-to-peer ----------------
   MQTT (public broker) only carries the tiny metadata offer + WebRTC signaling.
   The actual bytes travel browser→browser over an RTCDataChannel, so 200 MB is no problem.
   Received blobs are kept in IndexedDB — localStorage is far too small for big files. */

const FILE_MAX = 200 * 1024 * 1024;
const prettyBytes = n => {
  n = +n || 0;
  if (n < 1024) return n + ' B';
  const u = ['KB', 'MB', 'GB']; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return (n >= 100 ? Math.round(n) : Math.round(n * 10) / 10) + ' ' + u[i];
};
const fileKindOf = (mime, name) => {
  const m = String(mime || ''), n = String(name || '').toLowerCase();
  if (/^image\//.test(m) || /\.(png|jpe?g|gif|webp|bmp|svg|heic|avif)$/.test(n)) return 'image';
  if (/^video\//.test(m) || /\.(mp4|mov|mkv|webm|avi|m4v)$/.test(n)) return 'video';
  if (/^audio\//.test(m) || /\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n)) return 'audio';
  if (/\.pdf$/.test(n) || m === 'application/pdf') return 'pdf';
  if (/\.(zip|rar|7z|tar|gz|bz2|xz)$/.test(n)) return 'zip';
  if (/\.(docx?|xlsx?|pptx?|csv|txt|md|pages)$/.test(n)) return 'doc';
  return 'file';
};

/* IndexedDB blob store with in-memory fallback (some contexts block IDB) */
const FILE_DB = 'splidchat-files';
let _fileDb = null;
const memFiles = new Map();
const idbRun = (mode, fn) => new Promise((res, rej) => {
  let done = false;
  const fail = e => { if (!done) { done = true; rej(e || new Error('idb')); } };
  try {
    if (typeof indexedDB === 'undefined') { fail(new Error('no-idb')); return; }
    const open = _fileDb ? Promise.resolve(_fileDb) : new Promise((res2, rej2) => {
      const rq = indexedDB.open(FILE_DB, 1);
      rq.onupgradeneeded = () => { try { rq.result.createObjectStore('files'); } catch (e) {} };
      rq.onsuccess = () => { _fileDb = rq.result; res2(rq.result); };
      rq.onerror = () => rej2(rq.error || new Error('idb'));
    });
    open.then(db => {
      let tx, rq2;
      try { tx = db.transaction('files', mode); rq2 = fn(tx.objectStore('files')); }
      catch (e) { fail(e); return; }
      tx.oncomplete = () => { if (!done) { done = true; res(rq2 ? rq2.result : undefined); } };
      tx.onerror = () => fail(tx.error);
      tx.onabort = () => fail(tx.error);
    }).catch(fail);
    setTimeout(() => fail(new Error('idb-timeout')), 20000);
  } catch (e) { fail(e); }
});

/* one retained-message pull with a short "absent" window — the primitive behind every lookup.
   Resolves { data, connected } so callers can tell "network down" from "truly not there". */
function pullRetained(topic, match, opts) {
  opts = opts || {};
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve({ data: null, connected: false }); return; }
    let c;
    try { c = mqtt.connect(opts.url || MQTT_URL, { clientId: 'splidp-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
    catch (e) { resolve({ data: null, connected: false }); return; }
    let done = false, sawConn = false, to = null, fast = null;
    const finish = v => { if (done) return; done = true; clearTimeout(to); clearTimeout(fast); try { c.end(true); } catch (e) {} resolve(v); };
    to = setTimeout(() => finish({ data: null, connected: sawConn }), opts.timeout || 5000);
    c.on('connect', () => {
      sawConn = true;
      try { c.subscribe(topic, { qos: 0 }); } catch (e) {}
      fast = setTimeout(() => finish({ data: null, connected: true }), opts.fastMs || 2600); // retained (or absence) resolves fast after connect
    });
    c.on('message', (t, payload) => {
      const s = payload.toString();
      if (!s) { finish({ data: null, connected: true }); return; }
      try { const d = JSON.parse(s); if (d && match(d)) finish({ data: d, connected: true }); } catch (e) {}
    });
    c.on('error', () => finish({ data: null, connected: sawConn }));
    c.on('close', () => { if (!done && sawConn) finish({ data: null, connected: true }); });
  });
}

/* owner directory scan — one-shot wildcard sweep across BOTH brokers: subscribe splidchat/v1/dir/+ AND
   splidchat/v1/profile/+ for a few seconds and collect every retained entry (retained messages are
   delivered on subscribe). Dir beacons carry the rich info (joined, friends count, online flag) but only
   exist for devices that have connected; retained profiles exist for EVERY ID ever registered on Splid —
   offline right now or never-beaconed alike — so merging both makes the list the whole registry, not just
   whoever happens to be online. Password proofs (salt/hash/dev) are stripped on sight, never surfaced. */
/* owner sweep for email handles — same pattern as scanDir: one wildcard over both brokers,
   every retained handle comes back, offline devices included */
function scanEmails(timeout) {
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve({}); return; }
    const acc = {};
    let pending = BROKERS.length;
    const oneDone = () => { pending--; if (pending <= 0) resolve(acc); };
    BROKERS.forEach(url => {
      let c;
      try { c = mqtt.connect(url, { clientId: 'splide-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
      catch (e) { oneDone(); return; }
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(to); try { c.end(true); } catch (e) {} oneDone(); };
      const to = setTimeout(finish, timeout || 5000);
      c.on('connect', () => { try { c.subscribe(EMAIL_SWEEP, { qos: 0 }); } catch (e) {} });
      c.on('message', (t, payload) => {
        const m = t.match(/^splid\/v1\/emails\/([a-z0-9]+)$/);
        if (!m) return;
        try { const d = JSON.parse(payload.toString()); if (d && d.type === 'email-reg' && d.email) acc[d.id || m[1].toUpperCase()] = d; } catch (e) {}
      });
      c.on('error', () => finish());
      c.on('close', () => finish());
    });
  });
}

function scanDir(timeout) {
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve({}); return; }
    const acc = {};
    let pending = BROKERS.length;
    const oneDone = () => { pending--; if (pending <= 0) resolve(acc); };
    BROKERS.forEach(url => {
      let c;
      try { c = mqtt.connect(url, { clientId: 'splidd-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
      catch (e) { oneDone(); return; }
      let done = false;
      const finish = () => { if (done) return; done = true; clearTimeout(to); try { c.end(true); } catch (e) {} oneDone(); };
      const to = setTimeout(finish, timeout || 5000);
      c.on('connect', () => {
        try { c.subscribe(DIR_WILD, { qos: 0 }); } catch (e) {}
        try { c.subscribe(PROFILE_WILD, { qos: 0 }); } catch (e) {}
      });
      c.on('message', (t, payload) => {
        const s = payload.toString(); if (!s) return;
        let m = t.match(/^splidchat\/v1\/dir\/([A-Z0-9]+)$/);
        if (m) {
          try { const d = JSON.parse(s); if (d && d.type === 'dir' && d.id === m[1]) acc[d.id] = { ...(acc[d.id] || {}), ...d }; } catch (e) {}
          return;
        }
        m = t.match(/^splidchat\/v1\/profile\/([A-Z0-9]+)$/);
        if (m) {
          try {
            const d = JSON.parse(s); const p = d && d.profile;
            if (p && p.id === m[1]) {
              const prev = acc[p.id] || {};   /* dir beacon (richer) wins; profile only backfills */
              acc[p.id] = { type: 'dir', id: p.id,
                name: prev.name || p.name || '', color: prev.color || p.color || '',
                pic: prev.pic !== undefined ? prev.pic : (p.pic || ''),
                joined: prev.joined, fr: prev.fr, on: prev.on,
                at: prev.at || d.updatedAt || 0 };
            }
          } catch (e) {}
        }
      });
      c.on('error', () => finish());
    });
  });

const BROKERS = [MQTT_URL, 'wss://broker.emqx.io:8084/mqtt'];
/* live handshake — when retained lookups come back empty (public brokers sometimes stop serving retained
   messages), ping splidchat/v1/need/<ID>: any ONLINE device that owns the ID answers with its profile or
   state over live delivery. Only helps while the owner is online somewhere — but that's the common case
   (signing in on a laptop while your phone still has the account open). */
function lookupLive(id, want, timeout) {
  return new Promise(resolve => {
    if (typeof mqtt === 'undefined') { resolve({ data: null, connected: false }); return; }
    let c;
    try { c = mqtt.connect(MQTT_URL, { clientId: 'splidn-' + uid(), keepalive: 20, reconnectPeriod: 0, connectTimeout: 6000 }); }
    catch (e) { resolve({ data: null, connected: false }); return; }
    let done = false, sawConn = false, to = null, rep1 = null, rep2 = null;
    const finish = v => { if (done) return; done = true; clearTimeout(to); clearTimeout(rep1); clearTimeout(rep2); try { c.end(true); } catch (e) {} resolve(v); };
    const matchProfile = d => d && d.app === 'splidchat' && d.profile && d.profile.id === id;
    const matchState = d => d && d.app === 'splidchat' && d.type === 'state' && d.state && d.state.me && d.state.me.id === id;
    to = setTimeout(() => finish({ data: null, connected: sawConn }), timeout || 4200);
    c.on('connect', () => {
      sawConn = true;
      try { c.subscribe(want === 'state' ? cTopic('state', id) : cTopic('profile', id), { qos: 0 }); } catch (e) {}
      const ping = () => { try { c.publish(cTopic('need', id), JSON.stringify({ app: 'splidchat', type: 'need', want, id, t: Date.now() }), { qos: 0 }); } catch (e) {} };
      ping(); rep1 = setTimeout(ping, 900); rep2 = setTimeout(ping, 2000);
    });
    c.on('message', (t, payload) => {
      const s = payload.toString(); if (!s) return;
      try { const d = JSON.parse(s); if ((want === 'state' && matchState(d)) || (want !== 'state' && matchProfile(d))) finish({ data: d, connected: true }); } catch (e) {}
    });
    c.on('error', () => finish({ data: null, connected: sawConn }));

/* sign-in identity chase — device vault is checked before this; here we chase the ID across two brokers and
   both retained topics, then a live handshake, before ever saying "not found". Offline stays distinguishable. */
async function lookupIdentity(id, onStep) {
  const tries = [
    { kind: 'profile', url: BROKERS[0] },
    { kind: 'profile', url: BROKERS[1] },
    { kind: 'state', url: BROKERS[0] },
    { kind: 'state', url: BROKERS[1] },
    { kind: 'live', want: 'profile' },
    { kind: 'live', want: 'state' },
  ];
  let connected = false, src = null, srcKind = null;
  for (let i = 0; i < tries.length && !src; i++) {
    const t = tries[i];
    if (onStep) { try { onStep(t.kind === 'live' ? 'live' : (t.kind === 'profile' ? 'lookup' : 'cloud')); } catch (e) {} }
    let r;
    if (t.kind === 'live') r = await lookupLive(id, t.want, 4200);
    else r = await pullRetained(
      cTopic(t.kind, id),
      t.kind === 'profile'
        ? d => d.app === 'splidchat' && d.profile && d.profile.id === id
        : d => d.app === 'splidchat' && d.type === 'state' && d.state && d.state.me && d.state.me.id === id,
      { url: t.url, timeout: i === 0 ? 6000 : 4600, fastMs: i === 0 ? 2600 : 2200 }
    );
    if (r.connected) connected = true;
    if (r.data) { src = t.kind === 'state' || (t.kind === 'live' && t.want === 'state') ? r.data.state : r.data.profile; srcKind = t.kind === 'live' && t.want === 'state' ? 'state' : t.kind; }
  }
  return { src, srcKind, connected };
}

/* SHA-256 hex, pure-JS fallback for contexts where crypto.subtle is unavailable (e.g. file://) */
function sha256Hex(str) {
  const maxWord = Math.pow(2, 32);
  let ascii;
  try { ascii = encodeURIComponent(String(str)).replace(/%([0-9A-F]{2})/g, (m, p) => String.fromCharCode(parseInt(p, 16))); }
  catch (e) { ascii = String(str); }
  const words = [];
  const asciiBitLength = ascii.length * 8;
  const hash = [], k = [];
  let primeCounter = 0;
  const isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++) {
    if (!isComposite[candidate]) {
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
      k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
    }
  }
  ascii += '\x80';
  while (ascii.length % 64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++) {
    const j = ascii.charCodeAt(i);
    if (j >> 8) return '';
    words[i >> 2] |= j << ((3 - i) % 4) * 8;
  }
  words[words.length] = (asciiBitLength / maxWord) | 0;
  words[words.length] = asciiBitLength;
  const rr = (v, a) => (v >>> a) | (v << (32 - a));
  for (let j0 = 0; j0 < words.length;) {
    const w = words.slice(j0, j0 += 16);
    const oldHash = hash.slice(0);
    const hh = hash.slice(0, 8);
    for (let i = 0; i < 64; i++) {
      const w15 = w[i - 15], w2 = w[i - 2];
      const a = hh[0], e = hh[4];
      const temp1 = hh[7]
        + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25))
        + ((e & hh[5]) ^ ((~e) & hh[6]))
        + k[i]
        + (w[i] = (i < 16) ? w[i] : (
          w[i - 16]
          + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3))
          + w[i - 7]
          + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))
        ) | 0);
      const temp2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hh[1]) ^ (a & hh[2]) ^ (hh[1] & hh[2]));
      hh.unshift((temp1 + temp2) | 0);
      hh[4] = (hh[4] + temp1) | 0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hh[i] + oldHash[i]) | 0;
  }
  let result = '';
  for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) {
    const b = (hash[i] >> (j * 8)) & 255;
    result += ((b < 16) ? 0 : '') + b.toString(16);
  }
  return result;
}

/* salted password hash — prefers the platform WebCrypto, falls back to sha256Hex */
const sha256 = async s => {
  try {
    if (typeof crypto !== 'undefined' && crypto.subtle && crypto.subtle.digest) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(String(s)));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return sha256Hex(s);
};

/* read an image file → compact square-ish JPEG data URL (fits comfortably in MQTT payloads) */
const fileToPic = file => new Promise(resolve => {
  if (!file || !/^image\//.test(file.type || '')) { resolve(null); return; }
  const fr = new FileReader();
  fr.onerror = () => resolve(null);
  fr.onload = () => {
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try {
        const MAX = 256;
        let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        if (!w || !h) { resolve(null); return; }
        const sc = Math.min(1, MAX / Math.max(w, h));
        w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        let q = 0.72, url = cv.toDataURL('image/jpeg', q);
        while (url.length > 60000 && q > 0.4) { q -= 0.12; url = cv.toDataURL('image/jpeg', q); }
        resolve(url.length > 90000 ? null : url);
      } catch (e) { resolve(null); }
    };
    img.src = String(fr.result || '');
  };
  fr.readAsDataURL(file);
});

/* ---------------- tiny hooks ---------------- */

function useCountUp(target, dur = 700) {
  const [val, setVal] = useState(target);
  const fromRef = useRef(target);
  useEffect(() => {
    const from = fromRef.current, to = target;
    if (Math.abs(to - from) < 0.5) { fromRef.current = to; setVal(to); return; }
    let raf; const t0 = performance.now();
    const tick = t => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      const v = from + (to - from) * e;
      fromRef.current = v; setVal(v);
      if (p < 1) raf = requestAnimationFrame(tick); else fromRef.current = to;
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

/* ---- body scroll-lock counter ----

   unmount. The old "remember previous value, restore on close" pattern froze scrolling

let BODY_LOCKS = 0;
function bodyLock() { BODY_LOCKS += 1; document.body.style.overflow = 'hidden'; }
function bodyUnlock() {

}

    .filter(d => {
      const s = q.trim().toLowerCase();
      if (!s) return true;
      return (d.name || '').toLowerCase().indexOf(s) >= 0 || d.id.indexOf(normId(s)) >= 0;
    })
    .sort((a, b) => (onlineNow(b) ? 1 : 0) - (onlineNow(a) ? 1 : 0) || (b.at || 0) - (a.at || 0) || (a.name || '').localeCompare(b.name || ''));
  const liveIds = Object.values(dir || {}).filter(d => d && d.id && !removedMap[normId(d.id)]);
  const idCount = liveIds.length;
  const onlineCount = liveIds.filter(onlineNow).length;
  const myId = normId(me && me.id);

  const pickFile = e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    if (f.size > CREATOR_FILE_MAX) { setErr('That file is ' + fmtBytes(f.size) + ' — attachments are capped at 100 KB, because it rides inside one network message.'); return; }
    setErr(null); setFile(f);
  };

  const sendBc = async () => {
    if (busy) return;
    const t = text.trim();
    if (!t && !file) return;
    setBusy(true); setErr(null);
    let fin = null;
    if (file) {
      try { fin = { name: String(file.name).slice(0, 80), mime: file.type || '', size: file.size, data: await fileToB64(file) }; }
      catch (e) { setErr("Couldn't read that file — try another one."); setBusy(false); return; }
    }
    const payload = { app: 'splidchat', type: 'broadcast', bid: uid() + Date.now().toString(36), updatedAt: Date.now(),
      from: { id: me.id, name: me.name, color: me.color, pic: me.pic || '' },
      msg: { text: t.slice(0, BROADCAST_TEXT_MAX), file: fin, ts: Date.now() } };
    if (JSON.stringify(payload).length > 190000) { setErr('That attachment is too big for the network message — keep it under 100 KB.'); setBusy(false); return; }
    if (!publish(payload)) { setErr('Chat network is offline — connect first, then publish.'); setBusy(false); return; }
    setText(''); setFile(null); setBusy(false);
    notify('Broadcast sent to every Splid ID', 'send');
  };

  const clearBc = () => {
    if (busy) return;
    if (!publish(null)) { setErr('Chat network is offline — connect first, then try again.'); return; }
    setErr(null); notify('Broadcast removed everywhere', 'trash');
  };

  const doRescan = async () => {
    setScan('scanning');
    try { await onRescan(); } catch (e) {}
    setScan('idle');
  };

  const rmLabel = rmArm && Date.now() - rmArm < 3000 ? 'Tap again to remove' : 'Remove broadcast';
  const ts = bc && bc.msg && bc.msg.ts ? new Date(bc.msg.ts).toLocaleString(undefined, { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' }) : '';

  return html`<section className="max-w-3xl mx-auto px-4 sm:px-6 mt-12" aria-label="Owner HQ">
    <div className="rounded-3xl border border-line bg-card shadow-soft overflow-hidden">
      <div className="bg-ink text-paper px-5 py-3.5 flex items-center gap-2.5">
        <${Icon} name="book" size=${15} sw=${2}/>
        <span className="font-display font-bold tracking-[.22em] text-[12px] uppercase">Owner HQ</span>
        <span className="ml-auto text-[10px] font-mono font-bold tracking-[.14em] text-paper/60 numtab">SPLID ID · ${chunkCode(me && isOwnerId(me.id) ? me.id : CREATOR_ID)}</span>
      </div>
      <div className="p-5">

        <div className="flex items-center gap-2.5 flex-wrap">
          <span className="rounded-full bg-sage-tint text-sage-deep text-[11px] font-bold tracking-[.1em] uppercase px-3 py-1.5 numtab">${idCount} ids on splid</span>
          <span className="rounded-full bg-sage-tint text-sage-deep text-[11px] font-bold tracking-[.1em] uppercase px-3 py-1.5 numtab inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-sage live-dot"></span>${onlineCount} online now</span>
          <button onClick=${doRescan} disabled=${scan === 'scanning'}
            className="ml-auto rounded-full border border-line bg-paper px-3.5 py-1.5 text-[12px] font-semibold inline-flex items-center gap-1.5 hover:border-muted transition active:scale-95 disabled:opacity-60">
            <${Icon} name="replay" size=${12} sw=${2.2}/>${scan === 'scanning' ? 'Scanning…' : 'Rescan'}
          </button>
        </div>

        <div className="mt-5 pt-4 border-t border-line">
          <div className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted mb-2.5 flex items-center gap-1.5"><${Icon} name="send" size=${11} sw=${2.4}/>Announce to every ID on Splid</div>
          ${bc && bc.msg && html`<div className="mb-3 rounded-2xl border border-line bg-paper px-3.5 py-3">
            <div className="text-[10px] font-bold tracking-[.14em] uppercase text-muted numtab">Live now · sent ${ts}</div>
            <p className="text-[13px] leading-relaxed mt-1.5 whitespace-pre-wrap">${bc.msg.text}</p>
            ${bc.msg.file && html`<p className="text-[11.5px] text-muted numtab mt-1.5">attached: ${bc.msg.file.name} (${fmtBytes(bc.msg.file.size)})</p>`}
          </div>`}
          <textarea className="inp resize-none" rows=${2} maxLength=${BROADCAST_TEXT_MAX} placeholder="A message that lands on every signed-in Splid app…"
            value=${text} onChange=${e => { setText(e.target.value); setErr(null); }}></textarea>
          <div className="mt-2.5 flex items-center gap-2 flex-wrap">
            <label className="cursor-pointer rounded-full border border-line bg-paper px-3.5 py-2 text-[12.5px] font-semibold inline-flex items-center gap-1.5 hover:border-muted transition active:scale-95">
              <${Icon} name="clip" size=${13} sw=${2.2}/>${file ? 'Swap file' : 'Attach a file'}
              <input type="file" className="hidden" onChange=${pickFile}/>
            </label>
            ${file && html`<span className="text-[12px] font-semibold text-ink inline-flex items-center gap-1.5 max-w-[250px] min-w-0">
              <${Icon} name="doc" size=${13} className="shrink-0"/>
              <span className="truncate">${file.name}</span>
              <span className="text-muted numtab shrink-0">· ${fmtBytes(file.size)}</span>
              <button onClick=${() => setFile(null)} className="text-muted hover:text-rust-deep shrink-0" aria-label="Remove file"><${Icon} name="x" size=${13}/></button>
            </span>`}
            <button onClick=${sendBc} disabled=${busy || (!text.trim() && !file)}
              className=${'ml-auto rounded-full px-4 py-2 text-[12.5px] font-semibold transition active:scale-95 inline-flex items-center gap-1.5 ' +
                (busy || (!text.trim() && !file) ? 'bg-ink/20 text-paper cursor-not-allowed' : 'bg-ink text-paper hover:bg-ink/90')}>
              <${Icon} name="send" size=${13} sw=${2.2}/>${busy ? 'Broadcasting…' : 'Broadcast to everyone'}
            </button>
            ${bc && html`<button onClick=${() => { if (rmArm && Date.now() - rmArm < 3000) { setRmArm(0); clearBc(); } else setRmArm(Date.now()); }} disabled=${busy}
              className="rounded-full border border-rust/30 text-rust-deep px-3.5 py-2 text-[12.5px] font-semibold hover:bg-rust-tint transition active:scale-95">${rmLabel}</button>`}
          </div>
          <p className="text-[11px] text-muted/70 mt-2 leading-relaxed">One retained network message — every person holding a Splid ID gets it at the top of their chat, with a chime, until they tap Got it. Files up to 100 KB ride inside the message itself.</p>
        </div>

        <div className="mt-5 pt-4 border-t border-line">
          <div className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted mb-2.5 flex items-center gap-1.5"><${Icon} name="users" size=${11} sw=${2.4}/>Every ID on Splid</div>
          <input className="inp mb-2.5" placeholder="Search name or ID…" value=${q} onChange=${e => setQ(e.target.value)} maxLength=${24}/>
          ${entries.length === 0 && html`<div className="text-[13px] text-muted py-2 leading-relaxed">${scan === 'scanning' ? 'Sweeping both brokers for every ID ever registered…' : 'No IDs found yet — hit Rescan to sweep the whole network, offline devices included.'}</div>`}
          <div className="space-y-2">
            ${entries.map(d => {
              const isMe = d.id === myId;
              const isFriend = !!(friends && friends[d.id]);
              const pending = Object.values(reqsOut || {}).some(r => r.to && r.to.id === d.id);
              const incoming = Object.values(reqsIn || {}).find(r => r.from && r.from.id === d.id);
              const fr = d.fr || 0;
              return html`<div key=${d.id} className=${'rounded-2xl border px-3.5 py-3 flex items-center gap-3 ' + (isMe ? 'border-ink/40 bg-ink/5' : 'border-line bg-paper')}>
                <${Avatar} m=${{ pic: d.pic, name: d.name || '?', color: d.color || '#4283F2' }} size=${38}/>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-[14px] font-semibold truncate">${d.name || 'Unnamed'}</span>
                    ${isMe && html`<span className="shrink-0 text-[9.5px] font-bold tracking-[.12em] uppercase rounded-full bg-ink text-paper px-2 py-0.5">owner</span>`}
                  </div>
                  <div className="text-[11.5px] text-muted numtab truncate">${chunkCode(d.id)}${d.fr != null ? ' · ' + fr + ' friend' + (fr === 1 ? '' : 's') : ''} · joined ${d.joined ? dayStamp(d.joined) : '—'}</div>
                  <div className=${'text-[11px] numtab mt-0.5 inline-flex items-center gap-1.5 ' + (onlineNow(d) ? 'text-sage-deep font-semibold' : 'text-muted')}>
                    <span className=${'w-1.5 h-1.5 rounded-full ' + (onlineNow(d) ? 'bg-sage live-dot' : 'bg-muted/50')}></span>${onlineNow(d) ? 'online now' : d.at ? 'last seen ' + ago(d.at) : 'last seen long ago'}
                  </div>
                </div>
                ${isMe ? null : html`<div className="shrink-0 flex items-center gap-1.5">
                  ${isFriend ? html`<button onClick=${() => onDM(d.id)} className="rounded-full bg-ink text-paper text-[12.5px] font-semibold px-3.5 py-2 hover:bg-ink/90 active:scale-95 transition inline-flex items-center gap-1.5"><${Icon} name="chat" size=${13}/>Chat</button>`
                  : incoming ? html`<button onClick=${() => onAccept(incoming.reqId)} className="rounded-full bg-sage text-paper text-[12.5px] font-semibold px-3.5 py-2 hover:bg-sage-deep active:scale-95 transition">Accept</button>`
                  : pending ? html`<span className="text-[12px] font-semibold text-muted numtab">Pending</span>`
                  : html`<button onClick=${() => onAddFriend(d.id)} className="rounded-full border border-line bg-card text-[12.5px] font-semibold px-3.5 py-2 hover:border-muted active:scale-95 transition inline-flex items-center gap-1.5"><${Icon} name="userPlus" size=${13}/>Add</button>`}
                  <button onClick=${() => setRmAuth({ id: d.id, name: d.name || '', pic: d.pic || '', color: d.color || '#4283F2' })}
                    aria-label="Remove this ID from Splid"
                    className="rounded-full border border-rust/30 text-rust-deep px-3 py-2 text-[12px] font-semibold hover:bg-rust-tint transition active:scale-95 inline-flex items-center gap-1">
                    <${Icon} name="trash" size=${12} sw=${2.2}/>Remove
                  </button>
                </div>`}
              </div>`;
            })}
          </div>
          <p className="text-[11px] text-muted/70 mt-3 leading-relaxed">The directory is the whole registry — every ID ever made on Splid, offline or not: ID, name, color, picture, joined date, friends count and last-seen, the same info the network already shares for adding friends. Passwords, requests and chats never leave their owners. As the owner you can remove any ID here — that erases its account from the whole network. Deleting an account takes two separate gates: first a confirmation of exactly what will be erased, then an authorization where you type the ID itself.</p>
        </div>

        <div className="mt-5 pt-4 border-t border-line">
          <div className="flex items-center gap-2 flex-wrap mb-2.5">
            <div className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted flex items-center gap-1.5"><${Icon} name="mail" size=${11} sw=${2.4}/>Emails of users</div>
            <span className="rounded-full bg-sage-tint text-sage-deep text-[11px] font-bold tracking-[.1em] uppercase px-3 py-1.5 numtab">${emailList.length} handle${emailList.length === 1 ? '' : 's'}</span>
            <button onClick=${sweepEmails} disabled=${emSweep === 'sweeping'}
              className="ml-auto rounded-full border border-line bg-paper px-3.5 py-1.5 text-[12px] font-semibold inline-flex items-center gap-1.5 hover:border-muted transition active:scale-95 disabled:opacity-60">
              <${Icon} name="replay" size=${12} sw=${2.2}/>${emSweep === 'sweeping' ? 'Sweeping…' : 'Sweep'}
            </button>
            ${emailList.length > 0 && html`<button onClick=${copyEmails}
              className="rounded-full bg-ink text-paper px-3.5 py-1.5 text-[12px] font-semibold inline-flex items-center gap-1.5 hover:bg-ink/90 transition active:scale-95">
              <${Icon} name="clip" size=${12} sw=${2.2}/>${emCopied ? 'Copied ✓' : 'Copy all'}
            </button>`}
          </div>
          <p className="text-[11.5px] text-muted leading-relaxed mb-3">Every handle saved under <span className="font-semibold text-ink">App settings → Email for updates</span> rides the Splid network straight to the owner ID <span className="font-semibold text-ink">DEVANSHU</span> and collects here — name, Splid ID and the email itself, live. Copy all grabs the whole list at once, ready to send anywhere.</p>
          ${emailList.length === 0 && html`<div className="text-[13px] text-muted py-2 leading-relaxed">No email handles yet — the moment anyone saves their email in App settings it lands here automatically. Sweep also picks up devices that are offline right now.</div>`}
          <div className="space-y-2">
            ${emailList.map(d => html`<div key=${(d.id || '?') + '|' + d.email} className="rounded-2xl border border-line bg-paper px-3.5 py-3 flex items-center gap-3">
              <span className="w-9 h-9 rounded-full bg-ink/5 border border-line text-ink flex items-center justify-center shrink-0"><${Icon} name="mail" size=${14} sw=${2}/></span>
              <div className="flex-1 min-w-0">
                <div className="text-[13.5px] font-semibold truncate">${d.name || 'Unnamed'}${d.id ? html` <span className="text-[10px] font-mono font-bold tracking-[.08em] text-muted numtab">· ${chunkCode(d.id)}</span>` : null}</div>
                <div className="text-[12.5px] text-ink numtab truncate">${d.email}</div>
              </div>
              <span className="shrink-0 text-[10.5px] text-muted numtab">${d.at ? dayStamp(d.at) : ''}</span>
            </div>`)}
          </div>
        </div>

        ${Object.keys(removedMap).length > 0 && html`<div className="mt-5 pt-4 border-t border-line">
          <div className="text-[10.5px] font-bold tracking-[.16em] uppercase text-muted mb-2.5 flex items-center gap-1.5"><${Icon} name="trash" size=${11} sw=${2.4}/>Removed IDs</div>
          <div className="space-y-2">
            ${Object.values(removedMap).sort((a, b) => (b.ts || 0) - (a.ts || 0)).map(d => html`<div key=${d.id} className="rounded-2xl border border-rust/25 bg-rust-tint/40 px-3.5 py-3 flex items-center gap-3">
              <span className="w-9 h-9 rounded-full bg-rust/15 text-rust-deep flex items-center justify-center shrink-0"><${Icon} name="trash" size=${14} sw=${2.2}/></span>
              <div className="flex-1 min-w-0">
                <div className="text-[13.5px] font-semibold numtab">${chunkCode(d.id)}</div>
                <div className="text-[11.5px] text-muted numtab truncate">${(d.name ? d.name + ' · ' : '') + 'removed ' + (d.ts ? dayStamp(d.ts) : '')}</div>
              </div>
              <button onClick=${() => onRestore(d.id)} className="shrink-0 rounded-full border border-line bg-card text-[12.5px] font-semibold px-3.5 py-2 hover:border-muted active:scale-95 transition inline-flex items-center gap-1.5"><${Icon} name="replay" size=${13} sw=${2.2}/>Restore</button>
            </div>`)}
          </div>
          <p className="text-[11px] text-muted/70 mt-3 leading-relaxed">Removing an ID wiped its profile, cloud state and inbox everywhere and signed its devices out. Restore only frees the ID for a fresh start — old data can’t come back.</p>
        </div>`}

        ${rmAuth && html`<${OwnerRemoveGate} target=${rmAuth} onClose=${() => setRmAuth(null)}
          onAuthorize=${() => { const t = rmAuth; setRmAuth(null); onRemove(t.id); }}/>`}
        ${err && html`<p className="mt-3 rounded-2xl px-3.5 py-2.5 text-[12.5px] font-semibold leading-relaxed bg-rust-tint text-rust-deep border border-rust/25">${err}</p>`}
        ${!chatOn && html`<p className="mt-2 text-[11.5px] font-semibold text-rust-deep">Chat network is offline — open Splid Chat once to connect; Rescan works anyway.</p>`}
      </div>
    </div>
  </section>`;
}

/* ---------------- guided tour (coach marks) ---------------- */

const TOUR_STEPS = [
  { target:'tour-graph', title:"Total spend, at a glance", body:"Every bar is a day of this trip, stacked by category — tap any bar for its breakdown. Flip to the 3D view to see the whole trip split by category." },
  { target:'tour-toggle', title:"Direct vs Simplified", body:"\u201CDirect\u201D shows real person-to-person debts. \u201CSimplified\u201D computes the fewest payments that clear everything." },
  { target:'tour-settle', title:"Settle up in one tap", body:"When someone pays you back, record it — fully or partially. The graph, balances and history update instantly." },
  { target:'tour-add', title:"Three taps to log an expense", body:"Amount \u2192 who paid \u2192 Add. Equal split is the default; switch to sliders or percentages anytime." },
  { target:'tour-activity', title:"A story, not a spreadsheet", body:"Expenses and settlements stream in chronologically. Tap any entry to see the exact split — or edit it." },
  { target:'tour-chat', title:"Chat with your crew", body:"Tap the chat bubble to sign in with your Splid ID — one ID works on every device, so never make a second one. New here? Making one takes a tap. Add friends by their ID; once they accept, you can talk one-on-one." },
  { title:"Make it yours", body:"Everything you see lives on this device until you go live. When you\u2019re ready, wipe it and set up your own group — everything is editable: rename, members, expenses, settlements.", final:true },
];

function Tour({ steps, onFinish, onFinal }) {
  const [i, setI] = useState(0);
  const [rect, setRect] = useState(null);
  const [cardPos, setCardPos] = useState(null);
  const cardRef = useRef(null);
  const step = steps[i];
  const last = i === steps.length - 1;

  const measureNow = () => {
    const el = step.target ? document.getElementById(step.target) : null;
    if (!el) { setRect(null); return; }
    const r = el.getBoundingClientRect();
    setRect({ top: r.top - 10, left: r.left - 10, width: r.width + 20, height: r.height + 20 });
  };

  useEffect(() => {
    const el = step.target ? document.getElementById(step.target) : null;
    if (!el) { setRect(null); return; }
    el.scrollIntoView({ block:'center', behavior:'smooth' });
    const t1 = setTimeout(measureNow, 430);
    let raf = 0;
    const onScroll = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(measureNow); };
    window.addEventListener('scroll', onScroll, true);
    window.addEventListener('resize', onScroll);
    return () => { clearTimeout(t1); cancelAnimationFrame(raf); window.removeEventListener('scroll', onScroll, true); window.removeEventListener('resize', onScroll); };
  }, [i]);

  useLayoutEffect(() => {
    const c = cardRef.current; if (!c) return;
    const cr = c.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const W = cr.width, H = cr.height;
    let top, left;
    if (!rect) { top = (vh - H) / 2; left = (vw - W) / 2; }
    else {
      const below = rect.top + rect.height + 14;
      const above = rect.top - H - 14;
      top = (below + H < vh - 12) ? below : (above > 12 ? above : Math.max(12, Math.min(vh - H - 12, below)));
      left = Math.max(12, Math.min(vw - W - 12, rect.left + rect.width / 2 - W / 2));
    }
    setCardPos({ top, left });
  }, [i, rect]);

  useEffect(() => {
    const h = e => {
      if (e.key === 'Escape') onFinish();
      if (e.key === 'ArrowRight') setI(v => Math.min(v + 1, steps.length - 1));
      if (e.key === 'ArrowLeft') setI(v => Math.max(v - 1, 0));
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, []);

  const next = () => (i < steps.length - 1 ? setI(i + 1) : onFinish());

  return html`<div className="fixed inset-0 z-[80]">
    ${rect
      ? html`<div className="absolute pointer-events-none" style=${{
          top:rect.top, left:rect.left, width:rect.width, height:rect.height, borderRadius:18,
          boxShadow:'0 0 0 2px rgba(252,249,243,.85), 0 10px 44px rgba(38,34,27,.28), 0 0 0 9999px rgba(38,34,27,.48)',
          transition:'all .4s cubic-bezier(.22,.9,.3,1)' }}/>`
      : html`<div className="absolute inset-0 bg-ink/45 backdrop-in"></div>`}
    <div className="absolute inset-0" onClick=${last ? onFinish : next}></div>
    <div ref=${cardRef}
      className="absolute bg-card rounded-2xl shadow-pop border border-line p-4 sm:p-5"
      style=${{
        top: cardPos ? cardPos.top : -9999, left: cardPos ? cardPos.left : '50%',
        width: 'min(92vw, 350px)',
        opacity: cardPos ? 1 : 0,
        transition:'top .35s cubic-bezier(.22,.9,.3,1), left .35s cubic-bezier(.22,.9,.3,1), opacity .25s ease' }}>
      <div className="flex items-center justify-between mb-2">

/* ---------------- total spend chart · graph + 3D views ---------------- */

const CAT_BAR = {
  food: '#EE5458', travel: '#4283F2', stay: '#3FCE6E', misc: '#E95EC0',
};

const shade = (hex, k) => {
  const n = parseInt(hex.slice(1), 16);
  const f = c => Math.max(0, Math.min(255, Math.round(c * (1 + k))));
  return '#' + ((1 << 24) + (f(n >> 16) << 16) + (f((n >> 8) & 255) << 8) + f(n & 255)).toString(16).slice(1);
};

function SpendChart({ group }) {
  const [view, setView] = useState('graph');
  const [hot, setHot] = useState(null);
  const [hoverCat, setHoverCat] = useState(null);
  const H = 150;

  const data = useMemo(() => {
    const exps = group.expenses || [];
    const total = exps.reduce((s, e) => s + (+e.amount || 0), 0);
    const n = exps.length;
    if (!n) return { list: [], total, n, first: null, unit: 'day' };
    const t0 = new Date(); t0.setHours(0, 0, 0, 0);
    const today = t0.getTime();
    const day0 = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
    const firstD = day0(Math.min(...exps.map(e => e.date)));
    let unit = 'day', span = Math.round((today - firstD) / 864e5) + 1, start, size;
    if (span > 45) { unit = 'week'; size = 7 * 864e5; start = firstD; span = Math.floor((today - firstD) / size) + 1; }
    else { size = 864e5; span = Math.max(12, span); start = today - (span - 1) * size; }
    const arr = [];
    for (let i = 0; i < span; i++) arr.push({ start: start + i * size, total: 0, byCat: {} });
    for (const e of exps) {
      const ci = Math.min(span - 1, Math.max(0, Math.floor((e.date - start) / size)));
      const amt = +e.amount || 0;
      arr[ci].total += amt;
      const c = e.category || 'misc';
      arr[ci].byCat[c] = (arr[ci].byCat[c] || 0) + amt;
    }
    return { list: arr, total, n, first: firstD, unit };
  }, [group.expenses]);

  const list = data.list;
  const max = Math.max(1, ...list.map(d => d.total));
  const totalAnim = useCountUp(data.total);
  const fmtDay = ts => new Date(ts).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const isToday = ts => new Date(ts).toDateString() === new Date().toDateString();
  const axis = list.length ? [list[0].start, list[Math.floor((list.length - 1) / 2)].start, list[list.length - 1].start] : [];
  const cats = Object.keys(CAT_BAR)
    .map(c => ({ cat: c, value: (group.expenses || []).reduce((s, e) => s + ((e.category || 'misc') === c ? +e.amount || 0 : 0), 0) }))
    .filter(d => d.value > 0);
  const tipLabel = d => data.unit === 'day' ? dayLabel(d.start) : 'Week of ' + fmtDay(d.start);

  return html`<div>
    <div className="flex items-start justify-between gap-3 px-4 sm:px-5 pt-4">
      <div className="min-w-0">
        <div className="text-[11px] font-bold tracking-[.16em] uppercase text-muted">Total spend</div>
        <div className="text-[12.5px] text-muted mt-0.5 truncate">${group.name} · ${data.n ? 'since ' + fmtDay(data.first) : 'no expenses yet'}</div>
      </div>
      <div className="flex bg-paper border border-line rounded-full p-0.5 text-[12px] font-semibold shrink-0">
        ${[['graph', 'Graph'], ['donut', '3D']].map(([k, l]) => html`<button key=${k} onClick=${() => { setView(k); setHot(null); setHoverCat(null); }}
          className=${'px-3.5 py-1.5 rounded-full transition ' + (view === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
      </div>
    </div>

    <div className="px-4 sm:px-5 pt-3">
      <div className="font-display text-[36px] sm:text-[42px] font-semibold numtab leading-none tracking-tight">${fmt(Math.round(totalAnim))}</div>
      <div className="text-[12.5px] text-muted mt-2 numtab">
        ${data.n === 0 ? 'add your first expense to see it here' : `${data.n} expense${data.n === 1 ? '' : 's'} on this trip`}
      </div>
    </div>

    ${data.n === 0
      ? html`<div className="h-[148px] mx-1 flex flex-col items-center justify-center gap-1.5 text-center">
          <span className="w-9 h-9 rounded-full bg-paper border border-line flex items-center justify-center text-muted"><${Icon} name="wallet" size=${16}/></span>
          <span className="text-[13px] font-semibold text-muted">Nothing spent yet</span>
          <span className="text-[12px] text-muted/75">Log an expense to see the bars light up.</span>
        </div>`
      : view === 'graph'
        ? html`<div className="px-2 sm:px-3 pt-4">
            <div className="relative flex items-end" style=${{ height: H }}>
              ${list.map((d, i) => {
                const hPct = d.total > 0 ? Math.max(7, d.total / max * 100) : 0;
                const active = hot === i;
                return html`<div key=${i}
                  className=${'relative flex-1 h-full flex items-end justify-center ' + (d.total > 0 ? 'cursor-pointer' : 'cursor-default')}
                  onMouseEnter=${() => { if (d.total > 0) setHot(i); }}
                  onMouseLeave=${() => { if (active) setHot(null); }}
                  onClick=${() => { if (d.total > 0) setHot(active ? null : i); }}>
                  ${d.total > 0
                    ? html`<div key=${'b' + i} className="bar-up overflow-hidden rounded-full flex flex-col-reverse"
                        style=${{ height: hPct + '%', width: 'min(58%, 24px)', animationDelay: (i * 26) + 'ms' }}>
                        ${Object.entries(d.byCat).map(([c, v]) => html`<div key=${c}
                          style=${{ flexGrow: v, flexBasis: 0, minHeight: 3, background: CAT_BAR[c] || CAT_BAR.misc }}/>`)}
                      </div>`
                    : html`<div className="rounded-full" style=${{ height: 5, width: 'min(58%, 24px)', background: 'rgb(var(--c-line))' }}/>`}
                  ${active && d.total > 0 && html`<div
                    className=${'absolute z-10 pointer-events-none backdrop-in ' +
                      (i < list.length * 0.18 ? 'left-0' : i > list.length * 0.82 ? 'right-0' : 'left-1/2 -translate-x-1/2')}
                    style=${{ bottom: `calc(${Math.min(hPct, 92)}% + 12px)` }}>
                    <div className="bg-ink text-paper rounded-2xl shadow-pop px-3 py-2.5 w-max max-w-[190px]">
                      <div className="flex items-baseline gap-2">
                        <span className="text-[10.5px] font-bold tracking-[.12em] uppercase text-paper/55">${tipLabel(d)}</span>
                        <span className="text-[13px] font-semibold numtab">${fmt(d.total)}</span>
                      </div>
                      <div className="mt-1.5 space-y-1 min-w-[122px]">
                        ${Object.entries(d.byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => html`<div key=${c} className="flex items-center gap-1.5 text-[11.5px]">
                          <span className="w-2 h-2 rounded-full shrink-0" style=${{ background: CAT_BAR[c] || CAT_BAR.misc }}/>
                          <span className="text-paper/75 truncate">${(CATS[c] || CATS.misc).label}</span>
                          <span className="ml-auto pl-3 font-semibold numtab">${fmt(v)}</span>
                        </div>`)}
                      </div>
                    </div>
                  </div>`}
                </div>`;
              })}
            </div>
            <div className="mt-2 border-t border-line pt-1.5 flex items-center justify-between text-[10.5px] font-semibold text-muted numtab">
              ${axis.map((ts, i) => html`<span key=${i}>${isToday(ts) && i === 2 ? 'Today' : fmtDay(ts)}</span>`)}
            </div>
          </div>`
        : html`<div className="flex flex-col items-center pt-3">
            <div className="relative donut-in">
              <svg viewBox="0 0 220 128" width="220" height="128" role="img" aria-label="Spend by category">
                <g transform="translate(110,58) scale(1,0.58)">
                  <g transform="rotate(-90)">
                    ${cats.map(s => {
                      const len = s.value / data.total * 100;
                      return html`<circle key=${'b' + s.cat} r="54" pathLength="100" fill="none"
                        stroke=${shade(CAT_BAR[s.cat] || CAT_BAR.misc, -0.3)} strokeWidth="30"
                        strokeDasharray=${(len - 0.8) + ' ' + (100 - len + 0.8)} strokeDashoffset=${-cats.slice(0, cats.indexOf(s)).reduce((a, x) => a + x.value / data.total * 100, 0)}
                        style=${{ opacity: hoverCat && hoverCat !== s.cat ? 0.35 : 1, transition: 'opacity .2s ease' }}/>`;
                    })}
                  </g>
                  <g transform="translate(0,-16) rotate(-90)">
                    ${cats.map(s => {
                      const len = s.value / data.total * 100;
                      return html`<circle key=${'t' + s.cat} r="54" pathLength="100" fill="none"
                        stroke=${CAT_BAR[s.cat] || CAT_BAR.misc} strokeWidth="30"
                        strokeDasharray=${(len - 0.8) + ' ' + (100 - len + 0.8)} strokeDashoffset=${-cats.slice(0, cats.indexOf(s)).reduce((a, x) => a + x.value / data.total * 100, 0)}
                        style=${{ opacity: hoverCat && hoverCat !== s.cat ? 0.45 : 1, transition: 'opacity .2s ease' }}/>`;
                    })}
                  </g>
                </g>
              </svg>
              <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none" style=${{ paddingBottom: 12 }}>
                <span className="text-[7.5px] font-bold tracking-[.2em] uppercase text-muted">Total</span>
                <span className="font-display text-[12.5px] font-semibold numtab leading-tight">${fmt(Math.round(data.total))}</span>
              </div>
            </div>
            <div className="w-full max-w-[300px] mt-2 space-y-0.5 px-2">
              ${cats.sort((a, b) => b.value - a.value).map((s, i) => html`<div key=${s.cat}
                className="rise flex items-center gap-2.5 rounded-xl px-2 py-1.5 cursor-default transition hover:bg-paper/70"
                style=${{ animationDelay: (i * 55) + 'ms' }}
                onMouseEnter=${() => setHoverCat(s.cat)} onMouseLeave=${() => setHoverCat(null)}>
                <span className="w-2.5 h-2.5 rounded-full shrink-0" style=${{ background: CAT_BAR[s.cat] || CAT_BAR.misc }}/>
                <span className="text-[13px] font-semibold">${(CATS[s.cat] || CATS.misc).label}</span>
                <span className="ml-auto text-[12px] text-muted numtab">${Math.round(s.value / data.total * 100)}%</span>
                <span className="text-[13px] font-semibold numtab w-[76px] text-right">${fmt(s.value)}</span>
              </div>`)}
            </div>
          </div>`}
  </div>`;
}

      <span className="flex-1 min-w-0">
        <span className="block font-display font-bold tracking-[.15em] text-[13px] uppercase leading-tight">Have a code? Join a shared trip<span className="text-sage">.</span></span>
        <span className="block text-[12px] text-muted mt-1 leading-snug">Paste a trip code from another device — expenses sync live, both ways.</span>
      </span>
      <${Icon} name="arrR" size=${16} className="text-muted/60 shrink-0 transition-transform duration-200 group-hover:translate-x-0.5"/>
    </button>
    <div id="tour-graph" className="bg-card border border-line rounded-3xl shadow-soft overflow-hidden">
      <${SpendChart} group=${group}/>

    <div className="mt-4 bg-card border border-line rounded-3xl shadow-soft overflow-hidden">
      <div className="flex items-center justify-between gap-3 px-4 sm:px-5 pt-4 pb-2">
        <div className="min-w-0">
          <div className="text-[11px] font-bold tracking-[.16em] uppercase text-muted">Who owes whom</div>
          <div className="text-[12.5px] text-muted mt-0.5 truncate">${mode === 'direct' ? 'Every live debt, person to person' : 'The fewest payments to clear it all'}</div>
        </div>
        <div id="tour-toggle" className="flex bg-paper border border-line rounded-full p-0.5 text-[12px] font-semibold shrink-0">
          ${[['direct','Direct'],['simple','Simplified']].map(([k, l]) => html`<button key=${k} onClick=${() => setMode(k)}
            className=${'px-3 py-1.5 rounded-full transition ' + (mode === k ? 'bg-ink text-paper' : 'text-muted hover:text-ink')}>${l}</button>`)}
        </div>
      </div>
      <${DebtRows} items=${mode === 'direct' ? edges : simplified} verb=${mode === 'direct' ? 'owes' : 'pays'}
        byId=${byId} onSettle=${openSettle} onSelect=${id => setSelected(selected === id ? null : id)}/>
    </div>

    ${selected && html`<${MemberPanel} key=${selected} group=${group} memberId=${selected} edges=${edges} net=${net}
      byId=${byId} onClose=${() => setSelected(null)} onSettle=${openSettle}/>`}

    <div className="mt-5" id="tour-settle"><${SettleSuggestions} items=${simplified} byId=${byId} onSettle=${openSettle}/></div>
    <div className="mt-4"><${SettleHistory} group=${group} byId=${byId}/></div>
  </div>`;
}
